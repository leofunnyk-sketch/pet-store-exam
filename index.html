<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>社区宠物店 · 专业知识学习与考核系统</title>
<style>
:root{
  --primary:#ff7a45; --primary-d:#e8622f; --bg:#fff7f0; --card:#ffffff;
  --line:#ffe2d2; --text:#33312e; --sub:#8a837c; --ok:#2fae5a; --bad:#e8453c;
  --soft:#fff1e8; --chip:#ffe9dc; --chip-on:#ff7a45;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:40px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{background:linear-gradient(135deg,#ff8a5c,#ff6b35);color:#fff;padding:18px 14px 14px;
  text-align:center;box-shadow:0 2px 10px rgba(255,122,69,.25)}
header h1{font-size:20px;font-weight:800;letter-spacing:.5px}
header p{font-size:12px;opacity:.92;margin-top:4px}
.tabs{display:flex;gap:6px;background:#fff;padding:8px;position:sticky;top:0;z-index:20;
  box-shadow:0 2px 8px rgba(0,0,0,.05);overflow-x:auto}
.tab{flex:1;min-width:72px;text-align:center;padding:9px 4px;border-radius:10px;font-size:14px;
  font-weight:700;color:var(--sub);background:var(--soft);cursor:pointer;white-space:nowrap;border:none}
.tab.on{background:var(--primary);color:#fff;box-shadow:0 3px 8px rgba(255,122,69,.35)}
.controls{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0;align-items:center}
.ctl{display:flex;flex-direction:column;gap:3px}
.ctl label{font-size:11px;color:var(--sub)}
select,input[type=text],input[type=number]{border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;font-size:13px;background:#fff;color:var(--text);min-width:96px}
input[type=text]{flex:1;min-width:120px}
.btn{border:none;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:700;
  background:var(--primary);color:#fff;cursor:pointer;box-shadow:0 3px 8px rgba(255,122,69,.3)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--soft);color:var(--primary-d)}
.btn.sm{padding:6px 11px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 10px}
.chip{font-size:12px;padding:5px 11px;border-radius:20px;background:var(--chip);color:#a85a36;
  cursor:pointer;border:none}
.chip.on{background:var(--chip-on);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
  margin-bottom:12px;box-shadow:0 2px 8px rgba(255,122,69,.06)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--primary-d)}
.tag.th{background:#eef6ff;color:#2b7de0}
.tag.df{background:#fff4e0;color:#c8851a}
.tag.ty{background:#eee;color:#777}
.q{font-size:15px;font-weight:600;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;
  background:#fff;cursor:pointer;text-align:left;transition:.15s}
.opt:active{background:var(--soft)}
.opt.sel{border-color:var(--primary);background:var(--soft);font-weight:700}
.opt.ok{background:#e7f8ee;border-color:var(--ok);color:#1c7a3e;font-weight:700}
.opt.bad{background:#fdeceb;border-color:var(--bad);color:#b8302a;font-weight:700}
.ans{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:13px;display:none}
.ans.show{display:block}
.ans b{color:var(--primary-d)}
.feedback{margin-top:10px;font-size:14px;font-weight:700;display:none}
.feedback.show{display:block}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.progress{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.progress>i{display:block;height:100%;background:var(--primary);width:0;transition:.2s}
.counter{font-size:13px;color:var(--sub);font-weight:700}
.stat{display:flex;gap:10px;flex-wrap:wrap;padding:6px 0 10px}
.stat .box{flex:1;min-width:90px;background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:10px;text-align:center}
.stat .box b{font-size:20px;color:var(--primary);display:block}
.stat .box span{font-size:11px;color:var(--sub)}
.report h2{font-size:18px;margin:6px 0 10px}
.bar{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.bar .lab{width:96px;color:var(--sub)}
.bar .track{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .track>i{display:block;height:100%;background:var(--primary)}
.bar .v{width:48px;text-align:right;font-weight:700}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
.tip{font-size:12px;color:var(--sub);padding:6px 2px}
.kbd{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px}
.foot{text-align:center;color:#bbb;font-size:11px;padding:18px}
</style>
</head>
<body>
<header>
  <h1>🐾 社区宠物店 · 专业知识系统</h1>
  <p>学习 · 练习 · 考核 · 错题本 —— 覆盖营养喂养 / 美容护理 / 品种鉴赏 / 店铺运营</p>
</header>
<div class="wrap">
  <div class="tabs">
    <button class="tab on" data-mode="learn">📚 学习</button>
    <button class="tab" data-mode="practice">✏️ 练习</button>
    <button class="tab" data-mode="exam">📝 考核</button>
    <button class="tab" data-mode="wrong">📕 错题本</button>
  </div>
  <div id="controls"></div>
  <div id="app"></div>
  <div class="foot">数据本地存储于浏览器（错题本/进度），不会上传 · 题库共 <span id="totalN">0</span> 题</div>
</div>

<script>
const QUESTIONS = [{"theme":"feeding","type":"single","difficulty":1,"question":"幼犬（3-6月龄）每日建议喂食次数是？","options":["1餐","2餐","3-4餐","自由采食"],"answer":"3-4餐","explanation":"幼犬肠胃容量小，需要少食多餐","id":1,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"成犬（6月龄以上）每日建议喂食次数是？","options":["1餐","2餐","3餐","4餐"],"answer":"2餐","explanation":"成犬早晚两餐即可","id":2,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"2-3月龄幼犬每日建议喂食几次？","options":["2次","3次","4-5次","6次"],"answer":"4-5次","explanation":"2-3月龄肠胃更小，需4-5次","id":3,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"老年犬（7岁以上）每日建议喂食几次？","options":["1次","2次","3次","4次"],"answer":"2次","explanation":"老年犬代谢慢，早晚两餐","id":4,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"一只5kg的成犬，按体重2%-3%系数，每日喂食量约多少克？","options":["50-80g","100-150g","150-200g","200-250g"],"answer":"100-150g","explanation":"5kg×2%-3%=100-150g","id":5,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"一只10kg的成犬，每日喂食量约多少克？","options":["100-150g","200-300g","300-400g","400-500g"],"answer":"200-300g","explanation":"10kg×2%-3%=200-300g","id":6,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"判断狗狗胖瘦的标准方法是？","options":["看体重","摸肋骨","看腰围","看食欲"],"answer":"摸肋骨","explanation":"能轻松摸到肋骨但看不出=标准体型","id":7,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"狗狗饭后腹部应该是什么状态？","options":["鼓得很硬","微微鼓起不发硬","完全扁平","越鼓越好"],"answer":"微微鼓起不发硬","explanation":"微微鼓起不发硬=刚好","id":8,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"小型犬喂养最需要注意的是？","options":["容易低血糖","容易发胖","容易掉毛","容易缺钙"],"answer":"容易低血糖","explanation":"小型犬代谢快，易低血糖，少吃多餐更稳妥","id":9,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"狗狗每天吃几餐最健康？","options":["越多越好","定时定量","饿了就喂","看心情"],"answer":"定时定量","explanation":"定时定量最健康","id":10,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"给狗狗换粮应该用什么方法？","options":["直接全换","7日换粮法","混合喂一周","逐步减少旧粮"],"answer":"7日换粮法","explanation":"7日换粮法：新旧粮混合，一周内逐步替换，避免肠胃应激","id":11,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"7日换粮法第1-2天新粮占比应该是？","options":["25%","50%","75%","100%"],"answer":"25%","explanation":"第1-2天新粮25%+旧粮75%","id":12,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"7日换粮法第5-7天新粮占比应该是？","options":["25%","50%","75%","100%"],"answer":"75%","explanation":"第5-7天新粮75%+旧粮25%","id":13,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"换粮可以直接全换，狗狗肠胃适应力强。","options":["正确","错误"],"answer":"错误","explanation":"突然换粮会导致软便呕吐，必须用7日过渡法","id":14,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"换粮期间出现轻微软便是正常的，可以继续观察。","options":["正确","错误"],"answer":"正确","explanation":"换粮期间轻微软便正常，持续2-3天无改善需换回原粮","id":15,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户刚买了一袋新狗粮，想今天就给狗狗全换上，你会怎么建议？","options":null,"answer":"建议用7日换粮法：第1-2天新粮25%+旧粮75%，第3-4天各50%，第5-7天新粮75%+旧粮25%，一周后全换。突然全换容易导致肠胃应激、软便呕吐","explanation":"7日换粮法步骤","id":16,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户说换粮后狗狗软便3天了，应该怎么办？","options":null,"answer":"先暂停换粮，换回原粮观察2天。如果恢复正常，说明新粮不适合或换粮太快。之后用更慢的速度重新过渡（延长到10-14天）","explanation":"换粮不适的处理","id":17,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"换粮期间狗狗出现呕吐，应该怎么做？","options":["继续喂新粮","立即停止换粮","加大量喂","喂止吐药"],"answer":"立即停止换粮","explanation":"呕吐说明肠胃严重不适，立即停止换粮换回原粮","id":18,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"以下哪种食物对狗狗是安全的？","options":["巧克力","鸡胸肉","葡萄","洋葱"],"answer":"鸡胸肉","explanation":"鸡胸肉对狗狗安全，巧克力有毒","id":19,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"以下哪种食物对狗狗是安全的？","options":["葡萄","胡萝卜","洋葱","木糖醇"],"answer":"胡萝卜","explanation":"胡萝卜对狗狗安全，葡萄有毒","id":20,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"以下哪种食物对狗狗是安全的？","options":["洋葱","南瓜","木糖醇","大蒜"],"answer":"南瓜","explanation":"南瓜对狗狗安全，洋葱有毒","id":21,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"以下哪种食物对狗狗是安全的？","options":["木糖醇","西兰花","大蒜","牛油果"],"answer":"西兰花","explanation":"西兰花对狗狗安全，木糖醇有毒","id":22,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"以下哪种食物对狗狗是安全的？","options":["大蒜","苹果(去核)","牛油果","夏威夷果"],"answer":"苹果(去核)","explanation":"苹果(去核)对狗狗安全，大蒜有毒","id":23,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"以下哪种食物对狗狗是安全的？","options":["牛油果","蓝莓","夏威夷果","酒精"],"answer":"蓝莓","explanation":"蓝莓对狗狗安全，牛油果有毒","id":24,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"以下哪种食物对狗狗是安全的？","options":["夏威夷果","香蕉","酒精","咖啡因"],"answer":"香蕉","explanation":"香蕉对狗狗安全，夏威夷果有毒","id":25,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"以下哪种食物对狗狗是安全的？","options":["酒精","煮熟的蛋黄","咖啡因","生鸡蛋"],"answer":"煮熟的蛋黄","explanation":"煮熟的蛋黄对狗狗安全，酒精有毒","id":26,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"以下哪种食物对狗狗是安全的？","options":["咖啡因","无盐花生酱","生鸡蛋","巧克力"],"answer":"无盐花生酱","explanation":"无盐花生酱对狗狗安全，咖啡因有毒","id":27,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"以下哪种食物对狗狗是安全的？","options":["生鸡蛋","红薯","巧克力","葡萄"],"answer":"红薯","explanation":"红薯对狗狗安全，生鸡蛋有毒","id":28,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"狗狗可以少量吃巧克力，只要不吃多就没事。","options":["正确","错误"],"answer":"错误","explanation":"巧克力含可可碱，对狗狗是致命的，即使少量也危险","id":29,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"葡萄对狗狗有毒，但葡萄干没问题。","options":["正确","错误"],"answer":"错误","explanation":"葡萄和葡萄干都对狗狗有毒，可导致急性肾衰竭","id":30,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户说狗狗刚才偷吃了一颗葡萄，应该怎么办？","options":null,"answer":"立即联系宠物医院。葡萄对狗狗有急性肾毒性，即使一颗也可能中毒。观察是否呕吐/腹泻/精神萎靡，尽快就医","explanation":"葡萄中毒的应急处理","id":31,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户问\"能不能给狗狗喂人吃的饭菜\"，你怎么回答？","options":null,"answer":"不建议。人类饭菜重油重盐，狗狗肾脏代谢能力远不如人类，长期吃会导致泪痕加重、毛发干枯、慢性肾病。可以偶尔给无盐无油蒸熟的鸡胸肉或蔬菜","explanation":"人类食物对狗狗的危害","id":32,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"选狗粮时，配料表前三位应该是什么？","options":["谷物","肉类","蔬菜","添加剂"],"answer":"肉类","explanation":"前三位必须是肉（鲜肉>肉粉>谷物）","id":33,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"优质成犬粮粗蛋白含量建议不低于多少？","options":["18%","22%","26%","30%"],"answer":"26%","explanation":"成犬粮粗蛋白≥26%，优质粮通常≥30%","id":34,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"优质幼犬粮粗蛋白含量建议不低于多少？","options":["22%","26%","28%","32%"],"answer":"28%","explanation":"幼犬需要更高蛋白，建议≥28%","id":35,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"狗粮中钙磷比最佳比例约是多少？","options":["1:1","1.2:1","2:1","0.8:1"],"answer":"1.2:1","explanation":"钙磷比1.2:1对骨骼发育最关键","id":36,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"狗粮越贵越好，进口的一定比国产的好。","options":["正确","错误"],"answer":"错误","explanation":"不是越贵越好，要适合狗狗的年龄、体型和体质。有些国产优质粮性价比更高","id":37,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"散装粮便宜又实惠，可以放心买。","options":["正确","错误"],"answer":"错误","explanation":"散装粮来源不明，可能是劣质粮或过期粮，不建议购买","id":38,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户让你推荐一款狗粮，你会怎么帮他选？","options":null,"answer":"1.看配料表前三位必须是肉；2.查营养成分（粗蛋白≥26%）；3.选适合年龄段的（幼犬/成犬/老年）；4.观察狗狗吃后的反应（便便成型/毛发光亮/无泪痕）；5.不盲目追贵价粮","explanation":"狗粮选择方法","id":39,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"肠胃敏感的狗狗，建议选择什么工艺的狗粮？","options":["高温膨化","酶解/低温烘焙","冻干","风干"],"answer":"酶解/低温烘焙","explanation":"酶解和低温烘焙工艺更好吸收，适合肠胃敏感犬","id":40,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"容易有泪痕的狗狗，建议选择什么配方的狗粮？","options":["牛肉配方","鸭肉梨配方","鸡肉配方","鱼肉配方"],"answer":"鸭肉梨配方","explanation":"鸭肉梨配方清淡，有助于改善泪痕","id":41,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"狗狗可以长期吃同一款粮，不用换。","options":["正确","错误"],"answer":"错误","explanation":"不建议长期吃同一款粮，营养可能不均衡，建议定期更换或搭配","id":42,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"零食每日占比不应超过狗狗总食量的多少？","options":["5%","10%","20%","30%"],"answer":"10%","explanation":"零食不超过每日总食量10%，防止挑食和肥胖","id":43,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"零食可以替代主食，只要狗狗爱吃就行。","options":["正确","错误"],"answer":"错误","explanation":"零食不能替代主食，营养不均衡，且容易养成挑食习惯","id":44,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户说狗狗特别爱吃零食，不爱吃狗粮了，怎么办？","options":null,"answer":"1.停止随意喂零食；2.定时定量喂狗粮，15分钟不吃就收走；3.零食只在训练奖励时给；4.坚持几天狗狗就会恢复正常吃粮","explanation":"挑食的纠正方法","id":45,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"给狗狗添加辅食（如鸡胸肉/蔬菜），可替代主粮的比例不超过多少？","options":["5%","10%","20%","30%"],"answer":"10%","explanation":"辅食可替代不超过10%的主粮","id":46,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户想给狗狗补充营养，买了一堆钙片和美毛膏，你的建议是？","options":null,"answer":"健康狗狗不需要额外补充营养品。过量补钙会导致骨骼畸形，美毛产品效果有限。日常主食达标、饮食干净规律就是最好的营养。只有换季体弱或肠胃敏感时可少量搭配益生菌","explanation":"营养补充的正确观念","id":47,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"狗狗的水需要每天更换，保持新鲜。","options":["正确","错误"],"answer":"正确","explanation":"水必须每天更换，避免细菌滋生","id":48,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"狗狗可以喝牛奶，有营养。","options":["正确","错误"],"answer":"错误","explanation":"很多狗狗乳糖不耐受，喝牛奶会腹泻。应该喂清水或宠物专用奶","id":49,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"狗狗的饮水应该多久换一次？","options":["每天","每两天","每周","喝完再加"],"answer":"每天","explanation":"每天至少换一次，保持新鲜清洁","id":50,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"幼犬到家第一周最应该做什么？","options":["立即洗澡","立即驱虫","隔离观察+体检","带出去社交"],"answer":"隔离观察+体检","explanation":"幼犬到家先隔离观察，一周内完成体检，确认健康后再驱虫疫苗","id":51,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"老年犬（7岁以上）饮食最需要注意的是？","options":["高蛋白","低脂肪高纤维","高热量","多补钙"],"answer":"低脂肪高纤维","explanation":"老年犬代谢慢，应选低脂肪高纤维配方，减轻肾脏和肠胃负担","id":52,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户刚接回家一只2月龄幼犬，问你第一周应该做什么？","options":null,"answer":"1.隔离观察，不要急着洗澡/带出门；2.一周内完成体检；3.按时接种疫苗和驱虫；4.喂食幼犬粮，每天4-5餐少量多餐；5.保证新鲜饮水","explanation":"幼犬到家第一周注意事项","id":53,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户说8岁的狗狗最近食欲下降，你应该建议什么？","options":null,"answer":"1.先检查是否有健康问题（牙齿/肠胃/肝肾）；2.换老年犬专用粮（低脂肪高纤维）；3.少量多餐；4.适当泡软狗粮；5.定期体检","explanation":"老年犬食欲下降的处理","id":54,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"狗狗肥胖最容易导致什么健康问题？","options":["皮肤病","关节问题+心脏负担","掉毛","泪痕"],"answer":"关节问题+心脏负担","explanation":"肥胖压迫关节骨骼，增加心脏负担","id":55,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户说狗狗太胖了，想帮它减肥，你的建议是？","options":null,"answer":"1.控制食量（减少10-20%）；2.选低脂配方粮；3.增加运动量；4.停喂零食或换低卡零食；5.每周称重监测","explanation":"狗狗减肥方案","id":56,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"狗狗胖乎乎的说明养得好，不用减肥。","options":["正确","错误"],"answer":"错误","explanation":"肥胖会导致关节问题、心脏负担、糖尿病等，必须控制体重","id":57,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户问\"狗狗一天应该吃多少\"，你怎么回答？","options":null,"answer":"根据体重计算：每日总量(g)=体重(kg)×系数。幼犬约4%-6%，成犬约2%-3%。具体看狗粮包装建议，再根据活动量微调。摸肋骨判断胖瘦：能摸到但看不出=标准","explanation":"喂食量计算方法","id":58,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户说狗狗吃完就拉，一天拉4-5次，正常吗？","options":null,"answer":"需要了解具体情况：便便形态如何？如果是成型软便，可能是喂多了或粮不合适。如果是稀便/水便，可能是肠胃问题，建议就医。正常成犬每天1-2次大便","explanation":"排便频率的判断","id":59,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户问\"狗狗可以吃水果吗\"，你怎么回答？","options":null,"answer":"部分水果可以少量吃：苹果(去核)、蓝莓、香蕉、西瓜(去籽)。但有些水果有毒：葡萄/葡萄干、牛油果、樱桃核。给之前先查一下是否安全","explanation":"狗狗能吃的水果","id":60,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户说狗狗吃饭的时候特别急，几秒就吃完了，有问题吗？","options":null,"answer":"吃太快容易消化不良和呕吐。建议：1.用慢食碗；2.分多次喂；3.把粮撒在垫子上让狗狗找着吃；4.观察是否有呕吐或消化不良","explanation":"进食过快的处理","id":61,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户问\"狗狗需要喝骨头汤补钙吗\"，你怎么回答？","options":null,"answer":"不需要也不建议。骨头汤脂肪含量��，钙含量低，还可能有骨渣划伤肠胃。健康狗狗吃优质狗粮就能满足钙需求，不需要额外补","explanation":"补钙的正确方式","id":62,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户说狗狗最近掉毛特别严重，和饮食有关系吗？","options":null,"answer":"有关系。可能原因：1.粮太咸太油→换清淡配方；2.营养不均衡→选优质粮；3.过敏→排查食物过敏源；4.也可能是换毛季或皮肤病，需要检查","explanation":"掉毛与饮食的关系","id":63,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户问\"幼犬和成犬的狗粮有什么区别\"，你怎么回答？","options":null,"answer":"幼犬粮蛋白质≥28%、热量高、颗粒小，满足快速生长需求。成犬粮蛋白质≥26%、营养均衡。不能混吃，幼犬吃成犬粮会营养不良，成犬吃幼犬粮会肥胖","explanation":"幼犬粮vs成犬粮","id":64,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户说家里有两只狗，一大一小，可以喂同一款粮吗？","options":null,"answer":"不建议。大型犬和小型犬的营养需求不同，颗粒大小也不同。建议分开喂，各吃各的粮。如果一定要喂同一款，选全犬种通用粮","explanation":"多狗家庭的喂养","id":65,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户问\"狗狗可以吃生肉吗\"，你怎么回答？","options":null,"answer":"不建议喂生肉。生肉可能含寄生虫和细菌（沙门氏菌/大肠杆菌），有感染风险。如果要喂，选正规渠道的生骨肉配方粮，或把肉煮熟再喂","explanation":"生肉喂养的风险","id":66,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"狗狗喂食后多久可以剧烈运动？","options":["立即","30分钟后","1小时后","2小时后"],"answer":"1小时后","explanation":"饭后立即剧烈运动容易导致胃扭转，尤其大型犬","id":67,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"狗狗吃骨头可以补钙。","options":["正确","错误"],"answer":"错误","explanation":"煮熟的骨头容易碎裂划伤肠胃，且钙吸收率低。不建议喂骨头","id":68,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"狗狗吃了洋葱后可能出现的症状是？","options":["兴奋","溶血性贫血","发胖","掉毛"],"answer":"溶血性贫血","explanation":"洋葱含硫化物，会破坏红细胞导致溶血性贫血","id":69,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户说狗狗吃了半块巧克力蛋糕，现在很兴奋，要紧吗？","options":null,"answer":"巧克力含可可碱，对狗狗有毒。半块蛋糕的量需要看狗狗的体重。建议立即联系宠物医院，观察是否呕吐/腹泻/心跳加速/抽搐，必要时催吐","explanation":"巧克力中毒的处理","id":70,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"狗狗泪痕严重，饮食上应该怎么做？","options":["多喂肉","换清淡配方粮","多喂零食","多喝水"],"answer":"换清淡配方粮","explanation":"泪痕与饮食过油过咸有关，建议换鸭肉梨等清淡配方","id":71,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"狗狗可以吃猫粮，反正都是宠物粮。","options":["正确","错误"],"answer":"错误","explanation":"猫粮蛋白质含量更高，长期吃会导致狗狗肥胖和营养失衡","id":72,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"狗狗吃完饭后多久排便比较正常？","options":["立即","30分钟-2小时","4-6小时","8小时以上"],"answer":"30分钟-2小时","explanation":"饭后30分钟-2小时排便是正常的消化周期","id":73,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户问\"狗狗需要吃益生菌吗\"，你怎么回答？","options":null,"answer":"健康狗狗不需要长期吃益生菌。只有在换粮期、肠胃不适、换季体弱时可以少量搭配。长期吃反而可能影响肠道菌群自然平衡","explanation":"益生菌的使用时机","id":74,"tag":"营养喂养(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"给狗狗洗澡的水温应该控制在多少度？","options":["30-32°C","37-38°C","42-45°C","25-28°C"],"answer":"37-38°C","explanation":"与狗狗体温接近，37-38°C最舒适","id":75,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"健康狗狗建议洗澡频率是？","options":["每周1次","每月1-2次","每2月1次","每天"],"answer":"每月1-2次","explanation":"过于频繁会破坏皮肤油脂层","id":76,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"狗狗洗澡越频繁越干净越健康。","options":["正确","错误"],"answer":"错误","explanation":"过于频繁洗澡会破坏皮肤油脂层，导致皮肤干燥瘙痒","id":77,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"给狗狗洗澡前不需要先梳毛，直接洗就行。","options":["正确","错误"],"answer":"错误","explanation":"洗澡前必须先梳通毛发，湿水后毛结更紧更难处理","id":78,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"给狗狗洗澡时，应该从哪里开始打湿？","options":["头部","背部","四肢","尾巴"],"answer":"四肢","explanation":"从四肢开始慢慢打湿全身，避免头部直接冲水","id":79,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"宠物香波稀释比例一般是？","options":["1:1","1:5","1:10","不用稀释"],"answer":"1:5","explanation":"香波稀释1:5，避免残留导致皮肤问题","id":80,"tag":"美容护理(基础)"},{"theme":"grooming","type":"scenario","difficulty":2,"question":"客户问\"为什么我家狗洗完澡后会抓挠皮肤\"，可能的原因是？","options":null,"answer":"1.香波残留没冲干净；2.洗澡太频繁破坏皮肤油脂层；3.没彻底吹干导致湿疹；4.香波不适合该犬种肤质","explanation":"洗澡后抓挠的原因","id":81,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"遇到大毛结，正确的处理方式是？","options":["用排梳硬性拉扯","用开结刀打开","直接剃光","用水泡软再梳"],"answer":"用开结刀打开","explanation":"不能硬拉，用开结刀或剪刀分成小结再梳","id":82,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"梳毛的正确顺序是？","options":["从头到尾","从尾到头","从四肢到身体","随意梳"],"answer":"从头到尾","explanation":"一般按后肢→臀部→背部→腹部→肩部→前肢→颈部→头部→尾巴顺序","id":83,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"遇到紧贴皮肤的大毛结，应该怎么做？","options":["硬梳开","剪掉","剃掉(主人同意)","不管它"],"answer":"剃掉(主人同意)","explanation":"紧贴皮肤的毛结需主人同意后用电剪贴皮肤剃除，小心不伤皮肤","id":84,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"梳毛时可以用力拉扯毛结，反正狗狗不会痛。","options":["正确","错误"],"answer":"错误","explanation":"不能硬性拉扯，会造成狗狗疼痛和皮肤损伤","id":85,"tag":"美容护理(基础)"},{"theme":"grooming","type":"scenario","difficulty":2,"question":"一只比熊来美容，毛发严重打结，你的处理流程是？","options":null,"answer":"1.先用手轻轻撕松毛结；2.用针梳从毛尖向毛根一点点梳开；3.大毛结用开结刀或剪刀分成小结；4.紧贴皮肤的毛结询问主人是否剃除；5.全程动作轻柔，避免疼痛","explanation":"严重打结的处理流程","id":86,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"梳毛时发现皮肤有红肿/结痂，应该怎么做？","options":["继续梳","避开伤口继续","停止操作告知主人","剃掉那块的毛"],"answer":"停止操作告知主人","explanation":"发现皮肤问题需及时告知主人，建议就医","id":87,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"长毛犬每天都需要梳毛。","options":["正确","错误"],"answer":"正确","explanation":"长毛犬容易打结，需要每天梳毛预防","id":88,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"给狗狗吹干毛发，最重要的是？","options":["吹得快","底层毛完全干燥","吹得蓬松","用高温"],"answer":"底层毛完全干燥","explanation":"底层毛不干燥容易引发湿疹和真菌性皮肤病","id":89,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"吹干狗狗毛发的正确方法是？","options":["自然晾干","吹水机+针梳拉毛","只用吹风机","太阳晒干"],"answer":"吹水机+针梳拉毛","explanation":"先用高速吹水机去水，再用吹风机配合针梳边吹边梳","id":90,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"狗狗洗完澡可以自然晾干，不用吹干。","options":["正确","错误"],"answer":"错误","explanation":"自然晾干容易导致底层毛不干，引发皮肤病","id":91,"tag":"美容护理(基础)"},{"theme":"grooming","type":"scenario","difficulty":2,"question":"客户问\"为什么我家狗在家洗完澡第二天就臭了\"，可能的原因是？","options":null,"answer":"底层毛没吹干，潮湿环境滋生细菌导致异味。建议用吹水机彻底吹干底层毛，特别是腋下、腹部、脚趾间等潮湿部位","explanation":"吹干不彻底的问题","id":92,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"给狗狗剪指甲，应该剪到血线以上多少？","options":["0mm","1-2mm","5mm","越短越好"],"answer":"1-2mm","explanation":"剪到血线以上1-2mm，避免出血","id":93,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"黑色指甲看不到血线，应该怎么剪？","options":["随便剪","每次剪一点慢慢试","不剪","剪到最短"],"answer":"每次剪一点慢慢试","explanation":"黑色指甲看不到血线，每次剪一点直到看到粉色为止","id":94,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"指甲剪到血线没关系，出点血是正常的。","options":["正确","错误"],"answer":"错误","explanation":"剪到血线会出血疼痛，应立即用止血粉按压止血","id":95,"tag":"美容护理(基础)"},{"theme":"grooming","type":"scenario","difficulty":2,"question":"美容师不小心剪到狗狗血线出血了，应该怎么处理？","options":null,"answer":"1.立即停止操作；2.止血粉按压约5分钟；3.碘伏消毒；4.向主人道歉；5.赠送零食或优惠券；6.若伤口大建议就医","explanation":"剪到血线的应急处理","id":96,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"狗狗指甲建议多久剪一次？","options":["每周","每2-3周","每2个月","半年"],"answer":"每2-3周","explanation":"每2-3周剪一次，根据生长速度调整","id":97,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"清洁狗狗耳道，应该用什么？","options":["酒精","双氧水","宠物专用耳道清洁液","清水"],"answer":"宠物专用耳道清洁液","explanation":"酒精和双氧水会刺激耳道皮肤","id":98,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"清洁耳道时，棉签可以深入耳道多深？","options":["越深越好","不深入","5cm","3cm"],"answer":"不深入","explanation":"不要深入耳道深处，避免损伤鼓膜","id":99,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"耳道分泌物是褐色且有异味，是正常的。","options":["正确","错误"],"answer":"错误","explanation":"褐色/脓性分泌物+恶臭可能是中耳炎或耳螨，需告知主人建议就医","id":100,"tag":"美容护理(基础)"},{"theme":"grooming","type":"scenario","difficulty":2,"question":"清洁耳道时发现棉棒上有褐色分泌物且有恶臭，应该怎么做？","options":null,"answer":"1.停止清洁；2.告知主人异常情况；3.建议带狗狗去宠物医院检查；4.可能是中耳炎或耳螨，不要自行处理","explanation":"耳道异常的处理","id":101,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"短鼻扁脸犬（法斗/巴哥）美容时最需要注意的是？","options":["毛发打结","呼吸道问题","皮肤干燥","指甲过长"],"answer":"呼吸道问题","explanation":"短鼻犬呼吸道短，美容时容易呼吸抑制","id":102,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"以下哪种犬种全身剃光是绝对禁忌？","options":["贵宾","比熊","金毛/哈士奇（双层被毛）","雪纳瑞"],"answer":"金毛/哈士奇（双层被毛）","explanation":"双层被毛是天然隔热防晒层，剃光会破坏毛囊","id":103,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"给法斗做美容，吹毛温度应该低于多少度？","options":["40°C","35°C","30°C","25°C"],"answer":"30°C","explanation":"短鼻犬吹毛温度必须低于30°C，防止呼吸抑制","id":104,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"给法斗美容时，应该让狗狗保持什么姿势？","options":["仰躺","侧躺","站立","趴着"],"answer":"侧躺","explanation":"侧躺不仰躺，仰躺会压迫气道","id":105,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"给哈士奇剃光毛发可以帮助它降温。","options":["正确","错误"],"answer":"错误","explanation":"哈士奇是双层被毛，剃光会破坏隔热层，更容易中暑且可能毛囊坏死","id":106,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"小型犬（吉娃娃/博美）可以长时间站立在美容台上。","options":["正确","错误"],"answer":"错误","explanation":"小型犬心脏负荷小，容易应激，不要长时间站立，美容台要铺防滑垫","id":107,"tag":"美容护理(基础)"},{"theme":"grooming","type":"scenario","difficulty":2,"question":"一只法斗来美容，你会特别注意什么？","options":null,"answer":"1.吹毛温度低于30°C；2.让狗狗侧躺不仰躺；3.不能用毛巾包裹口鼻；4.全程关注呼吸状态；5.褶皱处要翻开彻底清洁并擦干","explanation":"短鼻犬美容注意事项","id":108,"tag":"美容护理(基础)"},{"theme":"grooming","type":"scenario","difficulty":2,"question":"一只金毛来美容，主人要求全身剃光，你会怎么做？","options":null,"answer":"拒绝并解释：金毛是双层被毛，剃光会破坏天然隔热防晒层，可能导致毛囊坏死、毛发长不回来。建议只修剪脚底、腹底、屁股周围杂毛","explanation":"双层被毛犬的美容禁忌","id":109,"tag":"美容护理(基础)"},{"theme":"grooming","type":"scenario","difficulty":2,"question":"一只吉娃娃来美容，你会特别注意什么？","options":null,"answer":"1.不要长时间站立在美容台；2.美容台铺防滑垫防摔落；3.腹部毛发少容易失温，做好保暖；4.动作轻柔避免应激","explanation":"小型犬美容注意事项","id":110,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"猫咪和狗狗一样，需要经常洗澡。","options":["正确","错误"],"answer":"错误","explanation":"猫咪自身清洁能力强，能不洗就不洗，梳毛+剪指甲就够","id":111,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"猫咪美容的黄金原则是？","options":["经常洗澡","能不洗就不洗","用狗狗的香波","剃光毛发"],"answer":"能不洗就不洗","explanation":"猫咪高应激体质，90%的美容需求梳毛+剪指甲就够","id":112,"tag":"美容护理(基础)"},{"theme":"grooming","type":"scenario","difficulty":2,"question":"客户想给猫咪洗澡，你会怎么建议？","options":null,"answer":"建议不洗。猫咪自身清洁能力强，频繁洗澡会导致应激。如果确实需要（如特别脏），要用猫咪专用香波，动作轻柔快速，避免应激","explanation":"猫咪洗澡的建议","id":113,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"美容工具每次使用后应该怎么处理？","options":["不用处理","清水冲洗","浸泡消毒液30分钟","擦干净就行"],"answer":"浸泡消毒液30分钟","explanation":"工具用后需浸泡含氯消毒液(1:100)30分钟，防交叉感染","id":114,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"美容工具可以多人共用，不用消毒。","options":["正确","错误"],"answer":"错误","explanation":"工具必须每个宠物用后消毒，防止交叉感染","id":115,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"给狗狗美容，发现宠物有传染性皮肤病，应该怎么做？","options":["继续服务","拒绝服务建议就医","只做一半","戴手套继续"],"answer":"拒绝服务建议就医","explanation":"传染性皮肤病需拒绝服务，防止交叉感染","id":116,"tag":"美容护理(基础)"},{"theme":"grooming","type":"scenario","difficulty":3,"question":"美容过程中狗狗突然抽搐、呼吸困难，你应该怎么做？","options":null,"answer":"1.立即停止操作；2.将狗狗放在安静通风处；3.不要强迫接触；4.立即联系宠物医院；5.通知主人；6.记录过程","explanation":"严重应激的应急处理","id":117,"tag":"美容护理(基础)"},{"theme":"grooming","type":"scenario","difficulty":3,"question":"美容过程中狗狗突然咬伤美容师，应该怎么处理？","options":null,"answer":"1.立即停止操作；2.处理伤口（清洗+消毒）；3.记录事件；4.告知主人；5.评估是否继续服务；6.必要时就医","explanation":"咬伤的应急处理","id":118,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"美容时狗狗一直发抖，说明它很冷，应该继续。","options":["正确","错误"],"answer":"错误","explanation":"发抖可能是紧张/恐惧/应激，应暂停操作安抚","id":119,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"宠物美容的第一步是？","options":["直接洗澡","报到与沟通+健康初检","梳毛","吹干"],"answer":"报到与沟通+健康初检","explanation":"先沟通需求+检查皮肤/耳道/指甲健康状况","id":120,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"给狗狗挤肛门腺的正确位置是肛门两侧几点方向？","options":["3点和9点","4点和8点","6点和12点","2点和10点"],"answer":"4点和8点","explanation":"肛门腺开口约在4点和8点位置","id":121,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"肛门腺分泌物是脓性/血性/恶臭，是正常的。","options":["正确","错误"],"answer":"错误","explanation":"脓性/血性/恶臭分泌物可能是肛门腺炎，需告知主人建议就医","id":122,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"给狗狗美容，耳朵进水了应该怎么办？","options":["不管它","用棉签深入擦","滴入耳道清洁液按摩后擦外耳","用吹风机吹"],"answer":"滴入耳道清洁液按摩后擦外耳","explanation":"不要深入耳道，用清洁液+棉球擦外耳","id":123,"tag":"美容护理(基础)"},{"theme":"grooming","type":"scenario","difficulty":2,"question":"客户问\"美容和洗澡有什么区别\"，你怎么回答？","options":null,"answer":"洗澡=基础清洁（洗+吹干+基础护理）。美容=洗澡+造型修剪（剪毛/修型/脸部造型/脚部修圆）。美容包含洗澡但不止于洗澡","explanation":"洗澡vs美容的区别","id":124,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"给长毛犬美容，吹干时应该用什么梳子配合？","options":["排梳","针梳","开结梳","不用梳子"],"answer":"针梳","explanation":"吹干时用针梳边吹边梳，确保底层毛干燥","id":125,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"给狗狗美容可以用人类的洗发水。","options":["正确","错误"],"answer":"错误","explanation":"人类洗发水pH值不符，会损伤狗狗皮肤。必须用宠物专用香波","id":126,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"给狗狗修剪脚底毛的主要目的是？","options":["好看","防止打滑+沾染污物","防止掉毛","让脚变小"],"answer":"防止打滑+沾染污物","explanation":"脚底毛过长会导致行走打滑和沾染污物","id":127,"tag":"美容护理(基础)"},{"theme":"grooming","type":"scenario","difficulty":2,"question":"客户问\"我家狗多久应该做一次美容\"，你怎么回答？","options":null,"answer":"根据品种：贵宾/比熊等卷毛犬1-2个月一次；长毛犬2-3个月一次；短毛犬3-4个月一次。日常护理（梳毛/指甲/耳道）每2-3周一次","explanation":"美容频率建议","id":128,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"给狗狗做SPA和普通洗澡的区别是？","options":["水更热","加入护理产品+按摩","时间更长","价格更贵"],"answer":"加入护理产品+按摩","explanation":"SPA=洗澡+护毛素/精油护理+按摩，更深度护理","id":129,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"美容时狗狗一直叫，说明它很开心。","options":["正确","错误"],"answer":"错误","explanation":"持续叫可能是紧张/疼痛/不舒服，需要检查原因并安抚","id":130,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"给狗狗美容时，最合适的室温是？","options":["15-18°C","20-25°C","28-30°C","30°C以上"],"answer":"20-25°C","explanation":"20-25°C最舒适，避免宠物受凉或中暑","id":131,"tag":"美容护理(基础)"},{"theme":"grooming","type":"scenario","difficulty":2,"question":"客户问\"为什么美容后我家狗回家就睡觉，正常吗\"，你怎么回答？","options":null,"answer":"正常。美容过程（洗澡+吹干+修剪）对狗狗来说消耗较大，回家疲劳嗜睡是正常的。观察1-2天恢复精神即可，如果持续萎靡需检查","explanation":"美容后嗜睡的判断","id":132,"tag":"美容护理(基础)"},{"theme":"breeds","type":"judge","difficulty":1,"question":"贵宾(泰迪)会掉毛。","options":["正确","错误"],"answer":"错误","explanation":"贵宾(泰迪)：不掉毛体味轻，卷毛易打结需每日梳毛，1-2个月美容一次，聪明活泼，适合公寓","id":133,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"judge","difficulty":1,"question":"贵宾(泰迪)适合在公寓饲养。","options":["正确","错误"],"answer":"正确","explanation":"贵宾(泰迪)：不掉毛体味轻，卷毛易打结需每日梳毛，1-2个月美容一次，聪明活泼，适合公寓","id":134,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"judge","difficulty":1,"question":"比熊会掉毛。","options":["正确","错误"],"answer":"错误","explanation":"比熊：不掉毛体味轻，白色卷毛易脏，泪痕是最大难题，温顺黏人，适合公寓","id":135,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"judge","difficulty":1,"question":"比熊适合在公寓饲养。","options":["正确","错误"],"answer":"正确","explanation":"比熊：不掉毛体味轻，白色卷毛易脏，泪痕是最大难题，温顺黏人，适合公寓","id":136,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"judge","difficulty":1,"question":"博美会掉毛。","options":["正确","错误"],"answer":"正确","explanation":"博美：双层长毛，掉毛明显，警惕爱叫，骨骼纤细易骨折，活泼好动","id":137,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"judge","difficulty":1,"question":"博美适合在公寓饲养。","options":["正确","错误"],"answer":"错误" ","difficulty":1,"question":"博美犬的性格特点是？","options":["温顺安静","警惕爱叫","慵懒不爱动","胆小敏感"],"answer":"警惕爱叫","explanation":"博美警惕性高，爱吠叫","id":172,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":1,"question":"以下哪种犬种是双层被毛，禁止全身剃光？","options":["贵宾","比熊","金毛/哈士奇/萨摩耶","雪纳瑞"],"answer":"金毛/哈士奇/萨摩耶","explanation":"双层被毛犬剃光会破坏毛囊","id":173,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":1,"question":"法斗最怕什么？","options":["冷","热","水","梳毛"],"answer":"热","explanation":"法斗是短鼻犬，怕热容易中暑","id":174,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":1,"question":"雪纳瑞的外形特点是？","options":["大耳朵","小老头胡须","大屁股","卷毛"],"answer":"小老头胡须","explanation":"雪纳瑞有独特的眉毛和胡须，像小老头","id":175,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":1,"question":"以下哪种犬运动量最小，适合懒人？","options":["边牧","法斗","哈士奇","金毛"],"answer":"法斗","explanation":"法斗运动量小，每天15分钟就够","id":176,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":2,"question":"以下哪种犬智商最高？","options":["金毛","边牧","贵宾","柯基"],"answer":"边牧","explanation":"边牧智商排狗类第一","id":177,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":2,"question":"约克夏的毛发类型是？","options":["卷毛","硬毛","丝质长毛","双层被毛"],"answer":"丝质长毛","explanation":"约克夏是丝质长毛，需每日梳理","id":178,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":2,"question":"以下哪种犬最不适合新手养？","options":["比熊","贵宾","哈士奇","雪纳瑞"],"answer":"哈士奇","explanation":"哈士奇精力旺盛爱拆家，新手难以驾驭","id":179,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":2,"question":"吉娃娃最需要注意的是？","options":["怕冷","怕热","怕水","怕梳毛"],"answer":"怕冷","explanation":"吉娃娃体型极小，怕冷需要保暖","id":180,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":2,"question":"以下哪种犬最容易有泪痕？","options":["雪纳瑞","比熊","柯基","法斗"],"answer":"比熊","explanation":"比熊泪腺发达，最容易有泪痕","id":181,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"scenario","difficulty":2,"question":"一位客户住在公寓，想养一只不掉毛、运动量小的狗，你推荐什么品种？为什么？","options":null,"answer":"贵宾/比熊/雪纳瑞。理由：不掉毛体味轻、运动量小、适合公寓。贵宾聪明活泼，比熊温顺黏人，雪纳瑞独立沉稳","explanation":"公寓适养犬推荐","id":182,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"scenario","difficulty":2,"question":"客户说\"我想养一只适合小孩的狗\"，你推荐什么？需要注意什么？","options":null,"answer":"比熊/贵宾/柯基。性格稳定友善适合小孩。注意：定期美容、泪痕清洁（比熊）、控制体重保护脊椎（柯基）","explanation":"适合小孩的犬种","id":183,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"scenario","difficulty":2,"question":"客户问\"贵宾和比熊有什么区别\"，你怎么回答？","options":null,"answer":"贵宾：卷毛、聪明活泼、智商第二、需要更多智力刺激。比熊：更温顺黏人、性格安静、更容易有泪痕。两者都不掉毛但需定期美容","explanation":"贵宾vs比熊","id":184,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"scenario","difficulty":2,"question":"客户问\"金毛和拉布拉多有什么区别\"，你怎么回答？","options":null,"answer":"金毛：长毛、掉毛更严重、更温顺。拉布拉多：短毛、掉毛较少、更贪吃需控制饮食。都是中型犬，都需要大量运动","explanation":"金毛vs拉布拉多","id":185,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"scenario","difficulty":2,"question":"客户问\"我想养一只不用经常美容的狗\"，你推荐什么？","options":null,"answer":"法斗/巴哥/拉布拉多（短毛犬）。但注意：法斗怕热，巴哥易胖，拉布拉多需要大量运动。如果不介意定期梳毛，雪纳瑞也不错（不掉毛体味轻）","explanation":"低美容需求犬种","id":186,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"scenario","difficulty":2,"question":"一只5岁的雪纳瑞来店里，主人说最近发现它有泪痕，你的建议是？","options":null,"answer":"1.检查饮食是否过油过咸→换清淡配方粮；2.每天用湿巾擦拭眼周；3.保持眼周毛发适当修剪；4.清洁耳道（雪纳瑞耳道容易积垢）","explanation":"雪纳瑞泪痕处理","id":187,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"scenario","difficulty":2,"question":"客户问\"柴犬好养吗\"，你怎么回答？","options":null,"answer":"柴犬性格独立倔强，不像贵宾那样听话。掉毛严重（双层被毛），需要耐心训练。优点是爱干净、不乱叫。适合有耐心、能接受独立性格的人","explanation":"柴犬的特点","id":188,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"scenario","difficulty":2,"question":"客户问\"边牧是不是很聪明很好养\"，你怎么回答？","options":null,"answer":"边牧确实智商第一，但正因为太聪明，需要大量运动和智力刺激。如果运动量不够，会拆家/焦虑。不适合上班族或没时间遛狗的人","explanation":"边牧的饲养难度","id":189,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"scenario","difficulty":2,"question":"客户带着一只柯基来，说想给它减肥，你的建议是？","options":null,"answer":"1.控制食量（减少10-20%）；2.选低脂配方粮；3.每天30分钟运动（但不要剧烈跳跃，保护脊椎）；4.停喂零食或换低卡零食；5.每周称重监测","explanation":"柯基减肥方案","id":190,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"scenario","difficulty":2,"question":"客户问\"法斗和巴哥有什么区别\"，你怎么回答？","options":null,"answer":"法斗：体型稍大、更安静、运动需求稍高。巴哥：体型小、更慵懒爱睡觉。都是短鼻犬怕热，都容易有呼吸道问题，都需要控制体重","explanation":"法斗vs巴哥","id":191,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":1,"question":"金毛和拉布拉多属于什么体型？","options":["小型犬","中型犬","大型犬","巨型犬"],"answer":"中型犬","explanation":"金毛和拉布拉多都是中型犬","id":192,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"judge","difficulty":1,"question":"萨摩耶被称为\"微笑天使\"。","options":["正确","错误"],"answer":"正确","explanation":"萨摩耶因嘴角上翘被称为微笑天使","id":193,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"judge","difficulty":1,"question":"哈士奇适合新手养。","options":["正确","错误"],"answer":"错误","explanation":"哈士奇精力旺盛爱拆家，不适合新手","id":194,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"judge","difficulty":1,"question":"约克夏需要每天梳理毛发。","options":["正确","错误"],"answer":"正确","explanation":"约克夏是丝质长毛，需要每天梳理防打结","id":195,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":2,"question":"以下哪种犬最需要大量运动？","options":["法斗","边牧","巴哥","吉娃娃"],"answer":"边牧","explanation":"边牧精力旺盛，需要大量运动和智力刺激","id":196,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":2,"question":"以下哪种犬最安静不乱叫？","options":["博美","法斗","吉娃娃","柴犬"],"answer":"法斗","explanation":"法斗性格安静，不爱叫（但打呼噜）","id":197,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"judge","difficulty":1,"question":"柯基虽然腿短，但属于小型犬。","options":["正确","错误"],"answer":"错误","explanation":"柯基属于中小型犬，体重10-14kg","id":198,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"judge","difficulty":1,"question":"马尔济斯和约克夏都是丝质长毛，需要每天梳理。","options":["正确","错误"],"answer":"正确","explanation":"两者都是丝质长毛，需要每天梳理","id":199,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":2,"question":"客户有过敏史，想养狗，你推荐什么？","options":["金毛","贵宾/比熊/雪纳瑞","哈士奇","萨摩耶"],"answer":"贵宾/比熊/雪纳瑞","explanation":"这三种都不掉毛体味轻，适合过敏体质","id":200,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"scenario","difficulty":2,"question":"客户问\"什么狗最护主\"，你怎么回答？","options":null,"answer":"雪纳瑞/博美/吉娃娃护主意识强。但作为宠物店，我们更应该根据客户的生活方式推荐，而不是单纯看护主能力。提醒：护主≠攻击性，好的护主犬应该性格稳定","explanation":"护主犬的推荐","id":201,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"scenario","difficulty":2,"question":"客户问\"我想养一只大狗但住公寓\"，你怎么建议？","options":null,"answer":"不建议在公寓养大型犬。大型犬需要大量运动和空间。如果实在喜欢，金毛/拉布拉多（中型犬）是底线，但必须保证每天1小时以上运动。更推荐中型犬如柯基或柴犬","explanation":"公寓养大狗的建议","id":202,"tag":"品种鉴赏(基础)"},{"theme":"operations","type":"single","difficulty":1,"question":"接待客户时，第一步应该做什么？","options":["直接报价","检查宠物健康状况并拍照","推荐最贵的套餐","让宠物先适应环境"],"answer":"检查宠物健康状况并拍照","explanation":"先健康检查并拍照留证，避免后续纠纷","id":203,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":1,"question":"客户带宠物来店，首先要记录什么信息？","options":["只记录品种","品种/年龄/健康状况/过敏史/用药情况","只记录名字","只记录联系方式"],"answer":"品种/年龄/健康状况/过敏史/用药情况","explanation":"完整记录宠物信息，包括过敏史和用药情况","id":204,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":1,"question":"客户带患病宠物来店，可以先服务再说。","options":["正确","错误"],"answer":"错误","explanation":"患病宠物可能传染或加重病情，应拒绝服务建议就医","id":205,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户带一只8岁的金毛来寄养，你的接待流程是？","options":null,"answer":"1.健康初检（皮肤/精神/食欲）并拍照；2.签寄养协议；3.书面告知风险（老年宠物）；4.签确认单；5.记录饮食/用药习惯；6.留紧急联系方式和就诊医院","explanation":"老年宠物寄养接待流程","id":206,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户第一次带宠物来店，你应该问哪些问题？","options":null,"answer":"1.宠物名字/品种/年龄/性别/体重；2.健康状况（病史/过敏史/疫苗/驱虫）；3.行为习惯（怕生/攻击性/特殊癖好）；4.饮食习惯；5.主人需求和期望；6.紧急联系方式","explanation":"首次接待的问题清单","id":207,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":1,"question":"接待时可以只做口头约定，不用签协议。","options":["正确","错误"],"answer":"错误","explanation":"必须签服务协议，口头约定发生纠纷时无法维权","id":208,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":1,"question":"寄养服务最重要的是？","options":["环境豪华","签寄养协议+安装监控","提供玩具","价格便宜"],"answer":"签寄养协议+安装监控","explanation":"协议+监控是法律保障和信任基础","id":209,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":1,"question":"寄养期间宠物出现意外，应该第一时间告知主人，不能隐瞒。","options":["正确","错误"],"answer":"正确","explanation":"第一时间告知，隐瞒只会加剧矛盾","id":210,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":1,"question":"寄养时不同狗狗可以混养，省空间。","options":["正确","错误"],"answer":"错误","explanation":"不同狗狗可能打架或交叉感染，应该分开寄养","id":211,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"寄养期间发现狗狗不吃东西、精神萎靡，你应该怎么处理？","options":null,"answer":"1.立即检查健康状况；2.联系主人告知情况；3.必要时送医；4.记录过程；5.不能隐瞒","explanation":"寄养异常的处理","id":212,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户问\"寄养期间你们怎么照顾我的狗\"，你怎么回答？","options":null,"answer":"1.独立空间，不混养；2.按主人要求喂食（自带粮或我们提供）；3.每天遛2次；4.每天拍视频发给主人；5.24小时监控；6.任何异常第一时间联系","explanation":"寄养服务的介绍","id":213,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"寄养老年宠物，必须做什么？","options":["多收费用","书面风险告知+签确认","拒绝服务","要求主人在场"],"answer":"书面风险告知+签确认","explanation":"老年宠物必须书面告知风险并签确认","id":214,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":3,"question":"寄养的狗狗突然中暑（法斗），你应该怎么处理？","options":null,"answer":"1.立即移到阴凉通风处；2.用湿毛巾降温（不是冰水）；3.提供饮水；4.立即送医；5.第一时间通知主人；6.记录全过程；7.不能隐瞒","explanation":"寄养中暑的应急处理","id":215,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":1,"question":"客户投诉美容效果不满意，正确的处理方式是？","options":["拒绝退款","免费重做或按比例退款","说客户不懂审美","让客户找消协"],"answer":"免费重做或按比例退款","explanation":"客户满意度第一，免费重做或按比例退款","id":216,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":1,"question":"客户投诉后，应该多久内回复？","options":["1小时","24小时","3天","1周"],"answer":"1小时","explanation":"1小时响应机制，接到投诉立即道歉并承诺解决时限","id":217,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":1,"question":"客户投诉时，应该先解释原因再道歉。","options":["正确","错误"],"answer":"错误","explanation":"先道歉再解释，态度第一","id":218,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户投诉说\"你们把我的狗剪伤了\"，你应该怎么处理？","options":null,"answer":"1.立即道歉；2.查看伤口情况；3.如果是我们的责任，承担医疗费用；4.赠送免费服务或优惠券；5.3天内二次回访确认满意度；6.内部复盘避免再发生","explanation":"剪伤客诉的处理","id":219,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户在大众点评给了差评，说\"服务态度差\"，你应该怎么处理？","options":null,"answer":"1.24小时内在平台回复道歉；2.私信联系客户了解具体情况；3.如果确实服务不到位，提出补偿方案；4.邀请客户再体验；5.内部培训改进","explanation":"差评的处理","id":220,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":1,"question":"宠物店操作区每天应该怎么消毒？","options":["不用消毒","每天营业结束后消毒液擦拭","每周消毒一次","每月消毒一次"],"answer":"每天营业结束后消毒液擦拭","explanation":"每天营业结束后用消毒液擦拭操作区/等待区/地面","id":221,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":1,"question":"美容工具可以多人共用，不用消毒。","options":["正确","错误"],"answer":"错误","explanation":"工具必须每个宠物用后消毒，防交叉感染","id":222,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"发现宠物有传染性疾病（如犬瘟/真菌），应该怎么做？","options":["继续服务","拒绝服务建议就医","只做一半","戴手套继续"],"answer":"拒绝服务建议就医","explanation":"传染性疾病需拒绝服务，防交叉感染","id":223,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"宠物店必须安装监控的区域是？","options":["只有收银台","操作区+寄养区（除洗手间）","只有门口","不用安装"],"answer":"操作区+寄养区（除洗手间）","explanation":"操作区和寄养区必须无死角监控，既是证据也是震慑","id":224,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":3,"question":"美容过程中狗狗突然抽搐、呼吸困难，你应该怎么做？","options":null,"answer":"1.立即停止操作；2.将狗狗放在安静通风处；3.不要强迫接触；4.立即联系宠物医院；5.通知主人；6.记录过程","explanation":"严重应激的应急处理","id":225,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"宠物店定价策略最合适的是？","options":["越贵越好","成本加成+市场对标","越便宜越好","随意定价"],"answer":"成本加成+市场对标","explanation":"成本加成30%左右，同时参考周边宠物店价格","id":226,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"促销活动最合适的方式是？","options":["全场5折","满赠体验券/会员日折扣","免费服务","降价倾销"],"answer":"满赠体验券/会员日折扣","explanation":"满赠体验券提升客单价，会员日折扣引导复购","id":227,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户问\"你们店和其他店有什么不同\"，你怎么回答？","options":null,"answer":"1.标准化SOP（服务流程规范）；2.情绪价值（客户档案/定制礼品/节庆活动）；3.招牌狗大福（吸引女性客群）；4.社区中高端定位（专注洗护美容+寄养）","explanation":"差异化竞争的回答","id":228,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"开业初期客流不足，你的推广策略是？","options":null,"answer":"1.社区地推+社群宣传；2.大众点评/美团上线；3.开业体验套餐（低价引流）；4.账号内容密集发布（小红书/抖音）；5.首月低价引流+口碑积累","explanation":"开业推广策略","id":229,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户问\"你们有没有会员制度\"，你怎么介绍？","options":null,"answer":"储值会员：充500送免费洗浴1次+驱虫药1支；充2000享年度体检+专属客服。积分制：1元=1积分，可兑换美容折扣券/定制项圈。生日月积分翻倍","explanation":"会员制度的介绍","id":230,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"新客户来店后，应该多久回访？","options":["不用回访","3天后","1周后","1个月后"],"answer":"3天后","explanation":"新客户3天后回访，询问商品使用感受和喂养建议","id":231,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"寄养/美容后应该多久回访？","options":["不用回访","24小时内","3天后","1周后"],"answer":"24小时内","explanation":"寄养/美容后24小时内回访，确认宠物状态","id":232,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户问\"你们会记录我狗狗的信息吗\"，你怎么回答？","options":null,"answer":"会的。我们建立了客户档案，记录您狗狗的品种/年龄/健康状况/过敏史/饮食偏好/禁忌项。这样每次来都能提供更个性化的服务，也更安全","explanation":"客户档案的介绍","id":233,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":1,"question":"客户维护就是定期发促销信息。","options":["正确","错误"],"answer":"错误","explanation":"客户维护是分享养宠知识/宠物成长故事，不是推销","id":234,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"宠物店最需要防范的法律风险是？","options":["偷税漏税","客户带患病宠物讹诈+假装被咬伤+未签协议纠纷","消防","环保"],"answer":"客户带患病宠物讹诈+假装被咬伤+未签协议纠纷","explanation":"三类索赔陷阱：患病宠物讹诈/假装被咬伤/未签寄养协议","id":235,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"防范职业索赔人最好的方式是？","options":["不接待陌生客户","安装全覆盖监控+签协议","不开发票","不收现金"],"answer":"安装全覆盖监控+签协议","explanation":"监控是最佳证据，协议是法律保障","id":236,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":3,"question":"客户说\"我的狗在你们店里被咬伤了，你们要赔偿\"，但监控显示没有，你应该怎么处理？","options":null,"answer":"1.保留监控证据；2.向客户展示监控；3.如果客户坚持，建议报警处理；4.监控就是最佳证据；5.不要私下赔钱，会被职业索赔人盯上","explanation":"职业索赔的应对","id":237,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"宠物店员工最重要的素质是？","options":["爱心","服务意识+专业技能","学历","外貌"],"answer":"服务意识+专业技能","explanation":"爱心不能替代专业，最终买单的是宠物主人","id":238,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"员工在美容时态度不好，被客户投诉，你应该怎么处理？","options":null,"answer":"1.向客户道歉并补偿；2.与员工沟通了解原因；3.如果是态度问题，进行服务礼仪培训；4.如果是技术问题，进行技术培训；5.记录事件纳入考核","explanation":"员工投诉的处理","id":239,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":1,"question":"宠物店接宠物时，应该主动做什么？","options":["直接接过来","主动问候+轻柔接过+零食安抚","让主人自己放","不管"],"answer":"主动问候+轻柔接过+零食安抚","explanation":"主动问候，轻柔接过避免惊吓，用零食安抚情绪","id":240,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"宠物店服务后，应该给客户什么？","options":["只收钱","服务反馈+后续护理建议+小礼品","什么都不给","推销产品"],"answer":"服务反馈+后续护理建议+小礼品","explanation":"反馈服务情况+建议后续护理+赠送小礼品提升好感","id":241,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":1,"question":"宠物店可以拒绝服务有攻击性的宠物。","options":["正确","错误"],"answer":"正确","explanation":"有攻击性/发情期/传染病的宠物，有权拒绝服务或要求主人在场","id":242,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":1,"question":"宠物店不需要给员工买社保和保险。","options":["正确","错误"],"answer":"错误","explanation":"必须购买社保和商业保险，保障员工权益","id":243,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"宠物店预约服务最好的方式是？","options":["只接受电话","电话+微信+到店多渠道","只接受到店","只接受微信"],"answer":"电话+微信+到店多渠道","explanation":"多渠道预约方便客户","id":244,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户问\"你们店的美容师有资质吗\"，你怎么回答？","options":null,"answer":"我们的美容师持有宠物美容师资格证（C级及以上），熟悉不同品种的护理需求。店内还有完善的技术培训体系，每月组织技术交流","explanation":"美容师资质的介绍","id":245,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"宠物店库存管理最合适的方式是？","options":["越多越好","ABC分类法","越少越好","不管理"],"answer":"ABC分类法","explanation":"A类（主粮）备30天，C类（玩具）备7天，滞销品每月清仓","id":246,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户问\"你们店的商品价格比网上贵，为什么\"，你怎么回答？","options":null,"answer":"1.我们是正规渠道采购，有质检报告和检疫证明；2.提供专业的喂养建议和售后服务；3.可以现场看到实物；4.支持无理由退换；5.会员还有折扣","explanation":"价格差异的解释","id":247,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":1,"question":"宠物店可以接受客户自带的劣质狗粮给寄养宠物吃。","options":["正确","错误"],"answer":"错误","explanation":"应建议客户使用优质粮，劣质粮可能导致健康问题","id":248,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"宠物店最容易被忽视的安全隐患是？","options":["火灾","宠物逃跑/丢失","水灾","地震"],"answer":"宠物逃跑/丢失","explanation":"宠物丢失是最常见的安全事故，必须做好门窗防护和交接确认","id":249,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":3,"question":"寄养的狗狗从你店里跑丢了，你应该怎么处理？","options":null,"answer":"1.立即组织寻找；2.第一时间通知主人；3.查看监控确认逃跑路线；4.在周边社区发寻狗启事；5.报警备案；6.承担相应责任；7.不能隐瞒","explanation":"宠物丢失的应急处理","id":250,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户问\"你们店的卫生情况怎么样\"，你怎么回答？","options":null,"answer":"1.工具每次使用后浸泡消毒30分钟；2.操作区每天营业结束后消毒；3.一次性用品专人专用；4.寄养区每天清洁消毒；5.欢迎您随时参观","explanation":"卫生情况的介绍","id":251,"tag":"店铺运营(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"猫在营养学上属于哪一类动物？","options":["杂食动物","草食动物","专性肉食动物","杂食偏素"],"answer":"专性肉食动物","explanation":"猫是专性肉食动物，必须从肉类中获取牛磺酸等关键营养","id":252,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"猫可以像狗一样长期吃素粮维持健康。","options":["正确","错误"],"answer":"错误","explanation":"猫是专性肉食动物，长期素食会导致牛磺酸缺乏等严重问题","id":253,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"猫自身不能足量合成的、必须从食物中获取的必需氨基酸是？","options":["牛磺酸","赖氨酸","蛋氨酸","色氨酸"],"answer":"牛磺酸","explanation":"猫合成牛磺酸能力极弱，必须从肉类/猫粮中获取","id":254,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":3,"question":"猫长期缺乏牛磺酸最可能导致的疾病是？","options":["佝偻病","扩张型心肌病和视网膜变性","糖尿病","肾结石"],"answer":"扩张型心肌病和视网膜变性","explanation":"牛磺酸缺乏可致扩张型心肌病(DCM)与中央视网膜变性（夜盲）","id":255,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":2,"question":"牛磺酸对猫的心脏和视力都至关重要。","options":["正确","错误"],"answer":"正确","explanation":"牛磺酸缺乏会引发心肌病和视网膜病变，猫粮中必须强化","id":256,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"优质成猫粮粗蛋白含量建议不低于多少？","options":["18%","22%","26%","30%"],"answer":"30%","explanation":"猫对蛋白需求高于狗，成猫粮粗蛋白建议≥30%（优质粮常≥35%）","id":257,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"优质幼猫粮（生长期）粗蛋白含量建议不低于多少？","options":["26%","30%","35%","40%"],"answer":"35%","explanation":"幼猫生长快，幼猫粮粗蛋白建议≥35%","id":258,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":2,"question":"猫粮中碳水化合物的需求很低，高碳水粮不适合猫。","options":["正确","错误"],"answer":"正确","explanation":"猫对碳水利用能力弱，应以动物蛋白和脂肪为主","id":259,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"关于猫粮形态，以下说法正确的是？","options":["干粮补水最好","湿粮（罐头）有助于补充水分","猫只吃干粮最健康","湿粮没有营养"],"answer":"湿粮（罐头）有助于补充水分","explanation":"室内猫易缺水，湿粮能补充大量水分，有益泌尿健康","id":260,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"主食罐头和零食罐头的主要区别是？","options":["包装颜色","主食罐头营养全价可当正餐，零食罐头不能","价格","产地"],"answer":"主食罐头营养全价可当正餐，零食罐头不能","explanation":"主食罐标称“全价”，可替代主粮；零食罐只能偶尔奖励","id":261,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"零食罐头可以完全替代主食长期喂养。","options":["正确","错误"],"answer":"错误","explanation":"零食罐头营养不全价，长期当主食会导致营养不良","id":262,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"室内猫容易饮水不足，最直接的改善方式是？","options":["少给水","用流动饮水机+多放水盆","只喂干粮","加盐"],"answer":"用流动饮水机+多放水盆","explanation":"猫祖先源于干旱区、渴觉弱，流动水更能诱导饮水","id":263,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":2,"question":"猫的渴觉比狗弱，因此更容易慢性缺水。","options":["正确","错误"],"answer":"正确","explanation":"猫源自沙漠祖先，渴觉迟钝，需主动诱导喝水预防泌尿病","id":264,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"以下关于「百合（任何部位）」对猫的说法，正确的是？","options":["百合（任何部位）对猫安全可少量喂","百合（任何部位）对猫有毒：急性肾衰竭，对猫剧毒甚至致命","煮熟后就安全","晒干了就没毒"],"answer":"百合（任何部位）对猫有毒：急性肾衰竭，对猫剧毒甚至致命","explanation":"百合全株（花/叶/花粉/水）对猫都有极强肾毒性，几克即可致命","id":265,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"以下关于「洋葱、大葱、大蒜」对猫的说法，正确的是？","options":["洋葱、大葱、大蒜对猫安全可少量喂","洋葱、大葱、大蒜对猫有毒：溶血性贫血（破坏红细胞）","煮熟后就安全","晒干了就没毒"],"answer":"洋葱、大葱、大蒜对猫有毒：溶血性贫血（破坏红细胞）","explanation":"葱属含硫化物，猫食后红细胞破裂导致溶血性贫血","id":266,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"以下关于「葡萄和葡萄干」对猫的说法，正确的是？","options":["葡萄和葡萄干对猫安全可少量喂","葡萄和葡萄干对猫有毒：急性肾衰竭","煮熟后就安全","晒干了就没毒"],"answer":"葡萄和葡萄干对猫有毒：急性肾衰竭","explanation":"葡萄/葡萄干可致猫急性肾衰竭，摄入量无安全阈值","id":267,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"以下关于「巧克力」对猫的说法，正确的是？","options":["巧克力对猫安全可少量喂","巧克力对猫有毒：可可碱中毒，神经和心脏受损","煮熟后就安全","晒干了就没毒"],"answer":"巧克力对猫有毒：可可碱中毒，神经和心脏受损","explanation":"巧克力中的可可碱猫难代谢，引发中毒","id":268,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"以下关于「木糖醇」对猫的说法，正确的是？","options":["木糖醇对猫安全可少量喂","木糖醇对猫有毒：低血糖、肝损伤","煮熟后就安全","晒干了就没毒"],"answer":"木糖醇对猫有毒：低血糖、肝损伤","explanation":"木糖醇导致猫胰岛素骤升，严重低血糖和肝损","id":269,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"以下关于「酒精」对猫的说法，正确的是？","options":["酒精对猫安全可少量喂","酒精对猫有毒：中枢神经系统抑制、呼吸衰竭","煮熟后就安全","晒干了就没毒"],"answer":"酒精对猫有毒：中枢神经系统抑制、呼吸衰竭","explanation":"哪怕少量酒精也对猫剧毒","id":270,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"以下关于「生鱼（尤其淡水生鱼）」对猫的说法，正确的是？","options":["生鱼（尤其淡水生鱼）对猫安全可少量喂","生鱼（尤其淡水生鱼）对猫有毒：硫胺素（维生素B1）缺乏","煮熟后就安全","晒干了就没毒"],"answer":"生鱼（尤其淡水生鱼）对猫有毒：硫胺素（维生素B1）缺乏","explanation":"生鱼含硫胺素酶，长期生食破坏维生素B1，致神经症状","id":271,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"以下关于「牛奶」对猫的说法，正确的是？","options":["牛奶对猫安全可少量喂","牛奶对猫有毒：多数猫乳糖不耐受，腹泻","煮熟后就安全","晒干了就没毒"],"answer":"牛奶对猫有毒：多数猫乳糖不耐受，腹泻","explanation":"成年猫缺乏乳糖酶，喝牛奶易腹泻，应喂清水或宠物奶","id":272,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"以下关于「咖啡、茶（咖啡因）」对猫的说法，正确的是？","options":["咖啡、茶（咖啡因）对猫安全可少量喂","咖啡、茶（咖啡因）对猫有毒：心跳加速、抽搐","煮熟后就安全","晒干了就没毒"],"answer":"咖啡、茶（咖啡因）对猫有毒：心跳加速、抽搐","explanation":"咖啡因对猫中枢神经和心脏有强刺激","id":273,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"以下关于「牛油果」对猫的说法，正确的是？","options":["牛油果对猫安全可少量喂","牛油果对猫有毒：心肌损伤风险","煮熟后就安全","晒干了就没毒"],"answer":"牛油果对猫有毒：心肌损伤风险","explanation":"牛油果含persin，对猫有毒性风险","id":274,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"以下关于「骨头（熟骨/禽骨）」对猫的说法，正确的是？","options":["骨头（熟骨/禽骨）对猫安全可少量喂","骨头（熟骨/禽骨）对猫有毒：划伤消化道、卡喉、便秘","煮熟后就安全","晒干了就没毒"],"answer":"骨头（熟骨/禽骨）对猫有毒：划伤消化道、卡喉、便秘","explanation":"熟骨易碎裂成尖刺，危险","id":275,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"以下关于「高脂人类食物」对猫的说法，正确的是？","options":["高脂人类食物对猫安全可少量喂","高脂人类食物对猫有毒：胰腺炎","煮熟后就安全","晒干了就没毒"],"answer":"高脂人类食物对猫有毒：胰腺炎","explanation":"高脂饮食是猫急性胰腺炎的重要诱因","id":276,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":2,"question":"猫可以吃一点点巧克力，因为猫比狗耐药。","options":["正确","错误"],"answer":"错误","explanation":"猫对巧克力中的可可碱更敏感，极少量也可中毒","id":277,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":2,"question":"百合花好看又香，放在家里对猫没危险。","options":["正确","错误"],"answer":"错误","explanation":"百合对猫有致命肾毒性，养猫家庭严禁摆放百合","id":278,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":3,"question":"客户说家里养猫，但桌上摆了一束百合，问能不能养，你怎么建议？","options":null,"answer":"强烈建议把百合移走或送人。百合（花/叶/花粉甚至插花水）对猫有致命肾毒性，猫舔舐花粉或啃咬几克即可引发急性肾衰竭。养猫家庭应杜绝任何百合属植物","explanation":"百合对猫致命","id":279,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户问「猫能不能喝牛奶」，你怎么回答？","options":null,"answer":"不建议。多数猫成年后乳糖不耐受，喝牛奶容易腹泻软便。想补水或加营养，可用宠物专用奶粉或干脆喂清水，湿粮更能补水","explanation":"猫与牛奶","id":280,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"scenario","difficulty":2,"question":"客户说猫偷吃了一颗葡萄，要不要紧？","options":null,"answer":"要重视。葡萄/葡萄干对猫有急性肾毒性，没有安全剂量。建议立即联系宠物医院，观察有无呕吐/精神差/排尿异常，必要时催吐和血液检查","explanation":"葡萄中毒处理","id":281,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"幼猫（2-4月龄）每日建议喂几餐？","options":["1餐","2餐","3-4餐（少食多餐）","自由采食不停"],"answer":"3-4餐（少食多餐）","explanation":"幼猫胃容量小，需少食多餐","id":282,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"成年猫（1-7岁）一般每日喂几餐较合适？","options":["1餐","2餐","4餐","6餐"],"answer":"2餐","explanation":"成猫定时2餐即可，也可自由采食控制总量","id":283,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"老年猫（7岁以上）饮食最应注意的是？","options":["蛋白越高越好","控制磷摄入、保护肾脏、易消化","多补钙","少喝水"],"answer":"控制磷摄入、保护肾脏、易消化","explanation":"老年猫肾功能下降，需控磷、优质易消化的蛋白","id":284,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"幼猫断奶后可以直接吃成猫粮。","options":["正确","错误"],"answer":"错误","explanation":"幼猫需吃幼猫粮（高蛋白高热量），直接吃成猫粮营养不够","id":285,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"判断猫胖瘦最可靠的方法是？","options":["只看体重","摸肋骨+看腰线","看脸圆不圆","看食量"],"answer":"摸肋骨+看腰线","explanation":"能摸到肋骨但无明显突出、有腰线＝标准体型","id":286,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":2,"question":"橘猫大多容易胖，需要控制饮食和增加运动。","options":["正确","错误"],"answer":"正确","explanation":"橘猫（尤其公猫）易胖，应控制热量并增加互动玩耍","id":287,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"给猫换粮推荐的方法是？","options":["直接全换","7日过渡法","混合一周就行","逐步减少旧粮不看比例"],"answer":"7日过渡法","explanation":"新旧粮按比例在7天内逐步替换，减少肠胃应激","id":288,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"猫换粮可以直接全换，猫肠胃比狗强。","options":["正确","错误"],"answer":"错误","explanation":"突然换粮会引起软便呕吐，猫同样需要7日过渡","id":289,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":1,"question":"猫零食每日占比建议不超过总食量的？","options":["5%","10%","25%","50%"],"answer":"10%","explanation":"零食不超过10%，防止挑食和肥胖","id":290,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"猫条可以当主食天天大量喂。","options":["正确","错误"],"answer":"错误","explanation":"猫条是高适口性零食，不能替代主粮，过量致挑食缺营养","id":291,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"预防毛球症，最日常有效的做法是？","options":["多洗澡","勤梳毛+猫草/化毛膏","少喝水","多晒太阳"],"answer":"勤梳毛+猫草/化毛膏","explanation":"梳毛减少吞入浮毛，猫草/化毛膏帮助排出毛球","id":292,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"猫偶尔吐出带毛的呕吐物，通常说明？","options":["一定生病了","多为正常吐毛球","要立刻禁食一周","是中毒"],"answer":"多为正常吐毛球","explanation":"猫舔毛吞入毛发，偶尔吐毛球属正常，频繁需就医","id":293,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":2,"question":"猫草和化毛膏的作用是帮助猫排出胃中毛球。","options":["正确","错误"],"answer":"正确","explanation":"两者都能辅助毛球排出，减少毛球症","id":294,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":2,"question":"猫尝不出甜味，因为缺乏甜味受体。","options":["正确","错误"],"answer":"正确","explanation":"猫缺失甜味受体，对甜味不敏感","id":295,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"猫饮水不足最容易诱发哪类问题？","options":["皮肤病","泌尿系统疾病（结石/皮炎）","耳聋","近视"],"answer":"泌尿系统疾病（结石/皮炎）","explanation":"缺水是猫下泌尿道疾病的重要诱因，湿粮和饮水机有帮助","id":296,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"猫的水盆应每天换水、保持清洁。","options":["正确","错误"],"answer":"正确","explanation":"每日换水减少细菌滋生，诱导饮水","id":297,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"猫的食盆和水盆最好选择？","options":["又深又窄","宽口浅底（避免胡须疲劳）","金属异味大","随便用"],"answer":"宽口浅底（避免胡须疲劳）","explanation":"猫胡须敏感，过深过窄的盆会触发胡须疲劳，影响进食饮水","id":298,"tag":"营养喂养(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"室内猫一般多久洗一次澡合适？","options":["每天","每周","半年到1年或脏了才洗","从不洗"],"answer":"半年到1年或脏了才洗","explanation":"猫自我清洁强，室内猫洗澡频率极低，多数半年~1年一次","id":299,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"猫比狗更爱干净，会自己舔毛清洁。","options":["正确","错误"],"answer":"正确","explanation":"猫是洁癖动物，自我清洁能力远强于狗","id":300,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":2,"question":"给猫洗澡要特别防应激，应激严重可致公猫尿闭。","options":["正确","错误"],"answer":"正确","explanation":"猫洗澡应激可诱发应激性膀胱炎甚至尿闭，公猫尤其危险","id":301,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"猫洗澡时水温建议约多少？","options":["常温","38-39℃","45℃以上","越凉越好"],"answer":"38-39℃","explanation":"接近猫体温，避免过冷过热加重应激","id":302,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"给猫洗澡最需要注意的原则是？","options":["泡久一点","快洗快吹、减少应激、避免风口直吹","用强力风吹","洗完自然风干就好"],"answer":"快洗快吹、减少应激、避免风口直吹","explanation":"猫易应激，应快速温和完成并保暖","id":303,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":2,"question":"病猫、怀孕母猫、未免疫幼猫不宜洗澡。","options":["正确","错误"],"answer":"正确","explanation":"这些猫免疫力低或易应激，洗澡风险大","id":304,"tag":"美容护理(基础)"},{"theme":"grooming","type":"scenario","difficulty":3,"question":"客户要求给胆子很小的猫立刻洗澡，猫已经炸毛哈气，你怎么处理？","options":null,"answer":"先不洗。炸毛哈气是强烈应激信号，强行洗可能诱发尿闭或伤人。建议改天用费洛蒙安抚、熟悉环境后再尝试，或先做梳毛/剪指甲等低应激服务替代","explanation":"猫洗澡应激处理","id":305,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"短毛猫建议多久梳一次毛？","options":["不用梳","每周1-2次","每天3次","每月1次"],"answer":"每周1-2次","explanation":"短毛猫每周1-2次去浮毛即可","id":306,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"长毛猫（如波斯、缅因）建议多久梳一次毛？","options":["每周","每天","每月","不用梳"],"answer":"每天","explanation":"长毛猫每日梳毛防打结、减毛球","id":307,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"换毛季（春秋）猫梳毛应？","options":["减少次数","增加频率帮助去浮毛","不梳","只洗澡"],"answer":"增加频率帮助去浮毛","explanation":"换毛季浮毛多，增加梳毛频次","id":308,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"去浮毛效果最好的工具是？","options":["普通牙刷","褪毛梳/排梳（如Furminator类）","毛巾","手"],"answer":"褪毛梳/排梳（如Furminator类）","explanation":"褪毛梳能有效去除底层浮毛","id":309,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"勤梳毛能减少猫吞入毛发、预防毛球。","options":["正确","错误"],"answer":"正确","explanation":"梳毛减少浮毛被舔入，降低毛球症","id":310,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"猫指甲建议多久修剪一次？","options":["每天","每2-3周","每半年","从不剪"],"answer":"每2-3周","explanation":"前爪每2-3周修剪一次","id":311,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"剪猫指甲绝不能剪到哪个部位？","options":["白色尖端","粉色血线（quick）","指甲外侧","无所谓"],"answer":"粉色血线（quick）","explanation":"血线含血管神经，剪到会出血疼痛","id":312,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"猫有悬趾（前肢内侧多余脚趾），也需要留意但不必剪。","options":["正确","错误"],"answer":"正确","explanation":"悬趾很少接触地面，通常不剪但需观察","id":313,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"为防止猫抓家具，最好提供？","options":["打骂","猫抓板/猫爬架","关笼子" me":"breeds","type":"single","difficulty":2,"question":"关于「孟买猫」，以下描述正确的是？","options":["通体黑、铜眼","体型最小","一定不掉毛","都适合散养"],"answer":"通体黑、铜眼","explanation":"孟买猫：粘人、安静；护理要点：短毛易打理","id":370,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":2,"question":"「孟买猫」的性格特点主要是？","options":["粘人、安静","凶猛好斗","完全不亲人","不会叫"],"answer":"粘人、安静","explanation":"孟买猫性格：粘人、安静","id":371,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":2,"question":"暹罗猫、布偶猫、伯曼猫的「重点色」是指？","options":["全身一色","四肢/脸/耳/尾等末端颜色深","只有背部有色","随机分布"],"answer":"四肢/脸/耳/尾等末端颜色深","explanation":"重点色由温度依赖酶决定，体温低的末端颜色更深","id":372,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"judge","difficulty":2,"question":"重点色猫的毛色会随温度变化，怕冷部位颜色更深。","options":["正确","错误"],"answer":"正确","explanation":"温度越低末端颜色越深，是温度依赖型色素","id":373,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"judge","difficulty":1,"question":"橘猫多为公猫，这与控制橙色的基因在X染色体上有关。","options":["正确","错误"],"answer":"正确","explanation":"橙色基因在X染色体，橘猫公猫（XY）远多于母猫（XX）","id":374,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":2,"question":"长毛猫品种（如波斯、缅因）日常护理最大的挑战是？","options":["不掉毛","毛发易打结、需每日梳理","不需要洗澡","不怕热"],"answer":"毛发易打结、需每日梳理","explanation":"长毛需每日梳，否则易打结甚至引发皮肤问题","id":375,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"judge","difficulty":2,"question":"布偶猫忍痛性强，生病时往往不明显，主人需更细心观察。","options":["正确","错误"],"answer":"正确","explanation":"布偶猫隐忍，异常要早发现","id":376,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":3,"question":"选购猫时，判断其是否健康不应只看？","options":["精神食欲","眼睛鼻子是否干净","被毛是否顺滑","只看照片好看就买"],"answer":"只看照片好看就买","explanation":"健康要看精神、五官、被毛、排泄等，不能只看照片","id":377,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":2,"question":"新手第一次养猫，相对好养的品种通常具备什么特征？","options":["极端扁脸","健壮、短毛、性格稳定（如英短/美短/田园猫）","极其稀有","需要专业护理"],"answer":"健壮、短毛、性格稳定（如英短/美短/田园猫）","explanation":"新手选健壮短毛、性格稳的品种更省心","id":378,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"judge","difficulty":2,"question":"扁脸猫（波斯/加菲）相比普通猫更需要眼部清洁和关注呼吸。","options":["正确","错误"],"answer":"正确","explanation":"短头颅结构带来泪痕和呼吸风险","id":379,"tag":"品种鉴赏(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"猫进店后炸毛、哈气、躲藏，说明它处于？","options":["放松","强烈应激","饥饿","开心"],"answer":"强烈应激","explanation":"炸毛哈气躲藏是猫应激典型表现","id":380,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":2,"question":"猫应激可诱发应激性膀胱炎（FIC），公猫尿闭可致命。","options":["正确","错误"],"answer":"正确","explanation":"应激是下泌尿道疾病诱因，公猫尿闭紧急危险","id":381,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"缓解猫应激，店内最合适的环境是？","options":["喧闹有狗叫","安静、暗光、使用费洛蒙","强光直射","多人围观"],"answer":"安静、暗光、使用费洛蒙","explanation":"安静暗光+费洛蒙(Feliway)能显著降低猫应激","id":382,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"费洛蒙（如Feliway）对猫的主要作用是？","options":["驱虫","模拟安抚信息素、缓解应激","增进食欲","杀菌"],"answer":"模拟安抚信息素、缓解应激","explanation":"合成猫面部信息素，营造安全感","id":383,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":2,"question":"接待猫时不应强行抱猫或拖出猫包，应让其主动适应。","options":["正确","错误"],"answer":"正确","explanation":"强迫会加剧应激，应给猫自主选择权","id":384,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":3,"question":"寄养的猫到店后一直躲角落、不吃不喝、呼吸急促，你怎么办？","options":null,"answer":"立即降低环境刺激：移入安静暗光单独空间，使用费洛蒙，提供隐蔽处和熟悉气味（自带毯子）。观察排尿，若公猫长时间不排尿（尿闭）立即送医。通知主人情况，不强行打扰","explanation":"猫应激应急处理","id":385,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":1,"question":"搬运猫包/航空箱时正确做法是？","options":["悬空拎提手晃","托底平稳搬运、避免晃动","倒着提","单手甩"],"answer":"托底平稳搬运、避免晃动","explanation":"托底更稳，减少猫的坠落感和应激","id":386,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":1,"question":"猫包开口应对着墙或人，避免猫直接看到陌生环境而炸毛。","options":["正确","错误"],"answer":"正确","explanation":"遮挡视线可降低猫的紧张","id":387,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"猫外出最好使用？","options":["项圈牵着走","封闭式猫包/航空箱","直接抱","笼子拖着"],"answer":"封闭式猫包/航空箱","explanation":"封闭猫包安全且给猫安全感","id":388,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"猫寄养时，猫砂盆数量建议为？","options":["不用砂盆","猫数+1个","1个管所有","越多越乱"],"answer":"猫数+1个","explanation":"猫砂盆原则：N只猫配N+1个，减少争用和乱尿","id":389,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":2,"question":"猫寄养应与狗分区，且多猫家庭尽量分开避免打架。","options":["正确","错误"],"answer":"正确","explanation":"猫领域意识强，混养易应激冲突","id":390,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"猫寄养最该让主人自带的是？","options":["玩具就行","熟悉的粮和猫砂/垫子（带气味）","随便换粮","不用带"],"answer":"熟悉的粮和猫砂/垫子（带气味）","explanation":"熟悉气味和食物能大幅降低寄养应激","id":391,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户要寄养猫，你接待时要确认哪些信息？","options":null,"answer":"确认：疫苗本（猫三联+狂犬是否在有效期）、年龄性别是否绝育、性情（是否怕生/攻击）、饮食偏好与禁忌、有无疾病史、紧急联系人和授权送医同意、自带粮和猫砂。签寄养协议","explanation":"猫寄养接待","id":392,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":2,"question":"猫寄养期间应每日观察食欲、精神、排泄（猫砂盆）情况并记录。","options":["正确","错误"],"answer":"正确","explanation":"猫异常常先表现在食欲和排泄上","id":393,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"猫的核心疫苗「猫三联」预防的是？","options":["犬瘟/细小","猫瘟/猫鼻支/猫杯状病毒","狂犬","寄生虫"],"answer":"猫瘟/猫鼻支/猫杯状病毒","explanation":"猫三联=猫泛白细胞减少症(猫瘟)+猫鼻气管炎(鼻支)+猫杯状病毒","id":394,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"幼猫首次接种猫三联一般从几周龄开始？","options":["2周","8周（约2月龄）","6个月","1岁"],"answer":"8周（约2月龄）","explanation":"幼猫8周龄起接种，间隔3-4周一针，共2-3针","id":395,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":2,"question":"猫三联完成后仍需定期加强（每年或每三年，遵医嘱）。","options":["正确","错误"],"answer":"正确","explanation":"核心疫苗需定期加强以维持保护力","id":396,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"猫的狂犬疫苗通常建议在什么阶段接种？","options":["出生即打","3月龄以上、猫三联后","不用打","只打一次终身"],"answer":"3月龄以上、猫三联后","explanation":"狂犬一般满3月龄、在核心疫苗后接种，依法必打","id":397,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户问「我家猫不出门，还要打疫苗吗」，你怎么回答？","options":null,"answer":"建议打。即使不出门，人可能带回病原，且狂犬是法定传染病。猫三联防猫瘟等高度传染性疾病，一旦感染死亡率高。不出门可降低频率但核心疫苗仍建议做","explanation":"不出门是否打疫苗","id":398,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"母猫发情的典型表现是？","options":["安静嗜睡","嚎叫（叫春）、蹭人、翘臀、食欲下降","大量掉毛","爱洗澡"],"answer":"嚎叫（叫春）、蹭人、翘臀、食欲下降","explanation":"母猫发情会频繁嚎叫、摩擦、摆出接受姿势","id":399,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"未绝育公猫发情常见行为是？","options":["更乖","乱尿喷标记、想外出、攻击性增","不吃饭","爱洗澡"],"answer":"乱尿喷标记、想外出、攻击性增","explanation":"公猫发情会喷尿标记、外逃，绝育可显著改善","id":400,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"猫绝育（节育）的推荐时机一般是？","options":["刚出生","6月龄左右（性成熟前）","5岁后","发情期当场"],"answer":"6月龄左右（性成熟前）","explanation":"一般建议6月龄左右、健康时绝育","id":401,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":2,"question":"绝育能降低猫生殖系统疾病和走失/喷尿风险。","options":["正确","错误"],"answer":"正确","explanation":"绝育减少卵巢癌/睾丸癌及行为问题","id":402,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户犹豫要不要给猫绝育，你怎么科普？","options":null,"answer":"绝育好处：①杜绝子宫蓄脓、卵巢/睾丸肿瘤；②母猫不发情嚎叫，公猫不喷尿外逃；③减少走失和意外怀孕；④更长寿健康。最佳时机约6月龄、健康状态下进行，术前需禁食","explanation":"绝育科普话术","id":403,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"猫砂中，结团性好、除臭强、粉尘低且可冲厕的是哪类？","options":["膨润土","豆腐猫砂","水晶砂","松木砂"],"answer":"豆腐猫砂","explanation":"豆腐砂结团好、可冲厕、粉尘低，较受城市养猫欢迎","id":404,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"关于猫砂盆摆放，正确的是？","options":["放食盆旁","放安静、通风、远离食水处","放门口","放阳台暴晒"],"answer":"放安静、通风、远离食水处","explanation":"猫砂盆应安静私密、远离吃饭喝水处","id":405,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":1,"question":"猫抓板能满足猫磨爪天性，保护家具。","options":["正确","错误"],"answer":"正确","explanation":"提供抓板是引导磨爪、保护家具的有效方式","id":406,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"猫薄荷对大多数猫的作用是？","options":["致幻有害","引起短暂兴奋/放松（安全）","中毒","致命"],"answer":"引起短暂兴奋/放松（安全）","explanation":"猫薄荷安全，多数猫闻后短暂兴奋放松，别过量","id":407,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"以下哪类商品最适合作为猫店引流连带销售？","options":["狗粮","猫砂+猫抓板+化毛膏等高频刚需","大型犬笼","爬宠饲料"],"answer":"猫砂+猫抓板+化毛膏等高频刚需","explanation":"猫砂/抓板/化毛膏是养猫高频消耗，适合连带","id":408,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户第一次养猫来店里买东西，你优先推荐什么？","options":null,"answer":"围绕刚需：①合适的猫砂+猫砂盆（N+1）；②猫粮（按年龄选幼/成猫粮）；③猫包；④猫抓板；⑤化毛膏/猫草；⑥基础洗护用品。并提醒疫苗、绝育和应激管理","explanation":"新手养猫选品","id":409,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":2,"question":"猫身体灵活、易钻缝，店内门窗必须做好防护防逃跑。","options":["正确","错误"],"answer":"正确","explanation":"猫丢失比狗更难找回，门窗防护很重要","id":410,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"猫丢失后，正确的处理是？","options":["等它自己回","立即在周边寻找+查监控+发启事+通知主人","不告诉主人","换店"],"answer":"立即在周边寻找+查监控+发启事+通知主人","explanation":"猫丢失要快找、用监控、发启事，并第一时间通知主人","id":411,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"猫的年龄换算，1岁猫约相当于人类几岁？","options":["5岁","15岁","30岁","1岁"],"answer":"15岁","explanation":"猫1岁≈人类15岁，2岁≈24岁，之后每岁+4","id":412,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":2,"question":"猫7岁以上算老年，饮食和体检需更关注肾脏。","options":["正确","错误"],"answer":"正确","explanation":"猫7岁后进入老年，肾脏和关节是重点","id":413,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"接待猫主人和狗主人，话术差异主要在于？","options":["完全一样","更强调应激管理、独立性和安静环境","都不用管","只聊价格"],"answer":"更强调应激管理、独立性和安静环境","explanation":"猫主人更关心应激、猫的独立性，话术要突出安静专业","id":414,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户说「我们家猫特别怕生，去你们店会不会应激」，你怎么回应？","options":null,"answer":"我们会做应激管理：独立安静的猫接待区、使用费洛蒙、托底搬运不强行抱、提供隐蔽空间，流程尽量快。首次可先带猫来熟悉环境再服务，把应激降到最低","explanation":"猫应激顾虑回应","id":415,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":1,"question":"猫是相对独立的动物，服务时应尊重它的节奏，不强行互动。","options":["正确","错误"],"answer":"正确","explanation":"尊重猫的独立性，强撸易应激","id":416,"tag":"店铺运营(基础)"},{"theme":"breeds","type":"single","difficulty":3,"question":"关于「喜马拉雅猫」，描述正确的是？","options":["长毛、重点色、扁脸（波斯×暹罗）","体型最大","一定不长毛","都凶猛"],"answer"
