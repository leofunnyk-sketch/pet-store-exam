446,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"judge","difficulty":2,"question":"“橘猫”不是单一品种，而是毛色，可出现在多个品种/混血中。","options":["正确","错误"],"answer":"正确","explanation":"橘是毛色基因，英短/美短/田园猫等都可能有橘色","id":447,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":2,"question":"“奶牛猫”通常指？","options":["全黑猫","黑白双色猫","橘猫","蓝猫"],"answer":"黑白双色猫","explanation":"奶牛猫=黑白花色，多为田园猫，性格活泼搞怪","id":448,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"judge","difficulty":2,"question":"三花猫绝大多数为母猫，因毛色基因与X染色体相关。","options":["正确","错误"],"answer":"正确","explanation":"三花（黑红白）需两条X，几乎都是母猫","id":449,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":3,"question":"以下品种中，因扁脸结构最需要关注呼吸和泪痕的是？","options":["英短","波斯/加菲（扁脸）","暹罗","缅因"],"answer":"波斯/加菲（扁脸）","explanation":"短头颅品种呼吸与泪痕风险最高","id":450,"tag":"品种鉴赏(基础)"},{"theme":"breeds","type":"single","difficulty":2,"question":"选购幼猫时，最该优先核实的是？","options":["毛色稀有度","疫苗/健康记录与来源可靠性","名字好听","价格最低"],"answer":"疫苗/健康记录与来源可靠性","explanation":"健康与来源比外观更重要，避免星期猫","id":451,"tag":"品种鉴赏(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"猫粮的最佳储存方式是？","options":["放潮湿处","密封避光阴凉、尽快吃完","敞口放阳台","冷冻随意"],"answer":"密封避光阴凉、尽快吃完","explanation":"猫粮易氧化受潮，密封阴凉保存并在保质期内吃完","id":452,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":2,"question":"猫粮开封后放太久会氧化变质、产生黄曲霉风险。","options":["正确","错误"],"answer":"正确","explanation":"开封猫粮应密封并尽快食用，防霉变","id":453,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"猫的钙磷比建议接近？","options":["2:1","1.1-1.2:1","0.5:1","随便"],"answer":"1.1-1.2:1","explanation":"猫粮钙磷比约1.1-1.2:1最适宜骨骼","id":454,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":3,"question":"猫对维生素A需求高且不能把β-胡萝卜素高效转为维A，缺乏会夜盲。","options":["正确","错误"],"answer":"正确","explanation":"猫转化β-胡萝卜素能力弱，需预成维生素A","id":455,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"猫突然不吃东西（厌食）超过多久应警惕并就医？","options":["半天没事","24-48小时","一周","一个月"],"answer":"24-48小时","explanation":"猫厌食超1-2天易致脂肪肝，需尽快就医","id":456,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":2,"question":"猫长时间不进食可能诱发脂肪肝（猫脂肪沉积症），很危险。","options":["正确","错误"],"answer":"正确","explanation":"猫厌食快速瘦身的脂肪肝死亡率高","id":457,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"怀孕/哺乳母猫的饮食应？","options":["减量","提高热量与优质蛋白","只吃素","少喝水"],"answer":"提高热量与优质蛋白","explanation":"孕哺期能量需求大增，需高蛋高能量粮","id":458,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"冻干（生骨肉冻干）喂食前最好？","options":["直接当唯一主食不管营养均衡","作为辅食或复水后喂、注意均衡","大量加盐","煮熟后喂"],"answer":"作为辅食或复水后喂、注意均衡","explanation":"冻干可做辅食，全价主食冻干才替代主粮，复水有助补水","id":459,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"猫草能帮助猫催吐毛球、补充少量纤维。","options":["正确","错误"],"answer":"正确","explanation":"猫草促吐毛球并补纤维","id":460,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"判断猫饮水量是否充足，可观察？","options":["只看体重","排尿量与尿液颜色/结团","只看食欲","只看毛色"],"answer":"排尿量与尿液颜色/结团","explanation":"尿量充足、尿团正常说明饮水足够","id":461,"tag":"营养喂养(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"猫美容服务中，风险最低、最常提供的是？","options":["强行洗澡","梳毛+剪指甲+洁耳洁眼","剃光毛","染色"],"answer":"梳毛+剪指甲+洁耳洁眼","explanation":"低应激基础护理最安全，洗澡需谨慎","id":462,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":2,"question":"猫洗澡后必须彻底吹干，否则易感冒和皮肤问题。","options":["正确","错误"],"answer":"正确","explanation":"猫毛厚，半干易着凉和真菌","id":463,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"给猫使用吹水机/吹风，最重要的是？","options":["最大风量直吹","低噪低温、保持距离、避免惊吓","越热越好","对着脸吹"],"answer":"低噪低温、保持距离、避免惊吓","explanation":"猫怕噪音热风，应温和远距离","id":464,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"猫的胡须主要作用是？","options":["装饰","感知空间与气流、辅助导航","消化","呼吸"],"answer":"感知空间与气流、辅助导航","explanation":"胡须是触觉器官，帮猫判断缝隙和距离","id":465,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"不应随意剪掉猫的胡须，会影响其空间感知。","options":["正确","错误"],"answer":"正确","explanation":"剪胡须会让猫失去重要触觉信息","id":466,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"猫的肉垫日常可做的护理是？","options":["不用管","保持清洁、干燥开裂时涂宠物润肤","涂人护手霜","剪掉"],"answer":"保持清洁、干燥开裂时涂宠物润肤","explanation":"肉垫干裂可涂宠物专用润肤，避免人用含刺激物","id":467,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":2,"question":"猫的牙齿约30颗，定期口腔检查很重要。","options":["正确","错误"],"answer":"正确","explanation":"成猫约30颗牙，牙周病高发需关注","id":468,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"猫刷牙建议频率是？","options":["一年一次","每天或隔天","从来不用","只在生病"],"answer":"每天或隔天","explanation":"规律刷牙最有效预防牙结石","id":469,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":2,"question":"猫很少需要挤肛门腺，强行操作反而易引起不适。","options":["正确","错误"],"answer":"正确","explanation":"猫肛门腺问题远少于狗，勿随意挤","id":470,"tag":"美容护理(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"猫到家后的如厕训练，正确做法是？","options":["打骂","把猫放砂盆、用同款猫砂、正向引导","关禁闭","不给砂盆"],"answer":"把猫放砂盆、用同款猫砂、正向引导","explanation":"用熟悉砂盆和猫砂引导，乱尿先排查疾病/应激","id":471,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":2,"question":"猫乱尿要先排查疾病（如膀胱炎）和应激，而非直接惩罚。","options":["正确","错误"],"answer":"正确","explanation":"乱尿常是病痛或应激信号，惩罚无效且加重应激","id":472,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"猫出现攻击性（哈气/挥爪）时，正确应对是？","options":["硬抱强行安抚","退后给空间、不强迫","打它","继续逗"],"answer":"退后给空间、不强迫","explanation":"尊重猫界限，硬来会被抓咬且加应激","id":473,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"猫店陈列猫用品，优先突出？","options":["狗窝","高频刚需（猫砂/猫粮/猫包/抓板）","爬宠饲料","异宠用品"],"answer":"高频刚需（猫砂/猫粮/猫包/抓板）","explanation":"刚需高频品做引流和连带","id":474,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":2,"question":"猫用品也有保质期，开封猫湿粮/零食需冷藏并尽快食用。","options":["正确","错误"],"answer":"正确","explanation":"湿粮零食开封易变质，需冷藏限时","id":475,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户问绝育后怎么护理，你怎么说？","options":null,"answer":"术后：戴伊丽莎白圈防舔伤口；保持伤口干燥清洁；安静休息、限制剧烈跳动；按时换药复查；观察食欲精神，异常（红肿渗液/不吃）及时回诊。公猫恢复快，母猫伤口更大需更小心","explanation":"绝育后护理","id":476,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"夏季高温，店内猫最需防范的是？","options":["感冒","中暑（热射病）","冻伤","风湿"],"answer":"中暑（热射病）","explanation":"猫散热差，高温密闭易中暑，需通风降温","id":477,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":3,"question":"客户说猫误食了家里杀虫剂，你如何指导？","options":null,"answer":"立即联系宠物医院并带上包装。不要自行催吐（某些物质催吐更伤）。保持猫安静通风，记录误食时间和量，途中避免剧烈搬动，尽快送医洗胃解毒","explanation":"猫中毒应急","id":478,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":2,"question":"猫客户档案应记录品种/年龄/性别/绝育/疫苗/性情/疾病史/饮食禁忌。","options":["正确","错误"],"answer":"正确","explanation":"完整档案保障服务安全与个性化","id":479,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"制定猫寄养协议，最该明确的是？","options":["只写价格","健康告知+授权送医+免责与赔偿责任","不签","口头约定"],"answer":"健康告知+授权送医+免责与赔偿责任","explanation":"协议明确健康告知与紧急送医授权，防纠纷","id":480,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户想给猫做美容，但猫极度怕水，你怎么推荐？","options":null,"answer":"建议先做低应激基础护理（梳毛、剪指甲、洁耳洁眼），暂不做水洗。若必须清洁，可用宠物干洗泡沫局部擦拭。等猫逐步适应、用费洛蒙安抚后再评估是否洗澡","explanation":"怕水猫的美容方案","id":481,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"向猫主人推销宠物保险，最合适的切入点是？","options":["强行推销","结合绝育/疫苗/意外医疗场景自然介绍","只卖粮","不提"],"answer":"结合绝育/疫苗/意外医疗场景自然介绍","explanation":"在医疗/意外场景顺势介绍保险更自然","id":482,"tag":"店铺运营(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"成年狗日均饮水量大致为体重的？","options":["10-20ml/kg","40-60ml/kg","100ml/kg","200ml/kg"],"answer":"40-60ml/kg","explanation":"狗每日需水约 40-60ml/kg（含食物水分），运动/天热时更多","id":483,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":3,"question":"大型/巨型犬幼年期（如德牧、大丹）最需警惕的骨骼问题是？","options":["缺钙长得慢","发育过快致骨骼关节负担、易髋关节发育不良","毛发差","太瘦"],"answer":"发育过快致骨骼关节负担、易髋关节发育不良","explanation":"大型犬幼年期骨骼未闭合，长太快易致髋关节发育不良(HD)等，应控生长速度","id":484,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"生骨肉（BARF）喂养需严格冷冻杀菌并注意钙磷比，不能随便喂生肉。","options":["正确","错误"],"answer":"正确","explanation":"生肉可能带菌/寄生虫，且需平衡钙磷，否则致营养失衡","id":485,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"关于「无谷粮」，下列说法正确的是？","options":["无谷一定更好","无谷≠低敏，真正粮敏少见，关键看蛋白来源","无谷等于全肉","无谷对狗有毒"],"answer":"无谷≠低敏，真正粮敏少见，关键看蛋白来源","explanation":"多数狗粮敏是蛋白（肉）而非谷物；无谷只是去掉谷物，不等于更优","id":486,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"成犬维持期犬粮「粗蛋白」含量建议不低于？","options":["8%","18%","30%","50%"],"answer":"18%","explanation":"AAFCO 成犬维持粗蛋白最低约 18%，生长期更高","id":487,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"幼犬（生长期）犬粮粗蛋白建议不低于？","options":["18%","22.5%","35%","45%"],"answer":"22.5%","explanation":"生长期幼犬粗蛋白建议≥22.5%，支持发育","id":488,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"狗狗食物过敏的常见表现是？","options":["只掉毛","皮肤瘙痒、耳朵发炎、软便或呕吐","变胖","爱睡觉"],"answer":"皮肤瘙痒、耳朵发炎、软便或呕吐","explanation":"食物过敏多表现为皮肤（瘙痒/耳炎）和消化道症状","id":489,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":3,"question":"排除法饮食（elimination diet）诊断食物过敏，通常需要？","options":["换个口味即可","单一蛋白+单一碳水源喂 8-12 周观察","打疫苗","剃毛"],"answer":"单一蛋白+单一碳水源喂 8-12 周观察","explanation":"需限定全新蛋白和碳水来源持续数周，观察症状是否缓解","id":490,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":2,"question":"狗对巧克力中的可可碱代谢慢，黑巧克力比牛奶巧克力更危险。","options":["正确","错误"],"answer":"正确","explanation":"可可碱狗难代谢，黑巧可可碱浓度高，中毒更重","id":491,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"以下对狗有毒、可致急性肾衰竭的是？","options":["苹果肉","葡萄/葡萄干","胡萝卜","南瓜"],"answer":"葡萄/葡萄干","explanation":"葡萄及葡萄干可致狗急性肾衰竭，无安全剂量","id":492,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"木糖醇对狗的主要危害是？","options":["无害","引发胰岛素骤升导致低血糖和肝损伤","补钙","助消化"],"answer":"引发胰岛素骤升导致低血糖和肝损伤","explanation":"口香糖/甜食中的木糖醇对狗剧毒，少量即可致低血糖肝损","id":493,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":2,"question":"洋葱、大蒜等葱属植物会破坏狗的红细胞，导致溶血性贫血。","options":["正确","错误"],"answer":"正确","explanation":"葱属含硫化物，狗食后红细胞破裂溶血","id":494,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"夏威夷果（macadamia）对狗的作用是？","options":["营养丰富","可致后肢无力、颤抖、发热","能催吐","补钙"],"answer":"可致后肢无力、颤抖、发热","explanation":"夏威夷果对狗有特异毒性，出现运动障碍和发热","id":495,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"训练用零食的热量建议控制在每日总热量？","options":["30%","10%以内","50%","随意"],"answer":"10%以内","explanation":"零食超 10% 易致挑食肥胖，训练应小块高频","id":496,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":2,"question":"训练奖励应小块高频，避免影响正餐总热量。","options":["正确","错误"],"answer":"正确","explanation":"小块零食既奖励又不破坏饮食平衡","id":497,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"老年犬（7岁以上）饮食应重点关注？","options":["高钙不限量","控热量、易消化、护关节护肾","多盐","只吃肉"],"answer":"控热量、易消化、护关节护肾","explanation":"老年犬代谢下降，需控热量并关注关节肾脏","id":498,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"大型深胸犬（德牧、金毛、大丹）易发的致命急腹症是？","options":["感冒","胃扭转（GDV）","掉毛","口臭"],"answer":"胃扭转（GDV）","explanation":"深胸犬吃饱后剧烈运动易胃扭转，是急诊，可致死","id":499,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":2,"question":"预防胃扭转应避免饭后立即剧烈奔跑，并可用慢食碗。","options":["正确","错误"],"answer":"正确","explanation":"少食多餐、慢食、饭后休息可降低 GDV 风险","id":500,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":2,"question":"怀孕/哺乳期母犬需要更高热量和优质蛋白。","options":["正确","错误"],"answer":"正确","explanation":"繁殖期能量和蛋白质需求显著上升","id":501,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"益生菌对狗的主要作用是？","options":["治感冒","调节肠道菌群、帮助消化","补钙","驱虫"],"answer":"调节肠道菌群、帮助消化","explanation":"益生菌有助于维持肠道菌群平衡、改善软便","id":502,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":1,"question":"多数狗有不同程度的乳糖不耐受，喝牛奶易腹泻。","options":["正确","错误"],"answer":"正确","explanation":"成年狗乳糖酶下降，喝牛奶常腹泻，可用宠物奶","id":503,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"判断狗粮是否新鲜，错误的是？","options":["看保质期","颜色越鲜艳越安全","闻有无霉味/油耗味","看有无虫蛀"],"answer":"颜色越鲜艳越安全","explanation":"粮色与新鲜度无关，鲜艳可能来自色素，关键看保质期与气味","id":504,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"湿粮（罐头）相比干粮的主要优势是？","options":["更便宜","水分高、适口好，适合挑食或需补水犬","营养差","不能长期喂"],"answer":"水分高、适口好，适合挑食或需补水犬","explanation":"湿粮含水高、香味好，适合挑食或肾病补水犬","id":505,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"幼犬从母乳/泡软粮过渡到干粮，正确做法是？","options":["直接换干粮","逐步泡软减少直至全干","只喂牛奶","不喂粮"],"answer":"逐步泡软减少直至全干","explanation":"断奶期用温水泡软逐步过渡，保护肠胃","id":506,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":2,"question":"狗也需要控制盐分，人吃的高盐剩饭对狗不利。","options":["正确","错误"],"answer":"正确","explanation":"高盐加重肾脏负担，人类咸食不适合狗","id":507,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":3,"question":"雪橇犬/工作犬（如哈士奇、阿拉斯加）热量需求最高的时期是？","options":["全年一样","冬季和工作/拉车期显著增加","只在夏季","仅幼年期"],"answer":"冬季和工作/拉车期显著增加","explanation":"工作犬在寒冷和工作负荷下能量消耗大增","id":508,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"狗狗减肥的饮食原则是？","options":["不限量","控制总热量+增加运动+高纤维适量蛋白","只吃肉","断食"],"answer":"控制总热量+增加运动+高纤维适量蛋白","explanation":"减肥靠热量缺口，配合运动与饱腹感管理","id":509,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"judge","difficulty":2,"question":"磨牙骨/磨牙零食有助于牙齿健康，但应选不易碎裂的安全材质。","options":["正确","错误"],"answer":"正确","explanation":"过硬骨头易崩裂伤牙，需选安全磨牙品","id":510,"tag":"营养喂养(基础)"},{"theme":"feeding","type":"single","difficulty":2,"question":"不同体型犬的单位体重热量需求，一般是？","options":["都一样","小型犬单位体重需求更高","巨型犬最高","看毛色"],"answer":"小型犬单位体重需求更高","explanation":"小型犬代谢率高，单位体重需能更多","id":511,"tag":"营养喂养(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"狗狗一般建议多久洗一次澡？","options":["每天","2-4周一次（视犬种活动量）","半年一次","从不洗"],"answer":"2-4周一次（视犬种活动量）","explanation":"多数狗 2-4 周洗一次，活动多可勤些","id":512,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"双层毛犬种（哈士奇、萨摩、阿拉斯加）吹毛关键是？","options":["随便吹","逆毛吹干底层绒毛、彻底吹透防湿疹","不吹","只吹表面"],"answer":"逆毛吹干底层绒毛、彻底吹透防湿疹","explanation":"双层毛底层绒湿闷易引发湿疹和皮肤病，必须吹透","id":513,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":2,"question":"双层毛犬不能剃光，否则破坏保温防晒层且可能不再长好。","options":["正确","错误"],"answer":"正确","explanation":"剃秃双层毛会失去调节功能，部分犬绒毛不再正常生长","id":514,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"贵宾/泰迪造型修剪通常包含？","options":["只剪尾巴","全身修剪并修圆脚、头、尾等造型","不剪","只洗澡"],"answer":"全身修剪并修圆脚、头、尾等造型","explanation":"贵宾造型需全身修剪并修出圆润线条","id":515,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"雪纳瑞典型造型会保留？","options":["光头","眉毛和腿部的椒盐造型毛","全剃光","只留尾巴"],"answer":"眉毛和腿部的椒盐造型毛","explanation":"雪纳瑞造型保留胡须眉毛和腿部毛，呈椒盐感","id":516,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"拔耳毛适用于哪类狗？","options":["所有狗","耳道多毛犬种（贵宾、雪纳瑞、比熊）","无毛犬","猫"],"answer":"耳道多毛犬种（贵宾、雪纳瑞、比熊）","explanation":"耳道多毛犬易积垢发炎，需定期拔耳毛","id":517,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"挤肛门腺是狗狗美容常见项目，但过频或手法不对易损伤。","options":["正确","错误"],"answer":"正确","explanation":"肛门腺应适度清理，过度挤压会发炎","id":518,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"狗狗肛门腺发炎的典型表现是？","options":["爱吃","蹭屁股（拖行）/频繁舔肛门","爱叫","掉毛"],"answer":"蹭屁股（拖行）/频繁舔肛门","explanation":"肛门腺淤积发炎时狗会蹭地磨臀","id":519,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":1,"question":"修剪脚底（趾间）毛的目的是？","options":["好看","防滑、防打结和异味","长高","没用"],"answer":"防滑、防打结和异味","explanation":"脚底毛过长易打滑、藏污，应定期修剪","id":520,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"体外驱虫（除蚤蜱）一般建议频率是？","options":["一年一次","每月一次（视产品与季节）","只在夏天","从不"],"answer":"每月一次（视产品与季节）","explanation":"多数外驱产品每月用一次，蜱虫活跃季更需注意","id":521,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":2,"question":"长毛犬打结严重时应先用开结梳/剪除，硬扯会伤皮肤。","options":["正确","错误"],"answer":"正确","explanation":"硬扯打结会扯痛甚至撕伤皮肤","id":522,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"修剪狗狗指甲时，应避开的是？","options":["白色尖端","粉色血线","指甲外角","无所谓"],"answer":"粉色血线","explanation":"血线含血管神经，剪到会出血疼痛","id":523,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"狗狗美容台保定常用方式是？","options":["绳子吊脖子","胸带+牵引+防滑垫安全固定","胶带粘贴","关灯"],"answer":"胸带+牵引+防滑垫安全固定","explanation":"美容台需防滑并安全固定，避免坠落和挣扎受伤","id":524,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":2,"question":"犬用沐浴露应为弱酸性（接近狗皮肤pH），不能用人的碱性洗发水。","options":["正确","错误"],"answer":"正确","explanation":"狗皮肤偏中性微酸，人用碱性产品会破坏屏障","id":525,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"给狗吹风的温度应控制在？","options":["越热越好","温热不烫（接近体温）","冰冷","烫手才有效"],"answer":"温热不烫（接近体温）","explanation":"过热烫伤皮肤，温热即可，边吹边梳","id":526,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"刚毛犬（雪纳瑞、刚毛猎狐梗）维持质感常用？","options":["剃光","拔毛（手拔/拔毛刀）","染色","不处理"],"answer":"拔毛（手拔/拔毛刀）","explanation":"刚毛犬靠拔毛维持粗硬质感，剃毛会变软","id":527,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"比熊、贵宾等易有泪痕的狗，日常应？","options":["不管","每日擦眼周并排查饮食/鼻泪管","多盐","少喝水"],"answer":"每日擦眼周并排查饮食/鼻泪管","explanation":"泪痕需日常清洁并查明饮食或鼻泪管原因","id":528,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":2,"question":"美容前应先梳通毛发、检查皮肤有无伤口或寄生虫。","options":["正确","错误"],"answer":"正确","explanation":"美容前检查可早发现皮肤问题和寄生虫","id":529,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"药浴（治疗脂溢、真菌等）通常需要？","options":["一次就好","按医嘱反复浸泡并停留数分钟","随便冲","只洗头部"],"answer":"按医嘱反复浸泡并停留数分钟","explanation":"药用浴液需停留才能起效，遵医嘱频次","id":530,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"长毛/卷毛犬（如贵宾、比熊）美容频率建议？","options":["半年一次","4-6周一次","一年一次","从不"],"answer":"4-6周一次","explanation":"卷毛长毛易打结，4-6 周修剪一次保持造型","id":531,"tag":"美容护理(基础)"},{"theme":"grooming","type":"judge","difficulty":1,"question":"洗澡前先梳通打结，避免毛发湿水后结得更紧。","options":["正确","错误"],"answer":"正确","explanation":"湿水会让毛结缩紧更难解，先梳再洗","id":532,"tag":"美容护理(基础)"},{"theme":"grooming","type":"single","difficulty":2,"question":"狗狗香水/留香喷雾使用注意？","options":["大量喷","避开眼鼻、少量使用、不替代清洁","喷眼睛","当药喷"],"answer":"避开眼鼻、少量使用、不替代清洁","explanation":"宠物香水仅增香，需避开黏膜、不能代替清洁","id":533,"tag":"美容护理(基础)"},{"theme":"breeds","type":"single","difficult 间应做到？","options":["越小越好","能转身站立、通风干净、每日放风","不清理","关灯不管"],"answer":"能转身站立、通风干净、每日放风","explanation":"寄养笼应保证基本活动与卫生","id":562,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":2,"question":"寄养犬只需每日观察食欲、精神、排泄，有无腹泻呕吐。","options":["正确","错误"],"answer":"正确","explanation":"异常常先体现在食欲和排泄上","id":563,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"牵遛服务最关键的是？","options":["越快越好","安全牵引不脱绳、清理排泄物、避让怕狗者","不牵绳","随便跑"],"answer":"安全牵引不脱绳、清理排泄物、避让怕狗者","explanation":"牵遛安全与文明是第一原则","id":564,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"胸背带（harness）相对颈圈更适合？","options":["所有狗都该用项圈","小型犬、气管敏感犬、爆冲犬","大型猛犬专属","不用"],"answer":"小型犬、气管敏感犬、爆冲犬","explanation":"胸背分散拉力，保护气管和颈椎","id":565,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":2,"question":"P绳（P链）需专业使用，错误使用会伤气管和颈部。","options":["正确","错误"],"answer":"正确","explanation":"P链是矫正工具，使用不当易伤犬","id":566,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"狗狗定点大小便训练的核心是？","options":["打骂惩罚","固定地点+及时奖励+定时带出","关笼","不理"],"answer":"固定地点+及时奖励+定时带出","explanation":"正向强化+规律带出是训练关键","id":567,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"狗狗分离焦虑的常见表现是？","options":["安静睡觉","拆家/乱尿/不停吠叫/流涎","不理人","爱吃"],"answer":"拆家/乱尿/不停吠叫/流涎","explanation":"分离焦虑表现为独处时的破坏和应激","id":568,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":2,"question":"狗狗过度吠叫应先排查需求（排泄/无聊/恐惧）再行为纠正，不能只打骂。","options":["正确","错误"],"answer":"正确","explanation":"吠叫是沟通，先找原因再纠正","id":569,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"读狗的肢体语言：尾巴高举僵硬、身体前倾通常表示？","options":["放松","警觉或有攻击意图","想玩","困了"],"answer":"警觉或有攻击意图","explanation":"僵直高举尾+前倾是警戒/攻击前兆","id":570,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"遇到陌生狗，正确做法是？","options":["冲上去抱","让狗先闻手背、不直视不强行摸","抓尾巴","尖叫"],"answer":"让狗先闻手背、不直视不强行摸","explanation":"尊重犬意愿、侧身伸手背让其嗅闻","id":571,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":2,"question":"店内多犬共处需监督，出现低吼/僵立要立即分开防冲突。","options":["正确","错误"],"answer":"正确","explanation":"低吼是警告信号，及时分隔避免咬伤","id":572,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"接待狗主人、建立信任的关键是？","options":["只推贵的","专业+耐心+把狗当客户","不理","催单"],"answer":"专业+耐心+把狗当客户","explanation":"专业和同理心最能赢得宠主信任","id":573,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"寄养协议应明确？","options":["不用签","健康状态/疫苗/授权送医/费用责任","只写名字","口头说就行"],"answer":"健康状态/疫苗/授权送医/费用责任","explanation":"协议明确权责，含紧急送医授权","id":574,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":2,"question":"烈性犬/大型犬到店需确认疫苗与性情，必要时要求主人陪同或婉拒。","options":["正确","错误"],"answer":"正确","explanation":"高风险犬需评估，保障人犬安全","id":575,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"店里有两只狗突然打架，一只耳朵出血，你怎么处理？","options":null,"answer":"立即分隔双方、戴手套检查伤口并压迫止血，评估是否需送医；安抚主人、记录事件经过，必要时暂停服务并签知情同意。事后复盘分隔流程","explanation":"店内犬只冲突应急","id":576,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"文明养犬「三要素」通常指？","options":["吃好睡好","办证/疫苗/牵绳拾便","不洗澡","不遛狗"],"answer":"办证/疫苗/牵绳拾便","explanation":"合法、健康、文明是养犬基础","id":577,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":1,"question":"遛狗必须拾便，是养犬人基本责任，也是门店应倡导的。","options":["正确","错误"],"answer":"正确","explanation":"拾便维护公共卫生，体现文明养犬","id":578,"tag":"店铺运营(基础)"},{"theme":"operations","type":"single","difficulty":2,"question":"幼犬首次到店洗澡/美容，应注意？","options":["随便洗","确认疫苗齐全、体弱幼犬谨慎、防应激","不洗","只剪指甲"],"answer":"确认疫苗齐全、体弱幼犬谨慎、防应激","explanation":"幼犬免疫未全易感染，且易应激","id":579,"tag":"店铺运营(基础)"},{"theme":"operations","type":"scenario","difficulty":2,"question":"客户说「我家狗太爆冲，遛它我拉不住」，你怎么建议？","options":null,"answer":"建议换前扣式胸背带、练习松弛牵引（随行），从安静环境短时间开始，并用慢食玩具消耗精力；爆冲多因精力过剩，增加每日运动。也可约我们的牵遛服务","explanation":"爆冲纠正建议","id":580,"tag":"店铺运营(基础)"},{"theme":"operations","type":"judge","difficulty":2,"question":"老年犬服务要更温柔、防滑、避免长时间站立和剧烈美容。","options":["正确","错误"],"answer":"正确","explanation":"老年犬关节差、耐受低，需更呵护","id":581,"tag":"店铺运营(基础)"},{"theme":"feeding","tag":"营养基础","type":"single","difficulty":2,"question":"AAFCO 标准中，成年犬（维持期）粮粗蛋白最低要求约为？","options":["10%","18%","30%","45%"],"answer":"18%","explanation":"AAFCO 成年犬维持期粗蛋白最低约 18%（干物质基础），生长期≥22.5%","id":582},{"theme":"feeding","tag":"营养基础","type":"single","difficulty":2,"question":"AAFCO 标准中，成年猫粮粗蛋白最低要求约为？","options":["18%","22%","26%","35%"],"answer":"26%","explanation":"猫对蛋白需求高于狗，AAFCO 成年猫维持期粗蛋白≥26%，生长期≥30%","id":583},{"theme":"feeding","tag":"营养基础","type":"single","difficulty":3,"question":"犬粮能量密度通常按多少 kcal ME/g 干物质估算营养浓度？","options":["2.0","3.5","5.5","7.0"],"answer":"3.5","explanation":"AAFCO 营养浓度按约 3.5–4.0 kcal ME/g 干物质能量密度设定","id":584},{"theme":"feeding","tag":"营养基础","type":"judge","difficulty":1,"question":"蛋白质是犬猫构建肌肉、酶、抗体和皮肤被毛的基础营养素。","options":["正确","错误"],"answer":"正确","explanation":"蛋白质提供必需氨基酸，参与几乎所有生理功能","id":585},{"theme":"feeding","tag":"营养基础","type":"single","difficulty":2,"question":"犬猫粮标签上的「营养充足性声明」应说明该产品符合哪类标准？","options":["口味标准","AAFCO（或等效）营养素标准及适用生命阶段","包装美观度","价格档次"],"answer":"AAFCO（或等效）营养素标准及适用生命阶段","explanation":"营养充足性声明是判断粮是否全价均衡的关键","id":586},{"theme":"feeding","tag":"营养基础","type":"single","difficulty":2,"question":"以下哪项是犬猫都需要的必需脂肪酸（omega-6）？","options":["亚麻酸(linoleic acid)","草酸","胆固醇","蔗糖"],"answer":"亚麻酸(linoleic acid)","explanation":"犬猫均需亚油酸（omega-6）；猫还需花生四烯酸（猫不能由亚油酸转化）","id":587},{"theme":"feeding","tag":"营养基础","type":"single","difficulty":3,"question":"猫不能像狗一样由亚油酸有效转化为哪种脂肪酸，必须从肉类中获取？","options":["花生四烯酸(arachidonic acid)","亚油酸","油酸","棕榈酸"],"answer":"花生四烯酸(arachidonic acid)","explanation":"猫缺乏 Δ6-去饱和酶，无法将亚油酸转为花生四烯酸，需从禽肉/蛋/鱼脂肪获取","id":588},{"theme":"feeding","tag":"营养基础","type":"judge","difficulty":2,"question":"脂肪帮助脂溶性维生素 A、D、E、K 的吸收与运输。","options":["正确","错误"],"answer":"正确","explanation":"脂肪是脂溶性维生素的载体","id":589},{"theme":"feeding","tag":"营养基础","type":"single","difficulty":2,"question":"钙磷比（Ca:P）对犬猫骨骼健康很重要，一般建议接近？","options":["1:1 到 2:1","5:1","0.2:1","10:1"],"answer":"1:1 到 2:1","explanation":"AAFCO 建议 Ca:P 约 1:1–2:1，失衡影响骨骼发育","id":590},{"theme":"feeding","tag":"营养基础","type":"judge","difficulty":2,"question":"维生素 A 对猫必须是「预成型」（来自动物），猫将植物 beta-胡萝卜素转化为活性维A的能力很弱。","options":["正确","错误"],"answer":"正确","explanation":"猫转化胡萝卜素能力差，需动物源维A","id":591},{"theme":"feeding","tag":"营养基础","type":"single","difficulty":2,"question":"犬猫缺乏下列哪种维生素会出现夜盲、干眼等（尤其幼龄）？","options":["维生素C","维生素A","维生素B1","维生素K"],"answer":"维生素A","explanation":"维A关乎视力与上皮健康","id":592},{"theme":"feeding","tag":"生命阶段营养","type":"single","difficulty":2,"question":"犬粮「生长期/繁殖期」粗蛋白最低要求约高于「成年维持期」，原因是？","options":["生长期需更多蛋白支持发育","蛋白没用","成年更需要","看毛色"],"answer":"生长期需更多蛋白支持发育","explanation":"犬生长期/繁殖期蛋白需求（22.5%）高于维持期（18%），支持生长与泌乳","id":593},{"theme":"feeding","tag":"生命阶段营养","type":"judge","difficulty":1,"question":"犬幼龄阶段应喂幼龄粮而非成年粮，因营养密度不同。","options":["正确","错误"],"answer":"正确","explanation":"幼龄需要更高蛋白热量，成年粮不够","id":594},{"theme":"feeding","tag":"生命阶段营养","type":"single","difficulty":2,"question":"猫粮「生长期/繁殖期」粗蛋白最低要求约高于「成年维持期」，原因是？","options":["生长期需更多蛋白支持发育","蛋白没用","成年更需要","看毛色"],"answer":"生长期需更多蛋白支持发育","explanation":"猫生长期/繁殖期蛋白需求（30%）高于维持期（26%），支持生长与泌乳","id":595},{"theme":"feeding","tag":"生命阶段营养","type":"judge","difficulty":1,"question":"猫幼龄阶段应喂幼龄粮而非成年粮，因营养密度不同。","options":["正确","错误"],"answer":"正确","explanation":"幼龄需要更高蛋白热量，成年粮不够","id":596},{"theme":"feeding","tag":"生命阶段营养","type":"single","difficulty":1,"question":"AAFCO 认可的生命阶段包括？","options":["仅幼年和老年","妊娠/哺乳、生长、维持、全生命阶段","只有成年","只有减肥期"],"answer":"妊娠/哺乳、生长、维持、全生命阶段","explanation":"四阶段：gestation/lactation、growth、maintenance、all life stages","id":597},{"theme":"feeding","tag":"生命阶段营养","type":"single","difficulty":2,"question":"「全生命阶段(all life stages)」粮营养浓度按哪个阶段设计，因此？","options":["按老年设计","按生长/繁殖最高需求设计，故能量高","按减肥设计","随机"],"answer":"按生长/繁殖最高需求设计，故能量高","explanation":"全阶段粮按最高需求（生长/繁殖）配制， sedentary 成年犬吃易胖","id":598},{"theme":"feeding","tag":"生命阶段营养","type":"judge","difficulty":2,"question":"老年犬猫（7岁以上）应关注热量控制、易消化蛋白与关节/肾脏养护。","options":["正确","错误"],"answer":"正确","explanation":"老年代谢下降，需控热量并护关节肾脏","id":599},{"theme":"feeding","tag":"生命阶段营养","type":"single","difficulty":2,"question":"怀孕/哺乳期母犬母猫的能量与蛋白需求会？","options":["下降","显著上升","不变","只需喝水"],"answer":"显著上升","explanation":"繁殖期能量蛋白需求大增，需高营养密度粮","id":600},{"theme":"feeding","tag":"生命阶段营养","type":"judge","difficulty":1,"question":"幼年动物换粮/换食应循序渐进（如7日过渡），避免肠胃应激。","options":["正确","错误"],"answer":"正确","explanation":"突然换食易软便呕吐","id":601},{"theme":"feeding","tag":"疾病与特殊营养","type":"single","difficulty":3,"question":"猫长期牛磺酸缺乏最典型导致？","options":["佝偻病","扩张型心肌病(DCM)与视网膜变性（夜盲）","糖尿病","肾结石"],"answer":"扩张型心肌病(DCM)与视网膜变性（夜盲）","explanation":"牛磺酸缺乏致猫 DCM 与中央视网膜变性，猫粮必须强化","id":602},{"theme":"feeding","tag":"疾病与特殊营养","type":"judge","difficulty":2,"question":"心脏病处方粮常限制钠并添加牛磺酸、左旋肉碱等。","options":["正确","错误"],"answer":"正确","explanation":"心粮控钠、支持心肌","id":603},{"theme":"feeding","tag":"疾病与特殊营养","type":"single","difficulty":2,"question":"慢性肾病(CKD)犬猫的处方粮通常？","options":["高磷高蛋白","适度限磷、优质易消化蛋白、促饮水","只吃肉","无盐无蛋白"],"answer":"适度限磷、优质易消化蛋白、促饮水","explanation":"肾粮控磷减轻肾脏负担，维持蛋白质量","id":604},{"theme":"feeding","tag":"疾病与特殊营养","type":"single","difficulty":2,"question":"肥胖犬猫减重的核心是？","options":["断食","热量缺口：控总热量+增加运动+高纤维适量蛋白","只吃肉","多盐"],"answer":"热量缺口：控总热量+增加运动+高纤维适量蛋白","explanation":"减重靠持续热量缺口","id":605},{"theme":"feeding","tag":"疾病与特殊营养","type":"judge","difficulty":2,"question":"食物过敏诊断常用「排除法饮食」：单一蛋白+单一碳水源喂 8–12 周观察。","options":["正确","错误"],"answer":"正确","explanation":"排除饮食是诊断粮敏的金标准","id":606},{"theme":"feeding","tag":"疾病与特殊营养","type":"single","difficulty":2,"question":"犬猫食物过敏最常见表现是？","options":["只掉毛","皮肤瘙痒、外耳炎、软便/呕吐","变胖","爱睡觉"],"answer":"皮肤瘙痒、外耳炎、软便/呕吐","explanation":"粮敏多为皮肤（瘙痒/耳炎）与消化道症状","id":607},{"theme":"feeding","tag":"疾病与特殊营养","type":"single","difficulty":3,"question":"犬胰腺炎常见诱因是？","options":["低脂饮食","高脂饮食/肥胖","多喝水","多运动"],"answer":"高脂饮食/肥胖","explanation":"高脂饮食与肥胖是急性胰腺炎重要诱因","id":608},{"theme":"feeding","tag":"疾病与特殊营养","type":"judge","difficulty":2,"question":"糖尿病（尤其肥胖中年猫）管理常需处方粮+监测血糖，部分需胰岛素。","options":["正确","错误"],"answer":"正确","explanation":"猫糖尿病常见于 overweight 中年猫","id":609},{"theme":"feeding","tag":"疾病与特殊营养","type":"single","difficulty":2,"question":"中链甘油三酯(MCT)在犬可被直接吸收，常用于？","options":["减肥","认知障碍/淋巴血管瘤等特殊情况","驱虫","补钙"],"answer":"认知障碍/淋巴血管瘤等特殊情况","explanation":"MCT 不经淋巴直接入血，用于认知障碍、淋巴血管瘤等","id":610},{"theme":"feeding","tag":"禁忌食物","type":"single","difficulty":2,"question":"关于「巧克力（可可碱/咖啡因）」对犬猫的危害，正确的是？","options":["安全可少量喂","巧克力（可可碱/咖啡因）：甲基黄嘌呤中毒，中枢神经与心脏兴奋，黑巧>牛奶巧，犬可可碱LD50约100–200mg/kg","煮熟就无害","晒干了没事"],"answer":"巧克力（可可碱/咖啡因）：甲基黄嘌呤中毒，中枢神经与心脏兴奋，黑巧>牛奶巧，犬可可碱LD50约100–200mg/kg","explanation":"巧克力（可可碱/咖啡因）——犬摄入黑巧20mg/kg即可出现症状，严重者抽搐心衰","id":611},{"theme":"feeding","tag":"禁忌食物","type":"single","difficulty":2,"question":"关于「葡萄/葡萄干」对犬猫的危害，正确的是？","options":["安全可少量喂","葡萄/葡萄干：急性肾衰竭，无安全剂量，犬约4g/kg葡萄或11g/kg葡萄干可肾损伤","煮熟就无害","晒干了没事"],"answer":"葡萄/葡萄干：急性肾衰竭，无安全剂量，犬约4g/kg葡萄或11g/kg葡萄干可肾损伤","explanation":"葡萄/葡萄干——约17%葡萄中毒犬发展为无尿型肾衰","id":612},{"theme":"feeding","tag":"禁忌食物","type":"single","difficulty":2,"question":"关于「洋葱/大蒜/韭菜（葱属）」对犬猫的危害，正确的是？","options":["安全可少量喂","洋葱/大蒜/韭菜（葱属）：硫化物破坏红细胞致溶血性贫血，猫更敏感，症状延迟24–72h","煮熟就无害","晒干了没事"],"answer":"洋葱/大蒜/韭菜（葱属）：硫化物破坏红细胞致溶血性贫血，猫更敏感，症状延迟24–72h","explanation":"洋葱/大蒜/韭菜（葱属）——犬食洋葱约5g/kg可中毒，可见血红蛋白尿","id":613},{"theme":"feeding","tag":"禁忌食物","type":"single","difficulty":2,"question":"关于「木糖醇（代糖）」对犬猫的危害，正确的是？","options":["安全可少量喂","木糖醇（代糖）：刺激胰岛素骤升致低血糖（犬0.1g/kg），>0.5g/kg致肝坏死","煮熟就无害","晒干了没事"],"answer":"木糖醇（代糖）：刺激胰岛素骤升致低血糖（犬0.1g/kg），>0.5g/kg致肝坏死","explanation":"木糖醇（代糖）——常见于无糖口香糖、花生酱、牙膏","id":614},{"theme":"feeding","tag":"禁忌食物","type":"single","difficulty":2,"question":"关于「夏威夷果」对犬猫的危害，正确的是？","options":["安全可少量喂","夏威夷果：神经肌肉毒性，后肢无力、高热、震颤，犬约2.4g/kg出现症状","煮熟就无害","晒干了没事"],"answer":"夏威夷果：神经肌肉毒性，后肢无力、高热、震颤，犬约2.4g/kg出现症状","explanation":"夏威夷果——致死率低但痛苦","id":615},{"theme":"feeding","tag":"禁忌食物","type":"single","difficulty":2,"question":"关于「酒精」对犬猫的危害，正确的是？","options":["安全可少量喂","酒精：中枢抑制、酸中毒、昏迷甚至死亡","煮熟就无害","晒干了没事"],"answer":"酒精：中枢抑制、酸中毒、昏迷甚至死亡","explanation":"酒精——犬猫肝脏难代谢酒精","id":616},{"theme":"feeding","tag":"禁忌食物","type":"single","difficulty":2,"question":"关于「牛油果（persin）」对犬猫的危害，正确的是？","options":["安全可少量喂","牛油果（persin）：心肌与消化道毒性，大量致呕吐腹泻","煮熟就无害","晒干了没事"],"answer":"牛油果（persin）：心肌与消化道毒性，大量致呕吐腹泻","explanation":"牛油果（persin）——果皮果核含量更高","id":617},{"theme":"feeding","tag":"禁忌食物","type":"single","difficulty":2,"question":"关于「煮熟禽骨/鱼骨」对犬猫的危害，正确的是？","options":["安全可少量喂","煮熟禽骨/鱼骨：易碎裂成尖刺，划伤刺穿消化道","煮熟就无害","晒干了没事"],"answer":"煮熟禽骨/鱼骨：易碎裂成尖刺，划伤刺穿消化道","explanation":"煮熟禽骨/鱼骨——熟骨脆，危险","id":618},{"theme":"feeding","tag":"禁忌食物","type":"single","difficulty":2,"question":"关于「生酵母面团」对犬猫的危害，正确的是？","options":["安全可少量喂","生酵母面团：胃内发酵产气致胃扩张，酒精中毒","煮熟就无害","晒干了没事"],"answer":"生酵母面团：胃内发酵产气致胃扩张，酒精中毒","explanation":"生酵母面团——发酵产酒精","id":619},{"theme":"feeding","tag":"禁忌食物","type":"single","difficulty":2,"question":"关于「咖啡/茶（咖啡因）」对犬猫的危害，正确的是？","options":["安全可少量喂","咖啡/茶（咖啡因）：同甲基黄嘌呤类，心跳加速抽搐","煮熟就无害","晒干了没事"],"answer":"咖啡/茶（咖啡因）：同甲基黄嘌呤类，心跳加速抽搐","explanation":"咖啡/茶（咖啡因）——与巧克力同机制","id":620},{"theme":"feeding","tag":"禁忌食物","type":"single","difficulty":2,"question":"关于「大剂量葡萄干/黑加仑」对犬猫的危害，正确的是？","options":["安全可少量喂","大剂量葡萄干/黑加仑：酒石酸肾毒性","煮熟就无害","晒干了没事"],"answer":"大剂量葡萄干/黑加仑：酒石酸肾毒性","explanation":"大剂量葡萄干/黑加仑——新鲜葡萄20–150g/kg可肾毒","id":621},{"theme":"feeding","tag":"禁忌食物","type":"judge","difficulty":2,"question":"百合（Lilium 属）对猫有致命肾毒性，花/叶/花粉/插花水均可致急性肾衰竭。","options":["正确","错误"],"answer":"正确","explanation":"百合是猫最危险植物之一，几克即可致命","id":622},{"theme":"feeding","tag":"禁忌食物","type":"scenario","difficulty":3,"question":"客户说狗偷吃了一块黑巧克力（约30g，狗重10kg），你怎么建议？","options":null,"answer":"黑巧可可碱高，按体重可能达中毒剂量。立即联系宠物医院，告知品种重量与摄入量，遵医嘱催吐/活性炭/输液。观察呕吐、亢奋、心动过速、抽搐。不要在家观望","explanation":"巧克力中毒处理","id":623},{"theme":"feeding","tag":"禁忌食物","type":"scenario","difficulty":2,"question":"客户问「葡萄能不能给狗尝一颗」，你怎么回答？","options":null,"answer":"绝对不行。葡萄/葡萄干可致急性肾衰竭且无安全剂量，哪怕一两颗也有风险，请一律不喂","explanation":"葡萄禁忌","id":624},{"theme":"feeding","tag":"喂养管理","type":"single","difficulty":1,"question":"判断犬猫胖瘦最可靠的方法是？","options":["只看体重数字","摸肋骨+看腰线/体态评分","看脸圆不圆","看食量"],"answer":"摸肋骨+看腰线/体态评分","explanation":"能摸到肋骨但无明显突出、有腰线＝标准体型（BCS）","id":625},{"theme":"feeding","tag":"喂养管理","type":"single","difficulty":1,"question":"犬每日饮水量大致为体重的？","options":["10–20ml/kg","40–60ml/kg","150ml/kg","300ml/kg"],"answer":"40–60ml/kg","explanation":"含食物水分，运动/天热更多","id":626},{"theme":"feeding","tag":"喂养管理","type":"judge","difficulty":1,"question":"零食热量应控制在每日总热量10%以内，避免挑食与肥胖。","options":["正确","错误"],"answer":"正确","explanation":"训练零食应小块高频","id":627},{"theme":"feeding","tag":"喂养管理","type":"single","difficulty":2,"question":"「7日换粮法」的目的是？","options":["让狗讨厌旧粮","逐步替换减少肠胃应激","节省粮食","增加销量"],"answer":"逐步替换减少肠胃应激","explanation":"新旧粮按比例7天过渡，降低腹泻呕吐","id":628},{"theme":"feeding","tag":"喂养管理","type":"judge","difficulty":2,"question":"大型深胸犬（德牧、大丹、金毛）饭后立即剧烈奔跑易诱发胃扭转(GDV)，应避免。","options":["正确","错误"],"answer":"正确","explanation":"GDV 是致命急症，饭后休息+慢食碗预防","id":629},{"theme":"feeding","tag":"喂养管理","type":"single","difficulty":2,"question":"储存犬猫粮应注意？","options":["放阳台暴晒","阴凉干燥密封、防虫防潮、看保质期","冷冻即可","随便放"],"answer":"阴凉干燥密封、防虫防潮、看保质期","explanation":"粮怕潮怕热，开封后尽快吃完并密封","id":630},{"theme":"feeding","tag":"猫营养特","type":"single","difficulty":2,"question":"猫在营养学上属于？","options":["杂食动物","专性肉食动物(obligate carnivore)","草食动物","杂食偏素"],"answer":"专性肉食动物(obligate carnivore)","explanation":"猫必须从肉类获取牛磺酸、花生四烯酸、预成型维A","id":631},{"theme":"feeding","tag":"猫营养特","type":"judge","difficulty":2,"question":"猫尝不出甜味（缺乏甜味受体），对糖不敏感。","options":["正确","错误"],"answer":"正确","explanation":"猫缺甜味受体","id":632},{"theme":"feeding","tag":"猫营养特","type":"single","difficulty":2,"question":"室内猫易缺水，最直接的改善是？","options":["少给水","流动饮水机+多放水盆+湿粮","只喂干粮","加盐"],"answer":"流动饮水机+多放水盆+湿粮","explanation":"猫渴觉弱，需主动诱导饮水，湿粮最佳","id":633},{"theme":"feeding","tag":"猫营养特","type":"judge","difficulty":2,"question":"牛磺酸对猫的心脏和视网膜都至关重要，猫粮必须强化。","options":["正确","错误"],"answer":"正确","explanation":"牛磺酸缺乏致 DCM 与夜盲","id":634},{"theme":"feeding","tag":"猫营养特","type":"single","difficulty":2,"question":"幼猫（2–4月龄）每日建议喂几餐？","options":["1餐","3–4餐少食多餐","自由不停","1周1次"],"an ：兴奋中枢，心率加快可中毒","explanation":"兴奋中枢，心率加快可中毒","id":1455},{"theme":"feeding","tag":"禁忌食物","type":"single","difficulty":2,"question":"关于宠物与生面团(酵母)，正确的是？","options":["危险：胃内发酵产气并产酒精，危险","安全可随意喂","煮熟就绝对无害","晒干就没事"],"answer":"危险：胃内发酵产气并产酒精，危险","explanation":"胃内发酵产气并产酒精，危险","id":1456},{"theme":"feeding","tag":"禁忌食物","type":"single","difficulty":2,"question":"关于宠物与牛油果(果核/果皮)，正确的是？","options":["危险：含persin，部分动物敏感，猫狗慎喂","安全可随意喂","煮熟就绝对无害","晒干就没事"],"answer":"危险：含persin，部分动物敏感，猫狗慎喂","explanation":"含persin，部分动物敏感，猫狗慎喂","id":1457},{"theme":"feeding","tag":"禁忌食物","type":"single","difficulty":2,"question":"关于宠物与生的动物肝脏(大量)，正确的是？","options":["危险：过量维生素A蓄积中毒","安全可随意喂","煮熟就绝对无害","晒干就没事"],"answer":"危险：过量维生素A蓄积中毒","explanation":"过量维生素A蓄积中毒","id":1458},{"theme":"feeding","tag":"禁忌食物","type":"single","difficulty":2,"question":"关于宠物与乳糖(成年猫狗)，正确的是？","options":["危险：多数成年后乳糖不耐，饮奶易腹泻","安全可随意喂","煮熟就绝对无害","晒干就没事"],"answer":"危险：多数成年后乳糖不耐，饮奶易腹泻","explanation":"多数成年后乳糖不耐，饮奶易腹泻","id":1459},{"theme":"feeding","tag":"喂养管理","type":"single","difficulty":1,"question":"更换主粮推荐过渡天数？","options":["约7天逐步混合过渡","当天直接换","1天换完","不用过渡"],"answer":"约7天逐步混合过渡","explanation":"7天过渡降低胃肠应激。","id":1460},{"theme":"feeding","tag":"喂养管理","type":"single","difficulty":2,"question":"犬猫每日饮水量大致参考？","options":["约40-60ml/kg/天(随食物含水量变化)","越小越好","越多越好不限","与体重无关"],"answer":"约40-60ml/kg/天(随食物含水量变化)","explanation":"吃干粮者需更多饮水。","id":1461},{"theme":"feeding","tag":"喂养管理","type":"judge","difficulty":1,"question":"应保持犬猫饮食器皿清洁、饮水新鲜，避免剩食久放。","options":["正确","错误"],"answer":"正确","explanation":"卫生防污染。","id":1462},{"theme":"feeding","tag":"喂养管理","type":"single","difficulty":2,"question":"体况评分(BCS)常用9分制，理想区间？","options":["4-5分(肋骨可触及不显见)","1分最佳","9分最佳","越胖越好"],"answer":"4-5分(肋骨可触及不显见)","explanation":"4-5为理想体型。","id":1463},{"theme":"feeding","tag":"喂养管理","type":"judge","difficulty":2,"question":"自由采食(全天不限量)对多数家养猫易致肥胖，建议定时定量。","options":["正确","错误"],"answer":"正确","explanation":"控制热量防肥胖。","id":1464},{"theme":"feeding","tag":"喂养管理","type":"single","difficulty":2,"question":"开封后的干粮应如何保存？","options":["密封、阴凉干燥、避光，尽快用完","敞口受潮","放暖气旁","混生肉"],"answer":"密封、阴凉干燥、避光，尽快用完","explanation":"防潮防氧化变质。","id":1465},{"theme":"feeding","tag":"喂养管理","type":"single","difficulty":2,"question":"湿粮(罐头)相比干粮的主要特点？","options":["含水量高、助补水，但开封后易变质需冷藏","毫无水分","能长期常温存放","致结石"],"answer":"含水量高、助补水，但开封后易变质需冷藏","explanation":"湿粮补水好但需冷藏。","id":1466},{"theme":"feeding","tag":"喂养管理","type":"judge","difficulty":3,"question":"生骨肉(BARF)喂养存在细菌/寄生虫与营养不均衡风险，需专业配方与冷冻处理。","options":["正确","错误"],"answer":"正确","explanation":"生食有公卫与营养风险。","id":1467},{"theme":"feeding","tag":"猫营养特","type":"single","difficulty":2,"question":"猫为何必须重视牛磺酸？","options":["猫合成不足，缺牛磺酸致心肌病与视网膜变性","猫能自合成不需补","牛磺酸有毒","仅幼猫需要"],"answer":"猫合成不足，缺牛磺酸致心肌病与视网膜变性","explanation":"牛磺酸对猫为必需。","id":1468},{"theme":"feeding","tag":"猫营养特","type":"judge","difficulty":2,"question":"猫为专性肉食动物，对蛋白质与特定氨基酸(牛磺酸、精氨酸)需求高。","options":["正确","错误"],"answer":"正确","explanation":"猫是专性肉食动物。","id":1469},{"theme":"feeding","tag":"猫营养特","type":"single","difficulty":2,"question":"猫缺乏精氨酸可致？","options":["高氨血症、神经系统症状(危险)","毛发更亮","食欲增加","无影响"],"answer":"高氨血症、神经系统症状(危险)","explanation":"精氨酸参与尿素循环。","id":1470},{"theme":"feeding","tag":"狗营养特","type":"single","difficulty":2,"question":"关于犬粮粗蛋白，合理理解是？","options":["应满足最低需求且来源优质，并非越高越好","越高越贵就越好","蛋白越低越好","与肾无关"],"answer":"应满足最低需求且来源优质，并非越高越好","explanation":"关注质与量平衡。","id":1471},{"theme":"feeding","tag":"狗营养特","type":"judge","difficulty":2,"question":"部分大型犬对谷物敏感，但多数犬可耐受谷物，无谓无谷并非必需。","options":["正确","错误"],"answer":"正确","explanation":"谷物过敏在犬中并非最普遍。","id":1472},{"theme":"grooming","tag":"洗护流程","type":"single","difficulty":1,"question":"宠物洗澡前应先？","options":["梳通毛发、清理结块，再洗浴","直接冲水","先剪毛","先染色"],"answer":"梳通毛发、清理结块，再洗浴","explanation":"先梳通防打结。","id":1473},{"theme":"grooming","tag":"洗护流程","type":"single","difficulty":2,"question":"洗澡水温应？","options":["接近体温(约38℃)微温","越烫越杀菌","冰水提神","沸水"],"answer":"接近体温(约38℃)微温","explanation":"温水舒适不伤皮肤。","id":1474},{"theme":"grooming","tag":"洗护流程","type":"judge","difficulty":1,"question":"应避免洗澡水流入宠物耳内与眼内。","options":["正确","错误"],"answer":"正确","explanation":"防水入耳防外耳炎。","id":1475},{"theme":"grooming","tag":"洗护流程","type":"single","difficulty":2,"question":"犬常规洗澡频率一般？","options":["每4-6周或按需，过频伤皮脂","每天洗","一年一次","只在生病洗"],"answer":"每4-6周或按需，过频伤皮脂","explanation":"过频破坏皮肤屏障。","id":1476},{"theme":"grooming","tag":"洗护流程","type":"judge","difficulty":2,"question":"猫通常不需频繁洗澡，应激大，必要时可干洗或专业处理。","options":["正确","错误"],"answer":"正确","explanation":"猫自洁且怕水应激。","id":1477},{"theme":"grooming","tag":"洗护流程","type":"single","difficulty":2,"question":"洗澡后必须？","options":["彻底吹干(尤其双层毛底层)","自然晾干即可","吹半干","晒太阳不吹"],"answer":"彻底吹干(尤其双层毛底层)","explanation":"底层不干易皮肤病。","id":1478},{"theme":"grooming","tag":"吹干与造型","type":"single","difficulty":2,"question":"使用吹水机/烘干箱应注意？","options":["控温、防烫、避免直吹面部与长时间高温","越热越快好","锁箱不管","对着脸吹"],"answer":"控温、防烫、避免直吹面部与长时间高温","explanation":"防烫伤与应激。","id":1479},{"theme":"grooming","tag":"吹干与造型","type":"judge","difficulty":2,"question":"双层被毛犬(如哈士奇)一般不建议全身剃光，以免破坏保温与防晒。","options":["正确","错误"],"answer":"正确","explanation":"双层毛有调节功能。","id":1480},{"theme":"grooming","tag":"吹干与造型","type":"single","difficulty":2,"question":"严重打结毛发处理？","options":["先尝试开结，严重则局部修剪/剃除","硬扯","不管","染色遮"],"answer":"先尝试开结，严重则局部修剪/剃除","explanation":"避免疼痛与皮肤伤。","id":1481},{"theme":"grooming","tag":"皮肤被毛","type":"single","difficulty":2,"question":"发现宠物皮肤红肿、脱毛、频繁抓挠应？","options":["排查寄生虫/真菌/过敏并就医","自行乱用药","忽视","多洗澡"],"answer":"排查寄生虫/真菌/过敏并就医","explanation":"对症处理。","id":1482},{"theme":"grooming","tag":"皮肤被毛","type":"judge","difficulty":1,"question":"定期驱虫(体内外)有助于减少因寄生虫引起的皮肤瘙痒与问题。","options":["正确","错误"],"answer":"正确","explanation":"驱虫护皮肤。","id":1483},{"theme":"grooming","tag":"皮肤被毛","type":"single","difficulty":2,"question":"犬猫正常梳理频率应？","options":["按被毛类型定期梳，长毛每日、短毛每周","从不梳","只洗澡梳","一年一次"],"answer":"按被毛类型定期梳，长毛每日、短毛每周","explanation":"定期梳理去浮毛防结。","id":1484},{"theme":"grooming","tag":"五官护理","type":"single","difficulty":2,"question":"清理耳朵应？","options":["用宠物耳液+棉片擦外耳，不深捅","棉签深捅耳道","灌水冲洗","不清理"],"ans document.getElementById('totalN').textContent = QUESTIONS.length;

const LS_WRONG = "petexam_wrong_v3";
const LS_PROG  = "petexam_prog_v3";
const THEME_NAME = {feeding:"营养喂养",grooming:"美容护理",breeds:"品种鉴赏",operations:"店铺运营"};
const THEME_KEY  = {营养喂养:"feeding",美容护理:"grooming",品种鉴赏:"breeds",店铺运营:"operations"};

/* ---------- 存储 ---------- */
function loadWrong(){ try{return JSON.parse(localStorage.getItem(LS_WRONG))||{}}catch(e){return{}} }
function saveWrong(o){ localStorage.setItem(LS_WRONG, JSON.stringify(o)); }
function loadProg(){ try{return JSON.parse(localStorage.getItem(LS_PROG))||{}}catch(e){return{}} }
function saveProg(o){ localStorage.setItem(LS_PROG, JSON.stringify(o)); }
function markWrong(q){
  const w=loadWrong(); const e=w[q.id]||{count:0,first:Date.now(),last:0};
  e.count++; e.last=Date.now(); w[q.id]=e; saveWrong(w);
}
function removeWrong(id){ const w=loadWrong(); delete w[id]; saveWrong(w); }
function clearWrong(){ localStorage.removeItem(LS_WRONG); }
function markProg(tag, ok){
  const p=loadProg(); const e=p[tag]||{correct:0,total:0};
  e.total++; if(ok) e.correct++; p[tag]=e; saveProg(p);
}

/* ---------- 工具 ---------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function $(s,r){return (r||document).querySelector(s);}
function el(t,c,h){const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}
function diffTag(d){ return d===1?"易":d===2?"中":"难"; }
function isScenario(q){ return !Array.isArray(q.options); }

/* ---------- 全局状态 ---------- */
let state={mode:"learn", filter:{theme:"all",tag:"all",type:"all",diff:"all",q:""},
  learnOffset:0, quiz:null};

/* ---------- 渲染入口 ---------- */
function setMode(m){
  if(state.quiz&&state.quiz.tHandle) clearInterval(state.quiz.tHandle);
  state.mode=m; state.learnOffset=0;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.mode===m));
  renderControls(); renderApp();
}
document.querySelectorAll('.tab').forEach(t=> t.onclick=()=>setMode(t.dataset.mode));

function getTagsOf(theme){
  const pool = theme==="all"?QUESTIONS:QUESTIONS.filter(q=>q.theme===theme);
  return [...new Set(pool.map(q=>q.tag))];
}

/* ---------- 控件 ---------- */
function renderControls(){
  const c=$('#controls'); c.innerHTML="";
  if(state.mode==="learn"||state.mode==="practice"){
    const f=state.filter;
    // 主题
    const ctl1=el('div','ctl'); ctl1.appendChild(el('label',null,'主题'));
    const sel=el('select');
    sel.innerHTML='<option value="all">全部主题</option>'+
      Object.values(THEME_NAME).map(t=>`<option value="${t}">${t}</option>`).join('');
    sel.value = f.theme==="all"?"all":THEME_NAME[f.theme];
    sel.onchange=()=>{ f.theme = sel.value==="all"?"all":THEME_KEY[sel.value]; f.tag="all"; renderControls(); renderApp(); };
    ctl1.appendChild(sel); c.appendChild(ctl1);
    // 题型
    const ctl2=el('div','ctl'); ctl2.appendChild(el('label',null,'题型'));
    const ty=el('select');
    ty.innerHTML='<option value="all">全部</option><option value="single">单选</option><option value="judge">判断</option><option value="scenario">情景</option>';
    ty.value=f.type; ty.onchange=()=>{f.type=ty.value; renderControls(); renderApp();};
    ctl2.appendChild(ty); c.appendChild(ctl2);
    // 难度
    const ctl3=el('div','ctl'); ctl3.appendChild(el('label',null,'难度'));
    const df=el('select');
    df.innerHTML='<option value="all">全部</option><option value="1">易</option><option value="2">中</option><option value="3">难</option>';
    df.value=f.diff; df.onchange=()=>{f.diff=df.value; renderControls(); renderApp();};
    ctl3.appendChild(df); c.appendChild(ctl3);
    // 搜索
    const ctl4=el('div','ctl'); ctl4.style.flex="1"; ctl4.appendChild(el('label',null,'搜索'));
    const inp=el('input'); inp.type="text"; inp.placeholder="关键词（题面/解析）";
    inp.value=f.q; inp.oninput=()=>{ f.q=inp.value.trim(); state.learnOffset=0; renderApp(); };
    ctl4.appendChild(inp); c.appendChild(ctl4);

    if(state.mode==="practice"){
      const ctl5=el('div','ctl'); ctl5.appendChild(el('label',null,'本次题量'));
      const num=el('input'); num.type="number"; num.min="5"; num.value="20"; num.style.minWidth="72px";
      num.id="pnum"; ctl5.appendChild(num); c.appendChild(ctl5);
      const b=el('button','btn','开始练习'); b.onclick=startPractice; c.appendChild(b);
    }
    // 标签 chips
    const chips=el('div','chips');
    const all=el('button','chip'+(f.tag==="all"?" on":""),'全部知识点');
    all.onclick=()=>{f.tag="all"; renderControls(); renderApp();}; chips.appendChild(all);
    getTagsOf(f.theme).forEach(tg=>{
      const b=el('button','chip'+(f.tag===tg?" on":""),tg);
      b.onclick=()=>{f.tag=(f.tag===tg?"all":tg); renderControls(); renderApp();};
      chips.appendChild(b);
    });
    c.appendChild(chips);
  }
  else if(state.mode==="exam"){
    const ctl1=el('div','ctl'); ctl1.appendChild(el('label',null,'考核题量'));
    const sel=el('select'); sel.id="exnum";
    sel.innerHTML='<option value="20">20 题</option><option value="30" selected>30 题</option><option value="45">45 题</option><option value="50">50 题</option>';
    ctl1.appendChild(sel); c.appendChild(ctl1);
    const ctl2=el('div','ctl'); ctl2.appendChild(el('label',null,'计时'));
    const tm=el('select'); tm.id="extimer";
    tm.innerHTML='<option value="0">不限时</option><option value="20">20 分钟</option><option value="30" selected>30 分钟</option><option value="45">45 分钟</option>';
    ctl2.appendChild(tm); c.appendChild(ctl2);
    const b=el('button','btn','开始考核'); b.onclick=startExam; c.appendChild(b);
    const tip=el('div','tip',null);
    const wrongN=Object.keys(loadWrong()).length;
    tip.innerHTML=`考核含单选/判断（自动判分）与情景题（附参考答案）。错题自动收入错题本（当前 <b>${wrongN}</b> 题）。合格线 80%。`;
    c.appendChild(tip);
  }
  else if(state.mode==="wrong"){
    const w=loadWrong(); const ids=Object.keys(w);
    const ctl1=el('div','ctl'); ctl1.appendChild(el('label',null,'我的错题'));
    const b1=el('button','btn sm','重练错题'); b1.onclick=repracticeWrong; ctl1.appendChild(b1); c.appendChild(ctl1);
    const ctl2=el('div','ctl'); ctl2.appendChild(el('label',null,'管理'));
    const b2=el('button','btn sm ghost','清空错题本'); b2.onclick=()=>{ if(confirm('确定清空全部错题本？')){clearWrong(); renderControls(); renderApp();} };
    ctl2.appendChild(b2); c.appendChild(ctl2);
  }
}

/* ---------- 学习模式 ---------- */
function applyFilter(){
  const f=state.filter;
  let pool=QUESTIONS;
  if(f.theme!=="all") pool=pool.filter(q=>q.theme===f.theme);
  if(f.tag!=="all") pool=pool.filter(q=>q.tag===f.tag);
  if(f.type!=="all") pool=pool.filter(q=>q.type===f.type);
  if(f.diff!=="all") pool=pool.filter(q=>String(q.difficulty)===f.diff);
  if(f.q) pool=pool.filter(q=> (q.question+q.explanation).includes(f.q));
  return pool;
}
function renderApp(){
  const app=$('#app'); app.innerHTML="";
  if(state.mode==="learn") renderLearn(app);
  else if(state.mode==="practice") renderPracticeIntro(app);
  else if(state.mode==="exam") renderExamIntro(app);
  else if(state.mode==="wrong") renderWrong(app);
}
function learnCard(q){
  const card=el('div','card');
  const meta=el('div','meta');
  meta.appendChild(el('span','tag th',THEME_NAME[q.theme]||q.theme));
  meta.appendChild(el('span','tag',q.tag));
  meta.appendChild(el('span','tag df',diffTag(q.difficulty)));
  meta.appendChild(el('span','tag ty',q.type==="single"?"单选":q.type==="judge"?"判断":"情景"));
  card.appendChild(meta);
  card.appendChild(el('div','q',q.question));
  if(isScenario(q)){
    const btn=el('button','btn sm ghost','显示参考答案');
    const ans=el('div','ans',"<b>参考答案：</b>"+q.answer);
    btn.onclick=()=>{ ans.classList.toggle('show'); btn.textContent= ans.classList.contains('show')?'隐藏参考答案':'显示参考答案'; };
    card.appendChild(btn); card.appendChild(ans);
  }else{
    const wrap=el('div','opts');
    q.options.forEach(op=> wrap.appendChild(el('div','opt',op)));
    card.appendChild(wrap);
    const btn=el('button','btn sm ghost','显示答案与解析');
    const ans=el('div','ans',"<b>答案：</b>"+q.answer+"<br><b>解析：</b>"+q.explanation);
    btn.onclick=()=>{ ans.classList.toggle('show'); btn.textContent= ans.classList.contains('show')?'隐藏解析':'显示答案与解析'; };
    card.appendChild(btn); card.appendChild(ans);
  }
  return card;
}
function renderLearn(app){
  const pool=applyFilter();
  const tip=el('div','tip',`共 <b>${pool.length}</b> 题 · 点击「显示答案」可翻转学习`);
  app.appendChild(tip);
  if(pool.length===0){ app.appendChild(el('div','empty','没有符合条件的题目')); return; }
  const slice=pool.slice(state.learnOffset, state.learnOffset+30);
  slice.forEach(q=>app.appendChild(learnCard(q)));
  if(state.learnOffset+30 < pool.length){
    const more=el('button','btn ghost','加载更多（剩 '+(pool.length-state.learnOffset-30)+' 题）');
    more.style.margin="6px auto 14px"; more.style.display="block";
    more.onclick=()=>{ state.learnOffset+=30; renderApp(); };
    app.appendChild(more);
  }
}

/* ---------- 练习 / 考核 流程 ---------- */
function startPractice(){
  const base=applyFilter();
  if(base.length===0){ alert('当前筛选无题目'); return; }
  let n=parseInt($('#pnum').value)||20; n=Math.max(5,Math.min(n,base.length));
  state.quiz={list:shuffle(base).slice(0,n), idx:0, correct:0, scored:0, mode:"practice",
    wrongIds:[], answered:false, timer:0, tleft:0};
  renderQuiz();
}
function startExam(){
  const n=parseInt($('#exnum').value)||30;
  const timerMin=parseInt($('#extimer').value)||0;
  let base=QUESTIONS;
  // 考核按主题均衡抽样
  const byTheme={}; QUESTIONS.forEach(q=>{(byTheme[q.theme]=byTheme[q.theme]||[]).push(q);});
  let picked=[];
  const per=Math.floor(n/4);
  Object.values(byTheme).forEach(arr=>{ picked=picked.concat(shuffle(arr).slice(0,per)); });
  picked=shuffle(picked).slice(0,n);
  if(picked.length<n){ // 不足补
    const extra=shuffle(QUESTIONS).filter(q=>!picked.includes(q)).slice(0,n-picked.length);
    picked=picked.concat(extra);
  }
  state.quiz={list:picked, idx:0, correct:0, scored:0, mode:"exam",
    wrongIds:[], answered:false, timer:timerMin, tleft:timerMin*60, tHandle:null};
  if(timerMin>0) startTimer();
  renderQuiz();
}
function startTimer(){
  const q=state.quiz;
  q.tHandle=setInterval(()=>{
    q.tleft--; const t=$('#timer'); if(t){ const m=Math.floor(q.tleft/60), s=q.tleft%60;
      t.textContent=`⏱ ${m}:${s<10?'0':''}${s}`; if(q.tleft<=0){ clearInterval(q.tHandle); finishQuiz(); } }
  },1000);
}
function renderQuiz(){
  const app=$('#app'); app.innerHTML="";
  const q=state.quiz; const cur=q.list[q.idx];
  if(!cur){ finishQuiz(); return; }
  if(q.mode==="exam"&&q.timer>0){
    const bar=el('div','counter',null); bar.id="timer"; bar.style.textAlign="right";
    bar.textContent=`⏱ ${Math.floor(q.tleft/60)}:${q.tleft%60<10?'0':''}${q.tleft%60}`;
    app.appendChild(bar);
  }
  const prog=el('div','progress'); prog.innerHTML='<i style="width:'+(q.idx/q.list.length*100)+'%"></i>'; app.appendChild(prog);
  const ctr=el('div','counter',`第 ${q.idx+1} / ${q.list.length} 题 · 正确 ${q.correct}/${q.scored}`);
  ctr.style.marginBottom="6px"; app.appendChild(ctr);
  const card=el('div','card');
  const meta=el('div','meta');
  meta.appendChild(el('span','tag th',THEME_NAME[cur.theme]||cur.theme));
  meta.appendChild(el('span','tag',cur.tag));
  meta.appendChild(el('span','tag df',diffTag(cur.difficulty)));
  meta.appendChild(el('span','tag ty',cur.type==="single"?"单选":cur.type==="judge"?"判断":"情景"));
  card.appendChild(meta);
  card.appendChild(el('div','q',cur.question));
  if(isScenario(cur)){
    const ans=el('div','ans',"<b>参考答案：</b>"+cur.answer);
    const btn=el('button','btn sm ghost','显示参考答案');
    btn.onclick=()=>{ ans.classList.toggle('show'); btn.textContent=ans.classList.contains('show')?'隐藏参考答案':'显示参考答案'; };
    card.appendChild(btn); card.appendChild(ans);
    const row=el('div','row');
    const nx=el('button','btn','下一题 →');
    nx.onclick=()=>{ q.idx++; renderQuiz(); };
    row.appendChild(nx); card.appendChild(row);
  }else{
    const wrap=el('div','opts'); card.appendChild(wrap);
    const fb=el('div','feedback'); const ans=el('div','ans');
    card.appendChild(fb); card.appendChild(ans);
    const row=el('div','row');
    const submit=el('button','btn','提交');
    const nx=el('button','btn','下一题 →'); nx.style.display="none";
    submit.onclick=()=>{
      const sel=wrap.querySelector('.opt.sel');
      if(!sel){ alert('请先选择一个答案'); return; }
      const picked=sel.textContent;
      const ok = picked===cur.answer;
      q.scored++; if(ok) q.correct++; else { markWrong(cur); q.wrongIds.push(cur.id); }
      markProg(cur.tag, ok);
      wrap.querySelectorAll('.opt').forEach(o=>{
        o.onclick=null;
        if(o.textContent===cur.answer) o.classList.add('ok');
        else if(o===sel) o.classList.add('bad');
      });
      fb.className='feedback show '+(ok?'ok':'bad');
      fb.textContent = ok?'✓ 回答正确':'✗ 回答错误（正确答案：'+cur.answer+'）';
      ans.innerHTML="<b>解析：</b>"+cur.explanation; ans.classList.add('show');
      submit.style.display="none"; nx.style.display="inline-block";
    };
    nx.onclick=()=>{
      if(q.idx+1>=q.list.length){ finishQuiz(); return; }
      q.idx++; renderQuiz();
    };
    row.appendChild(submit); row.appendChild(nx); card.appendChild(row);
    cur.options.forEach(op=>{
      const b=el('button','opt',op);
      b.onclick=()=>{ if(submit.style.display==="none")return;
        wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); };
      wrap.appendChild(b);
    });
  }
  app.appendChild(card);
}
function finishQuiz(){
  const q=state.quiz; if(q&&q.tHandle) clearInterval(q.tHandle);
  const app=$('#app'); app.innerHTML="";
  const rep=el('div','card report');
  const total=q.list.length;
  const scoredQ=q.list.filter(x=>!isScenario(x)).length;
  const pct = scoredQ? Math.round(q.correct/scoredQ*100):0;
  const sc=el('h2',null, q.mode==="exam"?`📝 考核报告`:`✏️ 练习小结`);
  rep.appendChild(sc);
  const st=el('div','stat');
  st.innerHTML=`<div class="box"><b>${pct}%</b><span>选择题得分率</span></div>`+
    `<div class="box"><b>${q.correct}/${scoredQ}</b><span>答对 / 选择题</span></div>`+
    `<div class="box"><b>${q.list.length-scoredQ}</b><span>情景题(参考)</span></div>`;
  rep.appendChild(st);
  if(q.mode==="exam"){
    rep.appendChild(el('div','tip', pct>=80?'🎉 达到合格线（80%），专业能力优秀！':'⚠️ 未达合格线（80%），建议针对错题加强学习。'));
  }
  // 按主题正确率
  rep.appendChild(el('div','tip','<b>各主题正确率</b>'));
  const byT={};
  q.list.forEach(x=>{ if(isScenario(x))return; (byT[x.theme]=byT[x.theme]||{t:0,w:0}); byT[x.theme].t++; });
  q.wrongIds.forEach(id=>{ const qq=QUESTIONS.find(x=>x.id===id); if(qq&&byT[qq.theme]) byT[qq.theme].w++; });
  Object.keys(byT).forEach(th=>{
    const t=byT[th].t, c=t-byT[th].w; const p=t?Math.round(c/t*100):0;
    const b=el('div','bar');
    b.innerHTML=`<span class="lab">${THEME_NAME[th]||th}</span><span class="track"><i style="width:${p}%"></i></span><span class="v">${c}/${t}</span>`;
    rep.appendChild(b);
  });
  app.appendChild(rep);
  // 错题回顾
  if(q.wrongIds.length){
    const wt=el('div','tip','<b>本次错题（已收入错题本）</b>'); rep.appendChild(wt);
    q.wrongIds.forEach(id=>{
      const item=QUESTIONS.find(x=>x.id===id); if(!item)return;
      const c=el('div','card'); c.style.marginTop="8px"; c.style.padding="10px 12px";
      c.appendChild(el('div','q', (THEME_NAME[item.theme]||'')+' · '+item.tag+'：'+item.question));
      if(!isScenario(item)) c.appendChild(el('div','ans show','<b>正确答案：</b>'+item.answer+'<br><b>解析：</b>'+item.explanation));
      else c.appendChild(el('div','ans show','<b>参考答案：</b>'+item.answer));
      rep.appendChild(c);
    });
  }
  const row=el('div','row'); row.style.marginTop="12px";
  const again=el('button','btn','再来一次'); again.onclick=()=>{ if(q.mode==="exam")startExam(); else startPractice(); };
  const back=el('button','btn ghost','返回首页'); back.onclick=()=>setMode(q.mode==="exam"?"exam":"learn");
  row.appendChild(again); row.appendChild(back); rep.appendChild(row);
  app.appendChild(rep);
}
function renderPracticeIntro(app){
  app.appendChild(el('div','empty','点击上方「开始练习」开始（可在控件中选择主题/题型/难度/知识点与题量）。'));
}
function renderExamIntro(app){
  const wn=Object.keys(loadWrong()).length;
  app.appendChild(el('div','empty',`设置题量与计时后点击「开始考核」。考核覆盖四大主题、含情景题，合格线 80%。当前错题本 ${wn} 题。`));
}

/* ---------- 错题本 ---------- */
function repracticeWrong(){
  const w=loadWrong(); const ids=Object.keys(w).map(Number);
  if(ids.length===0){ alert('错题本为空'); return; }
  const list=ids.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);
  state.quiz={list:shuffle(list), idx:0, correct:0, scored:0, mode:"practice",
    wrongIds:[], answered:false, timer:0, tleft:0, fromWrong:true};
  renderQuiz();
}
function renderWrong(app){
  const w=loadWrong(); const ids=Object.keys(w).map(Number);
  if(ids.length===0){ app.appendChild(el('div','empty','错题本还是空的 🎉 做错的题会自动出现在这里。')); return; }
  // 统计
  const byTag={};
  ids.forEach(id=>{ const q=QUESTIONS.find(x=>x.id===id); if(q) byTag[q.tag]=(byTag[q.tag]||0)+1; });
  const st=el('div','stat');
  st.innerHTML=`<div class="box"><b>${ids.length}</b><span>错题总数</span></div>`+
    `<div class="box"><b>${Object.keys(byTag).length}</b><span>涉及知识点</span></div>`;
  app.appendChild(st);
  const tip=el('div','tip','点击「重练错题」可集中复习；点击单题「移除」表示已掌握。');
  app.appendChild(tip);
  // 列表（按知识点分组）
  const order=Object.keys(byTag).sort((a,b)=>byTag[b]-byTag[a]);
  order.forEach(tag=>{
    const group=el('div','tip',null); group.innerHTML='<b>'+tag+'</b> · '+byTag[tag]+' 题'; app.appendChild(group);
    ids.filter(id=>{const q=QUESTIONS.find(x=>x.id===id);return q&&q.tag===tag;}).forEach(id=>{
      const q=QUESTIONS.find(x=>x.id===id); if(!q)return;
      const c=el('div','card'); c.style.padding="10px 12px";
      const meta=el('div','meta');
      meta.appendChild(el('span','tag th',THEME_NAME[q.theme]||q.theme));
      meta.appendChild(el('span','tag df',diffTag(q.difficulty)));
      c.appendChild(meta);
      c.appendChild(el('div','q',q.question));
      const ans=el('div','ans');
      ans.innerHTML = isScenario(q)? '<b>参考答案：</b>'+q.answer : '<b>正确答案：</b>'+q.answer+'<br><b>解析：</b>'+q.explanation;
      const row=el('div','row');
      const show=el('button','btn sm ghost','显示答案');
      show.onclick=()=>{ ans.classList.toggle('show'); show.textContent=ans.classList.contains('show')?'隐藏':'显示答案'; };
      const rm=el('button','btn sm ghost','移除（已掌握）'); rm.onclick=()=>{ removeWrong(id); renderControls(); renderApp(); };
      const rec=el('span','counter','错 '+w[id].count+' 次');
      row.appendChild(show); row.appendChild(rm); row.appendChild(rec);
      c.appendChild(ans); c.appendChild(row);
      app.appendChild(c);
    });
  });
}

/* 启动 */
renderControls(); renderApp();
</script>
