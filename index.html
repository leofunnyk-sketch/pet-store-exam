<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>社区宠物店 · 专业知识练考系统</title>
<style>
:root{
  /* surfaces */
  --bg:#f6f4ef;          /* warm page background */
  --card:#ffffff;        /* card surface */
  --bg-soft:#faf8f3;     /* subtle alternate fill */
  --ink:#2b2722;         /* warm near-black heading */
  --text:#463f38;        /* body text */
  --muted:#8a8074;       /* secondary text */
  --faint:#b3a99c;       /* placeholder / caption */
  /* lines — Notion "whisper" borders */
  --line:#ece6db;
  --line-strong:#e0d8c9;
  /* accent — refined warm terracotta (pet-friendly) */
  --accent:#dd7a3c;
  --accent-d:#c4622c;
  --accent-soft:#fbeede;
  /* semantic */
  --ok:#2f9e6f;   --ok-soft:#e8f5ee;
  --bad:#d8504a;  --bad-soft:#fbeceb;
  --warn:#c98a1e; --warn-soft:#fbf1dd;
  /* spacing scale (8px base) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px;
  /* radii */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-pill:999px;
  /* shadows — Notion-style soft, multi-layer, low opacity */
  --sh-1:0 1px 2px rgba(60,45,25,.04);
  --sh-2:0 1px 3px rgba(60,45,25,.05), 0 6px 18px rgba(60,45,25,.06);
  --sh-3:0 2px 6px rgba(60,45,25,.06), 0 12px 30px rgba(60,45,25,.08);
  --shadow-s:var(--sh-2);
  --shadow:var(--sh-3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
    "Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1100px 460px at 85% -12%, #fff2e6 0%, transparent 60%),
    radial-gradient(820px 460px at -8% 0%, #eef4ef 0%, transparent 55%),
    var(--bg);
  line-height:1.65; font-size:16px; letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px; margin:0 auto; padding:var(--s7) var(--s4) 96px}

/* ---------- header ---------- */
header.top{text-align:center; padding:var(--s4) 0 var(--s2)}
header.top h1{font-size:24px; margin:0 0 var(--s2); font-weight:800; letter-spacing:-.02em; color:var(--ink)}
header.top .sub{color:var(--muted); font-size:13.5px; margin:0; letter-spacing:.01em}
header.top .stats{display:flex; gap:var(--s2); justify-content:center; margin-top:var(--s4); flex-wrap:wrap}
header.top .pill{background:var(--card); border:1px solid var(--line); border-radius:var(--r-pill);
  padding:6px 14px; font-size:12.5px; color:var(--muted); box-shadow:var(--sh-1)}
header.top .pill b{color:var(--accent-d); font-weight:800}

/* ---------- mode tabs (segmented control) ---------- */
.tabs{position:sticky; top:0; z-index:30; display:flex; gap:6px; background:rgba(246,244,239,.82);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  padding:8px; margin:var(--s5) calc(-1 * var(--s4)) var(--s3); border-radius:var(--r-lg);
  border:1px solid var(--line); box-shadow:var(--sh-1)}
.tabs .tab{flex:1; text-align:center; padding:12px 4px; border-radius:var(--r-md); cursor:pointer;
  font-size:14.5px; font-weight:600; color:var(--muted); transition:.18s; user-select:none}
.tabs .tab .em{font-size:17px; margin-right:3px}
.tabs .tab.on{background:var(--card); color:var(--accent-d); box-shadow:var(--sh-2); font-weight:700}
.tabs .tab:active{transform:scale(.975)}

/* ---------- 沉浸式做题栏 ---------- */
.sessionbar{position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:12px;
  background:rgba(246,244,239,.9); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  padding:11px 2px 13px; margin:0 0 var(--s3); border-bottom:1px solid var(--line)}
.sessionbar .sexit{border:none; background:transparent; color:var(--muted); font-size:14px;
  cursor:pointer; padding:6px 4px; font-weight:600; white-space:nowrap; transition:.15s}
.sessionbar .sexit:hover{color:var(--accent-d)}
.sessionbar .stitle{font-weight:700; font-size:14.5px; color:var(--ink); white-space:nowrap}
.sessionbar .sright{margin-left:auto; font-size:12.5px; color:var(--muted); white-space:nowrap}
.sessionbar .sprogress{position:absolute; left:0; right:0; bottom:-1px; height:4px; background:var(--line); overflow:hidden}
.sessionbar .sprogress > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),#f0a468); transition:width .35s ease}
/* 沉浸模式：隐藏一切干扰性导航 */
body.in-session header.top,
body.in-session .tabs,
body.in-session #controls,
body.in-session footer,
body.in-session #progress{display:none !important}
body.in-session .wrap{padding-top:var(--s4)}
body.in-session .card{margin-top:var(--s3); animation:none}

/* ---------- progress ---------- */
.progress{height:6px; background:var(--line); border-radius:var(--r-pill); overflow:hidden; margin:var(--s3) 0 var(--s2)}
.progress > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),#f0a468);
  border-radius:var(--r-pill); transition:width .35s ease}

/* ---------- controls — 紧凑筛选栏 ---------- */
.controls{margin:var(--s5) 0}
.controls .bar{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center}
.controls .bar + .bar{margin-top:var(--s3)}
.controls .bar-label{flex:0 0 auto; min-width:32px; font-size:11.5px; font-weight:700;
  color:var(--muted); letter-spacing:.06em; user-select:none; white-space:nowrap;
  padding-right:4px; opacity:.75}
.controls .chips{display:inline-flex; gap:6px; flex-wrap:wrap; align-items:center}
.chip{font-size:12.5px; padding:7px 14px; border-radius:var(--r-pill); cursor:pointer; user-select:none;
  background:var(--bg-soft); border:1px solid var(--line); color:var(--text); transition:.15s; white-space:nowrap}
.chip.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; box-shadow:0 2px 8px rgba(221,122,60,.25)}
.chip:hover{border-color:var(--accent); color:var(--accent-d)}
.controls input[type=number]{width:64px; padding:8px 10px; border:1px solid var(--line); border-radius:var(--r-sm);
  font-size:13.5px; text-align:center; background:var(--card); color:var(--ink)}
.controls input[type=search]{flex:1; min-width:180px; padding:10px 14px; border:1px solid var(--line);
  border-radius:var(--r-md); font-size:13.5px; background:var(--card); color:var(--ink)}
.controls input[type=search]:focus,.controls input[type=number]:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer;
  border:none; border-radius:var(--r-md); padding:12px 20px; font-size:14.5px; font-weight:700;
  background:var(--accent); color:#fff; box-shadow:0 4px 14px rgba(221,122,60,.26); transition:.16s; letter-spacing:.01em}
.btn:hover{background:var(--accent-d)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--bg-soft); color:var(--ink); border:1px solid var(--line); box-shadow:none}
.btn.ghost:hover{border-color:var(--accent); color:var(--accent-d); background:#fff}
.btn:disabled{opacity:.5; cursor:not-allowed}

/* ---------- question card ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-xl);
  padding:var(--s5) var(--s6); margin:var(--s5) 0; box-shadow:var(--sh-3); animation:rise .35s ease both}
@keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.qmeta{display:flex; gap:var(--s2); flex-wrap:wrap; margin-bottom:var(--s3)}
.tag{font-size:11.5px; padding:4px 10px; border-radius:var(--r-pill); background:var(--accent-soft);
  color:var(--accent-d); font-weight:600}
.tag.t{background:#e9f1ec; color:#3a7d5d}
.tag.d{background:#fbf1dd; color:#b9821f}
.tag.s-dog{background:#e8eefb; color:#3a6fb0}
.tag.s-cat{background:#f1e8fb; color:#8a4fb0}
.q{font-size:19px; font-weight:700; line-height:1.6; margin:0 0 var(--s4); letter-spacing:.005em; color:var(--ink)}
.q .num{display:inline-block; min-width:26px; color:var(--accent-d); margin-right:4px}
.opts{display:flex; flex-direction:column; gap:var(--s3)}
.opt{display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border:1.5px solid var(--line);
  border-radius:var(--r-md); cursor:pointer; transition:.15s; background:var(--bg-soft); font-size:15px; user-select:none; color:var(--ink)}
.opt:hover{border-color:var(--accent); background:#fff}
.opt .lt{flex:0 0 26px; height:26px; border-radius:8px; background:#fff; border:1px solid var(--line); color:var(--muted);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; transition:.15s}
.opt.sel{border-color:var(--accent); background:var(--accent-soft)}
.opt.sel .lt{background:var(--accent); color:#fff; border-color:var(--accent)}
.opt.ok{border-color:var(--ok); background:var(--ok-soft)}
.opt.ok .lt{background:var(--ok); color:#fff; border-color:var(--ok)}
.opt.bad{border-color:var(--bad); background:var(--bad-soft)}
.opt.bad .lt{background:var(--bad); color:#fff; border-color:var(--bad)}
.opt.dim{opacity:.5}
.feedback{margin-top:var(--s4); padding:16px 18px; border-radius:var(--r-md); background:var(--bg-soft);
  border:1px solid var(--line); display:none; animation:rise .3s ease both}
.feedback.show{display:block}
.feedback .verdict{font-weight:700; font-size:15px; margin-bottom:6px}
.feedback.ok .verdict{color:var(--ok)}
.feedback.bad .verdict{color:var(--bad)}
.feedback .exp{font-size:14px; color:var(--text); line-height:1.6}
.feedback .exp b{color:var(--accent-d)}
.card .nav{display:flex; justify-content:space-between; align-items:center; margin-top:var(--s5); gap:var(--s3)}

/* ---------- study cards ---------- */
.knav{display:flex; gap:var(--s3); flex-wrap:wrap; justify-content:center; margin:var(--s2) 0}
.kcard{background:var(--card); border:1px solid var(--line); border-radius:var(--r-xl);
  padding:var(--s5) var(--s6); margin:var(--s4) 0; box-shadow:var(--sh-3); animation:rise .3s ease both}
.kcard .q{font-size:17px; font-weight:700; margin:var(--s2) 0 var(--s3); color:var(--ink)}
.kcard .ans{font-size:14px; color:var(--text); background:var(--bg-soft); border-radius:var(--r-md); padding:14px 16px;
  border:1px solid var(--line); margin-top:4px; line-height:1.6}
.kcard .more{margin-top:var(--s3); font-size:12.5px; color:var(--muted)}
.loadmore{text-align:center; margin:var(--s3) 0 0}

/* ---------- report ---------- */
.report .ring{display:flex; flex-direction:column; align-items:center; padding:var(--s3) 0 var(--s2)}
.report h2{text-align:center; font-size:20px; margin:var(--s2) 0 var(--s1); color:var(--ink); font-weight:700}
.report .score{font-size:46px; font-weight:800; color:var(--accent-d); line-height:1; letter-spacing:-.02em}
.report .verdict{font-size:14px; color:var(--muted); margin-bottom:var(--s2)}
.stat{display:flex; gap:var(--s3); justify-content:center; flex-wrap:wrap; margin:var(--s4) 0 var(--s5)}
.stat .box{flex:1; min-width:96px; background:var(--bg-soft); border:1px solid var(--line); border-radius:var(--r-md);
  padding:14px; text-align:center}
.stat .box b{display:block; font-size:22px; font-weight:800; color:var(--ink); line-height:1.1}
.stat .box span{font-size:12px; color:var(--muted)}
.bar{display:flex; align-items:center; gap:var(--s3); margin:var(--s3) 0; font-size:13.5px}
.bar .lab{width:84px; color:var(--muted); flex:0 0 auto}
.bar .track{flex:1; height:9px; background:var(--line); border-radius:var(--r-pill); overflow:hidden}
.bar .track i{display:block; height:100%; background:linear-gradient(90deg,var(--ok),#67c79a); border-radius:var(--r-pill)}
.bar .v{width:64px; text-align:right; color:var(--ink); font-weight:700; flex:0 0 auto}
.sectin{font-weight:700; margin:var(--s5) 0 var(--s3); font-size:15px; color:var(--ink)}
.tip{color:var(--muted); font-size:12.5px; text-align:center; margin:var(--s2) 0}

/* ---------- wrong items ---------- */
.witem{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:var(--s4) var(--s5);
  margin:var(--s4) 0; box-shadow:var(--sh-2); animation:rise .3s ease both}
.witem .q{font-size:15px; font-weight:700; margin:var(--s1) 0 var(--s3); cursor:pointer; color:var(--ink)}
.witem .det{display:none; font-size:13.5px; color:var(--text); border-top:1px dashed var(--line); padding-top:var(--s3); margin-top:var(--s2); line-height:1.6}
.witem .det.show{display:block}
.witem .det .your{color:var(--bad); font-weight:700}
.witem .det .right{color:var(--ok); font-weight:700}
.witem .acts{display:flex; gap:var(--s2); margin-top:var(--s3)}
.empty{text-align:center; color:var(--muted); padding:48px 0; font-size:14px}
footer{text-align:center; color:var(--muted); font-size:12px; padding:var(--s6) 0 0}

/* ===== 移动端全面优化（间距体系与桌面一致，仅缩放） ===== */
@media (max-width:560px){
  body{font-size:14.5px; line-height:1.6}
  .wrap{padding:var(--s5) 14px 80px}
  header.top{padding:var(--s3) 0 var(--s1)}
  header.top h1{font-size:19px; margin-bottom:6px}
  header.top .sub{font-size:11.5px}
  header.top .stats{gap:6px; margin-top:var(--s3)}
  header.top .pill{padding:5px 10px; font-size:11px}
  .tabs{padding:6px; margin:var(--s4) -14px var(--s2); gap:4px; border-radius:var(--r-md)}
  .tabs .tab{font-size:12.5px; padding:10px 2px; border-radius:10px}
  .tabs .tab .em{font-size:14px}
  .sessionbar{padding:9px 2px 11px; gap:8px}
  .sessionbar .stitle{font-size:13px}
  .sessionbar .sright{font-size:11px}
  .sessionbar .sexit{font-size:12.5px; padding:5px 2px}
  .controls{margin:var(--s4) 0}
  .controls .bar{gap:6px 9px}
  .controls .bar + .bar{margin-top:var(--s2)}
  .controls .bar-label{min-width:28px; font-size:10.5px; padding-right:2px}
  .controls .chips{gap:5px}
  .chip{font-size:11.5px; padding:6px 11px}
  .chip.on{box-shadow:0 2px 6px rgba(221,122,60,.2)}
  .controls input[type=search]{padding:9px 11px; font-size:12.5px; min-width:140px}
  .controls input[type=number]{width:56px; padding:7px 8px; font-size:12.5px}
  .btn{padding:11px 16px; font-size:13px; border-radius:10px}
  .card{padding:var(--s4) var(--s4); margin:var(--s4) 0; border-radius:var(--r-lg)}
  .q{font-size:16px; margin:0 0 var(--s3)}
  .opt{padding:12px 13px; font-size:14px; gap:10px; border-radius:10px}
  .opt .lt{flex:0 0 23px; height:23px; font-size:12px; border-radius:7px}
  .feedback{padding:13px 14px; margin-top:var(--s3)}
  .card .nav{margin-top:var(--s4)}
  .kcard{padding:var(--s4); margin:var(--s3) 0; border-radius:var(--r-lg)}
  .kcard .q{font-size:15px}
  .kcard .ans{padding:12px 13px; font-size:13px}
  .report .score{font-size:38px}
  .stat{gap:var(--s2)}
  .stat .box{min-width:72px; padding:11px}
  .stat .box b{font-size:18px}
  .bar{font-size:12px; gap:var(--s2)}
  .bar .lab{width:68px}
  .witem{padding:var(--s3) var(--s4); margin:var(--s3) 0; border-radius:var(--r-md)}
  .witem .q{font-size:14px}
  .progress{margin:var(--s2) 0 var(--s1); height:5px}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="sessionbar" id="sessionbar" style="display:none">
    <button class="sexit" id="sexit" type="button">‹ 退出</button>
    <div class="stitle" id="stitle">练习</div>
    <div class="sright" id="sright"></div>
    <div class="sprogress"><i></i></div>
  </section>
  <header class="top">
    <h1>🐾 社区宠物店 · 专业知识练考系统</h1>
    <p class="sub">学 · 练 · 考 · 错题 —— 一站式掌握犬猫护理与门店经营</p>
    <div class="stats">
      <span class="pill">题库 <b id="totalN">0</b> 题</span>
      <span class="pill">狗 <b id="dogN">0</b> / 猫 <b id="catN">0</b></span>
      <span class="pill">单选 <b id="sN">0</b> · 判断 <b id="jN">0</b> · 情景 <b id="cN">0</b></span>
    </div>
  </header>

  <div class="tabs" id="tabs">
    <div class="tab on" data-mode="learn"><span class="em">📚</span>学习</div>
    <div class="tab" data-mode="practice"><span class="em">✏️</span>练习</div>
    <div class="tab" data-mode="exam"><span class="em">📝</span>考核</div>
    <div class="tab" data-mode="wrong"><span class="em">📕</span>错题本</div>
  </div>

  <div class="progress" id="progress" style="display:none"><i></i></div>
  <div id="controls" class="controls"></div>
  <div id="app"></div>
  <footer>数据本地保存于本机浏览器 · 无联网亦可练习</footer>
</div>

<script>

喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "single", "difficulty": 1, "question": "狗狗的饮水应该多久换一次？", "options": ["每天", "每两天", "每周", "喝完再加"], "answer": "每天", "explanation": "每天至少换一次，保持新鲜清洁", "id": 213, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "judge", "difficulty": 1, "question": "狗狗胖乎乎的说明养得好，不用减肥。", "options": ["正确", "错误"], "answer": "错误", "explanation": "肥胖会导致关节问题、心脏负担、糖尿病等，必须控制体重", "id": 214, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "single", "difficulty": 1, "question": "狗狗喂食后多久可以剧烈运动？", "options": ["1小时后", "2小时后", "30分钟后", "立即"], "answer": "1小时后", "explanation": "饭后立即剧烈运动容易导致胃扭转，尤其大型犬", "id": 215, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "judge", "difficulty": 1, "question": "狗狗吃骨头可以补钙。", "options": ["正确", "错误"], "answer": "错误", "explanation": "煮熟的骨头容易碎裂划伤肠胃，且钙吸收率低。不建议喂骨头", "id": 216, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "single", "difficulty": 1, "question": "狗狗吃了洋葱后可能出现的症状是？", "options": ["溶血性贫血", "发胖", "掉毛", "兴奋"], "answer": "溶血性贫血", "explanation": "洋葱含硫化物，会破坏红细胞导致溶血性贫血", "id": 217, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "judge", "difficulty": 1, "question": "狗狗可以吃猫粮，反正都是宠物粮。", "options": ["正确", "错误"], "answer": "错误", "explanation": "猫粮蛋白质含量更高，长期吃会导致狗狗肥胖和营养失衡", "id": 218, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "judge", "difficulty": 1, "question": "猫可以像狗一样长期吃素粮维持健康。", "options": ["正确", "错误"], "answer": "错误", "explanation": "猫是专性肉食动物，长期素食会导致牛磺酸缺乏等严重问题", "id": 219, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "single", "difficulty": 1, "question": "关于猫粮形态，以下说法正确的是？", "options": ["干粮补水最好", "湿粮（罐头）有助于补充水分", "湿粮没有营养", "猫只吃干粮最健康"], "answer": "湿粮（罐头）有助于补充水分", "explanation": "室内猫易缺水，湿粮能补充大量水分，有益泌尿健康", "id": 220, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "judge", "difficulty": 1, "question": "零食罐头可以完全替代主食长期喂养。", "options": ["正确", "错误"], "answer": "错误", "explanation": "零食罐头营养不全价，长期当主食会导致营养不良", "id": 221, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "single", "difficulty": 1, "question": "幼猫（2-4月龄）每日建议喂几餐？", "options": ["1餐", "2餐", "3-4餐（少食多餐）", "自由采食不停"], "answer": "3-4餐（少食多餐）", "explanation": "幼猫胃容量小，需少食多餐", "id": 222, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "single", "difficulty": 1, "question": "成年猫（1-7岁）一般每日喂几餐较合适？", "options": ["1餐", "2餐", "4餐", "6餐"], "answer": "2餐", "explanation": "成猫定时2餐即可，也可自由采食控制总量", "id": 223, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "judge", "difficulty": 1, "question": "幼猫断奶后可以直接吃成猫粮。", "options": ["正确", "错误"], "answer": "错误", "explanation": "幼猫需吃幼猫粮（高蛋白高热量），直接吃成猫粮营养不够", "id": 224, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "single", "difficulty": 1, "question": "给猫换粮推荐的方法是？", "options": ["逐步减少旧粮不看比例", "直接全换", "7日过渡法", "混合一周就行"], "answer": "7日过渡法", "explanation": "新旧粮按比例在7天内逐步替换，减少肠胃应激", "id": 225, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "judge", "difficulty": 1, "question": "猫换粮可以直接全换，猫肠胃比狗强。", "options": ["正确", "错误"], "answer": "错误", "explanation": "突然换粮会引起软便呕吐，猫同样需要7日过渡", "id": 226, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "single", "difficulty": 1, "question": "猫零食每日占比建议不超过总食量的？", "options": ["5%", "10%", "25%", "50%"], "answer": "10%", "explanation": "零食不超过10%，防止挑食和肥胖", "id": 227, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "judge", "difficulty": 1, "question": "猫条可以当主食天天大量喂。", "options": ["正确", "错误"], "answer": "错误", "explanation": "猫条是高适口性零食，不能替代主粮，过量致挑食缺营养", "id": 228, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "judge", "difficulty": 1, "question": "猫的水盆应每天换水、保持清洁。", "options": ["正确", "错误"], "answer": "正确", "explanation": "每日换水减少细菌滋生，诱导饮水", "id": 229, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "judge", "difficulty": 1, "question": "猫草能帮助猫催吐毛球、补充少量纤维。", "options": ["正确", "错误"], "answer": "正确", "explanation": "猫草促吐毛球并补纤维", "id": 230, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "judge", "difficulty": 1, "question": "生骨肉（BARF）喂养需严格冷冻杀菌并注意钙磷比，不能随便喂生肉。", "options": ["正确", "错误"], "answer": "正确", "explanation": "生肉可能带菌/寄生虫，且需平衡钙磷，否则致营养失衡", "id": 231, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "judge", "difficulty": 1, "question": "多数狗有不同程度的乳糖不耐受，喝牛奶易腹泻。", "options": ["正确", "错误"], "answer": "正确", "explanation": "成年狗乳糖酶下降，喝牛奶常腹泻，可用宠物奶", "id": 232, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户刚买了一袋新狗粮，想今天就给狗狗全换上，你会怎么建议？", "options": null, "answer": "建议用7日换粮法：第1-2天新粮25%+旧粮75%，第3-4天各50%，第5-7天新粮75%+旧粮25%，一周后全换。突然全换容易导致肠胃应激、软便呕吐", "explanation": "7日换粮法步骤", "id": 233, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户说换粮后狗狗软便3天了，应该怎么办？", "options": null, "answer": "先暂停换粮，换回原粮观察2天。如果恢复正常，说明新粮不适合或换粮太快。之后用更慢的速度重新过渡（延长到10-14天）", "explanation": "换粮不适的处理", "id": 234, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "single", "difficulty": 2, "question": "换粮期间狗狗出现呕吐，应该怎么做？", "options": ["加大量喂", "喂止吐药", "继续喂新粮", "立即停止换粮"], "answer": "立即停止换粮", "explanation": "呕吐说明肠胃严重不适，立即停止换粮换回原粮", "id": 235, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户说狗狗刚才偷吃了一颗葡萄，应该怎么办？", "options": null, "answer": "立即联系宠物医院。葡萄对狗狗有急性肾毒性，即使一颗也可能中毒。观察是否呕吐/腹泻/精神萎靡，尽快就医", "explanation": "葡萄中毒的应急处理", "id": 236, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户问\"能不能给狗狗喂人吃的饭菜\"，你怎么回答？", "options": null, "answer": "不建议。人类饭菜重油重盐，狗狗肾脏代谢能力远不如人类，长期吃会导致泪痕加重、毛发干枯、慢性肾病。可以偶尔给无盐无油蒸熟的鸡胸肉或蔬菜", "explanation": "人类食物对狗狗的危害", "id": 237, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "single", "difficulty": 2, "question": "狗粮中钙磷比最佳比例约是多少？", "options": ["1:1", "1.2:1", "2:1", "0.8:1"], "answer": "1.2:1", "explanation": "钙磷比1.2:1对骨骼发育最关键", "id": 238, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户让你推荐一款狗粮，你会怎么帮他选？", "options": null, "answer": "1.看配料表前三位必须是肉；2.查营养成分（粗蛋白≥26%）；3.选适合年龄段的（幼犬/成犬/老年）；4.观察狗狗吃后的反应（便便成型/毛发光亮/无泪痕）；5.不盲目追贵价粮", "explanation": "狗粮选择方法", "id": 239, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "single", "difficulty": 2, "question": "肠胃敏感的狗狗，建议选择什么工艺的狗粮？", "options": ["风干", "冻干", "高温膨化", "酶解/低温烘焙"], "answer": "酶解/低温烘焙", "explanation": "酶解和低温烘焙工艺更好吸收，适合肠胃敏感犬", "id": 240, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "grooming", "tag": "洗护流程", "species": "dog", "type": "single", "difficulty": 2, "question": "城市家养犬洗澡频率建议是？", "options": ["一般2-4周一次，过频破坏皮脂", "每天洗", "半年洗一次", "从不洗"], "answer": "一般2-4周一次，过频破坏皮脂", "explanation": "过频致皮肤干燥瘙痒，依品种、活动与环境调整。", "id": 241}, {"theme": "grooming", "tag": "洗护流程", "species": "cat", "type": "single", "difficulty": 2, "question": "健康家猫通常？", "options": ["自我清洁强，无需频繁洗澡，应激风险高", "每周必须洗", "每天洗", "从不上厕所"], "answer": "自我清洁强，无需频繁洗澡，应激风险高", "explanation": "健康猫自洁能力强；必要时仅短暂洗护并彻底吹干。", "id": 242}, {"theme": "grooming", "tag": "洗护流程", "species": "both", "type": "single", "difficulty": 2, "question": "宠物洗澡后必须？", "options": ["彻底吹干（尤其底层绒毛）防潮疹与感冒", "自然晾干", "不吹", "只擦干表面"], "answer": "彻底吹干（尤其底层绒毛）防潮疹与感冒", "explanation": "底层毛不干易湿疹、真菌感染，老年与幼宠尤甚。", "id": 243}, {"theme": "grooming", "tag": "五官护理", "species": "dog", "type": "single", "difficulty": 2, "question": "垂耳犬（可卡、金毛等）耳道护理应？", "options": ["定期清洁、保持干燥防外耳炎", "从不清理", "灌水冲洗", "只剃耳毛"], "answer": "定期清洁、保持干燥防外耳炎", "explanation": "垂耳通风差易滋生耳螨/皮炎，用宠物洗耳液定期护理。", "id": 244}, {"theme": "grooming", "tag": "特殊犬猫美容", "species": "both", "type": "single", "difficulty": 2, "question": "短鼻犬（法斗、巴哥）面部褶皱应？", "options": ["每日清洁擦干防皮炎与异味", "不需处理", "涂油保湿", "只在洗澡时管"], "answer": "每日清洁擦干防皮炎与异味", "explanation": "褶皱潮湿易继发细菌感染，保持干爽是关键。", "id": 245}, {"theme": "grooming", "tag": "洗护流程", "species": "both", "type": "single", "difficulty": 1, "question": "宠物店洗护服务的定价通常参考？", "options": ["体型、毛长、脏污程度及是否去浮毛/造型", "仅看品种名", "仅看店主心情", "全国统一价"], "answer": "体型、毛长、脏污程度及是否去浮毛/造型", "explanation": "透明按项目收费、提前沟通，可显著降低纠纷。", "id": 246}, {"theme": "grooming", "tag": "特殊犬猫美容", "species": "cat", "type": "single", "difficulty": 2, "question": "猫洗澡应激的缓解措施包括？", "options": ["费洛蒙、安静环境、快速操作、轻柔保定", "大声呵斥", "强行按压", "不准备直接洗"], "answer": "费洛蒙、安静环境、快速操作、轻柔保定", "explanation": "猫应激可诱发尿闭、拒食，洗护前务必评估状态。", "id": 247}, {"theme": "grooming", "tag": "皮肤被毛", "species": "both", "type": "single", "difficulty": 2, "question": "春秋换毛季的建议是？", "options": ["每日梳毛去浮毛、补充营养、清洁环境", "不梳", "全部剃光", "只洗澡"], "answer": "每日梳毛去浮毛、补充营养、清洁环境", "explanation": "梳毛减少毛球症与家居落毛，促进皮肤血运。", "id": 248}, {"theme": "grooming", "tag": "工具与安全", "species": "both", "type": "single", "difficulty": 2, "question": "趾甲过长的后果是？", "options": ["易劈裂、嵌甲、影响步态", "无影响", "更稳当", "防摔倒"], "answer": "易劈裂、嵌甲、影响步态", "explanation": "注意避开血线，少量多次打磨更安全。", "id": 249}, {"theme": "grooming", "tag": "特殊犬猫美容", "species": "both", "type": "single", "difficulty": 2, "question": "关于宠物剃毛“清凉造型”，正确的是？", "options": ["避免剃伤与晒伤，双层毛犬不宜全剃", "越短越凉快", "全剃无害", "随便剃"], "answer": "避免剃伤与晒伤，双层毛犬不宜全剃", "explanation": "双层被毛有隔热防晒作用，全剃反易晒伤与蚊虫叮咬。", "id": 250}, {"theme": "grooming", "tag": "洗护流程", "species": "both", "type": "scenario", "difficulty": 2, "question": "一只首次到店的法斗洗澡时剧烈挣扎、舌头发紫，你作为美容师应如何处理？", "options": [], "answer": "立即暂停、移至通风阴凉处，松开束缚、安抚并观察呼吸与舌色；法斗为短鼻犬散热差、易应激与中暑，严禁强行续做。若呼吸不缓解立即吸氧并建议送医。事后向宠主说明短鼻犬洗护风险，建议缩短时长、预约非高温时段。", "explanation": "考查短鼻犬应激/中暑识别与处置；要点：立即停止、通风降温、必要时送医、风险告知。", "id": 251}, {"theme": "grooming", "type": "scenario", "tag": "安全与应急", "species": "dog", "difficulty": 3, "question": "客户带来一只脸部肿胀、呼吸急促、一直用爪子挠脸的狗，说刚在店外被蜜蜂蛰了，你如何处理与转诊？", "answer": "疑似蜂蛰过敏(可迅速发展成过敏休克)：①检查伤口，若毒刺可见用卡片刮除(勿挤)；②面部肿胀+呼吸急促属危重，立即联系医院准备抗过敏/肾上腺素，不要自行观察等待；③保持犬安静、侧卧防误吸，记录症状时间线；④途中持续观察呼吸，到院交接。店内需常备宠物急救联系卡与应急预案。", "explanation": "蜂蛰过敏的紧急处置与转诊", "id": 252, "options": null}, {"theme": "grooming", "tag": "洗护流程", "type": "single", "difficulty": 1, "question": "按宠物洗护操作规范，洗澡前的基础护理「前四步」通常指？", "options": ["只洗澡", "刷理→五官清洁→耳清洁→趾甲修剪", "直接吹", "先造型"], "answer": "刷理→五官清洁→耳清洁→趾甲修剪", "explanation": "基础护理含刷理、五官、耳、趾甲，再进入洗护", "id": 253, "species": "dog"}, {"theme": "grooming", "tag": "洗护流程", "type": "single", "difficulty": 1, "question": "宠物洗澡顺序一般建议？", "options": ["先洗身体再洗头脸（避免呛水/应激）", "干洗", "只洗脚", "先冲头"], "answer": "先洗身体再洗头脸（避免呛水/应激）", "explanation": "先身后世，减少呛水与紧张", "id": 254, "species": "dog"}, {"theme": "grooming", "tag": "洗护流程", "type": "judge", "difficulty": 1, "question": "洗澡前应先梳通打结，湿水后结会更紧。", "options": ["正确", "错误"], "answer": "正确", "explanation": "先梳再洗", "id": 255, "species": "dog"}, {"theme": "grooming", "tag": "洗护流程", "type": "judge", "difficulty": 1, "question": "眼睛、耳朵进水可能引起不适或中耳炎，洗护需防护。", "options": ["正确", "错误"], "answer": "正确", "explanation": "棉球护耳、避水入眼", "id": 256, "species": "dog"}, {"theme": "grooming", "tag": "洗护流程", "type": "single", "difficulty": 1, "question": "洗澡前基础护理「前四步」不含？", "options": ["耳清洁与趾甲", "五官清洁", "直接造型", "刷理"], "answer": "直接造型", "explanation": "先基础护理再洗护", "id": 257, "species": "cat"}, {"theme": "grooming", "tag": "洗护流程", "type": "judge", "difficulty": 1, "question": "洗澡时棉球轻塞外耳道可防进水引发中耳炎。", "options": ["正确", "错误"], "answer": "正确", "explanation": "护耳防进水", "id": 258, "species": "cat"}, {"theme": "grooming", "tag": "洗护流程", "type": "single", "difficulty": 1, "question": "宠物洗澡前应先？", "options": ["梳通毛发、清理结块，再洗浴", "直接冲水", "先剪毛", "先染色"], "answer": "梳通毛发、清理结块，再洗浴", "explanation": "先梳通防打结。", "id": 259, "species": "cat"}, {"theme": "grooming", "tag": "洗护流程", "type": "judge", "difficulty": 1, "question": "应避免洗澡水流入宠物耳内与眼内。", "options": ["正确", "错误"], "answer": "正确", "explanation": "防水入耳防外耳炎。", "id": 260, "species": "cat"}, {"theme": "grooming", "tag": "洗护流程", "type": "single", "difficulty": 2, "question": "洗澡水温应控制在？", "options": ["烫手", "沸点", "与体温接近的温热(约38–39℃)", "冰冷"], "answer": "与体温接近的温热(约38–39℃)", "explanation": "接近体温最安全舒适", "id": 261, "species": "dog"}, {"theme": "grooming", "ta , "answer": "重点管理区一户限养一只", "explanation": "重点管理区普遍实行一户一犬，鼓励依法、文明、限养。", "id": 637}, {"theme": "operations", "tag": "法规与合规", "species": "both", "type": "single", "difficulty": 2, "question": "《动物防疫法》要求饲养犬只应定期接种哪种疫苗？", "options": ["狂犬病疫苗", "流感疫苗", "新冠疫苗", "口蹄疫疫苗"], "answer": "狂犬病疫苗", "explanation": "法律要求犬只接种狂犬疫苗，猫也强烈建议接种；免疫后领取免疫证明。", "id": 638}, {"theme": "operations", "tag": "安全与应急", "species": "both", "type": "single", "difficulty": 2, "question": "关于狂犬病，下列正确的是？", "options": ["致死率近100%，一旦发病几乎无有效治疗手段", "仅狗会传播", "猫不会感染", "可自愈"], "answer": "致死率近100%，一旦发病几乎无有效治疗手段", "explanation": "狂犬病由狂犬病毒引起，病死率几乎100%；狗猫均可感染，暴露后及时处理可预防。", "id": 639}, {"theme": "operations", "tag": "安全与应急", "species": "both", "type": "single", "difficulty": 2, "question": "我国对犬只狂犬疫苗免疫的政策通常是？", "options": ["政府组织实施，多数地区免费或低价强制免疫", "完全自费且纯自愿", "仅宠物店要求", "不需要接种"], "answer": "政府组织实施，多数地区免费或低价强制免疫", "explanation": "农业农村部要求犬只免疫狂犬病，各地设免疫点，农村普遍免费，城市多为政府购买服务。", "id": 640}, {"theme": "operations", "tag": "安全与应急", "species": "dog", "type": "single", "difficulty": 1, "question": "幼犬首次接种狂犬病疫苗的建议时间是？", "options": ["满3月龄", "出生当天", "1月龄", "1岁"], "answer": "满3月龄", "explanation": "幼犬满3月龄首免狂犬疫苗，之后每年加强；免疫后领取免疫证明。", "id": 641}, {"theme": "operations", "tag": "安全与应急", "species": "both", "type": "single", "difficulty": 2, "question": "被疑似狂犬病动物咬伤后，第一步应做的是？", "options": ["立即用肥皂水+流动水冲洗伤口15分钟以上并尽快就医", "直接包扎伤口", "涂抹牙膏", "仅观察动物"], "answer": "立即用肥皂水+流动水冲洗伤口15分钟以上并尽快就医", "explanation": "暴露后尽快（尽量2小时内）冲洗消毒，并接种人用狂犬疫苗/免疫球蛋白，按暴露分级处理。", "id": 642}, {"theme": "operations", "tag": "安全与应急", "species": "both", "type": "single", "difficulty": 3, "question": "世界卫生组织推荐的“十日观察法”适用前提是？", "options": ["已对人进行伤口处理并启动疫苗接种，同时观察动物10日", "可以不接种疫苗只看动物", "仅适用于猫", "无任何前提"], "answer": "已对人进行伤口处理并启动疫苗接种，同时观察动物10日", "explanation": "在能够观察动物的情况下，人先开始暴露后预防，若动物10日内健康可中止后续针次；不可因此延迟首针。", "id": 643}, {"theme": "operations", "tag": "安全与应急", "species": "cat", "type": "single", "difficulty": 2, "question": "猫核心疫苗“猫三联”（如妙三多）主要预防？", "options": ["猫瘟、猫鼻支（疱疹病毒）、猫杯状病毒", "狂犬病", "体内寄 需兽医建议", "explanation": "处方粮用于肾、泌尿、胃肠等疾病的营养管理，不能替代治疗，须遵医嘱。", "id": 651}, {"theme": "operations", "tag": "托运", "species": "both", "type": "single", "difficulty": 2, "question": "飞机托运宠物，下列说法错误的是？", "options": ["短鼻犬（法斗/巴哥等）多数航司禁止或限制有氧舱托运", "需提前申请有氧舱", "需动物检疫合格证明", "需合规航空箱"], "answer": "短鼻犬（法斗/巴哥等）多数航司禁止或限制有氧舱托运", "explanation": "法斗、巴哥等短鼻犬散热差，多家航司禁运或限运，夏季高温常暂停托运。", "id": 652}, {"theme": "operations", "tag": "托运", "species": "both", "type": "single", "difficulty": 1, "question": "国内火车/高铁对携带活体宠物的一般规定是？", "options": ["不允许携带（导盲犬除外）", "可放行李架", "购票即带", "仅限猫"], "answer": "不允许携带（导盲犬除外）", "explanation": "铁路除导盲犬外禁带活体，需走航空、宠物专车或顺风车等方式。", "id": 653}, {"theme": "operations", "tag": "托运", "species": "both", "type": "single", "difficulty": 2, "question": "宠物航空托运通常必备的材料是？", "options": ["动物检疫合格证明+免疫证明+合规航空箱", "仅购机票", "仅身份证", "无需材料"], "answer": "动物检疫合格证明+免疫证明+合规航空箱", "explanation": "出发地动物卫生监督所开具检疫证，提前向航司申请有氧舱并准备合规航空箱。", "id": 654}, {"theme": "operations", "tag": "保险", "species": "both", "type": "single", "difficulty": 2, "question": "宠物医疗险通常的赔付方式是？", "options": ["对符合条款的诊疗费按比例报销，设免赔额与等待期", "全覆盖无免赔", "仅保第三者", "一次缴费保终身"], "answer": "对符合条款的诊疗费按比例报销，设免赔额与等待期", "explanation": "医疗险报销诊疗费但有免赔、等待期、保额上限；投保前已患病症多不赔。", "id": 655}, {"theme": "operations", "tag": "保险", "species": "dog", "type": "single", "difficulty": 2, "question": "养犬“第三者责任险”主要保障？", "options": ["犬只伤人/损坏他人财物依法应赔的部分", "仅宠物自身疾病", "仅宠物丢失", "仅美容费用"], "answer": "犬只伤人/损坏他人财物依法应赔的部分", "explanation": "可转嫁犬只伤人、损坏财物的法律风险，建议大型犬/烈性犬家庭配置。", "id": 656}, {"theme": "operations", "tag": "购买与繁育", "species": "both", "type": "single", "difficulty": 2, "question": "“星期猫/星期狗”是指？", "options": ["购后一周内因猫瘟/细小等死亡的宠物，多源自不规范繁殖", "活过一周的猫", "一个品种名称", "疫苗齐全的宠物"], "answer": "购后一周内因猫瘟/细小等死亡的宠物，多源自不规范繁殖", "explanation": "多来自后院繁殖、活体网店、低成本批发；购宠选正规渠道并要求健康保证与疫苗本。", "id": 657}, {"theme": "operations", "tag": "购买与繁育", "species": "both", "type": "single", "difficulty": 2, "question": "选购宠物应优先选择？", "options": ["正规猫舍/犬舍、实体店现场检疫、可看父母与疫苗本", "路边低价", "活体快递", "不查看健康"], "answer": "正规猫舍/犬舍、实体店现场检疫、可看父母与疫苗本", "explanation": "要求现场查看精神食欲、疫苗记录与健康保证；避免活体快递与“星期”陷阱。", "id": 658}, {"theme": "operations", "tag": "购买与繁育", "species": "both", "type": "single", "difficulty": 2, "question": "通过快递运输活体宠物的主要风险是？", "options": ["运输应激、伤亡、无售后、易扩散传染病", "安全快速", "免费医疗", "毫无风险"], "answer": "运输应激、伤亡、无售后、易扩散传染病", "explanation": "活体快递违规且应激高、易伤亡；建议就近自提或专业宠物专车。", "id": 659}, {"theme": "operations", "tag": "购买与繁育", "species": "both", "type": "single", "difficulty": 3, "question": "关于正规活体销售，商家应提供？", "options": ["健康保证、疫苗记录、饲养指导与售后约定", "仅收款不负责", "无单据", "不告知品种"], "answer": "健康保证、疫苗记录、饲养指导与售后约定", "explanation": "正规活体销售附健康承诺与疫苗本，可显著降低纠纷与“星期”争议。", "id": 660}, {"theme": "operations", "tag": "行为矫正", "species": "dog", "type": "single", "difficulty": 2, "question": "犬只“分离焦虑”的常见表现是？", "options": ["独处时吠叫、拆家、随地排泄", "安静睡觉", "食欲大增", "不理主人"], "answer": "独处时吠叫、拆家、随地排泄", "explanation": "通过脱敏、独处训练、环境丰容及必要时行为/药物介入改善。", "id": 661}, {"theme": "operations", "tag": "行为矫正", "species": "cat", "type": "single", "difficulty": 2, "question": "猫砂盆的摆放与数量建议是？", "options": ["数量≈猫数+1，置于安静通风处", "一个够全家用", "放在食盆旁", "放在进门处"], "answer": "数量≈猫数+1，置于安静通风处", "explanation": "多猫家庭“N+1”原则，远离食水与嘈杂，每日清理以减少乱尿。", "id": 662}, {"theme": "operations", "tag": "行为矫正", "species": "cat", "type": "single", "difficulty": 2, "question": "猫出现乱尿、躲藏、不吃，常提示？", "options": ["应激或泌尿/标记问题，需先排查环境与疾病", "只是调皮", "想出门玩", "饿了发脾气"], "answer": "应激或泌尿/标记问题，需先排查环境与疾病", "explanation": "先排除膀胱炎/尿闭（公猫尿闭可危及生命），再改善环境与费洛蒙安抚。", "id": 663}, {"theme": "operations", "tag": "牵遛与训练", "species": "both", "type": "single", "difficulty": 2, "question": "正向训练（奖励训练）的核心是？", "options": ["奖励期望行为、引导而非体罚不当行为", "以体罚为主", "大声呵斥", "长期关笼"], "answer": "奖励期望行为、引导而非体罚不当行为", "explanation": "正向强化建立信任、降低恐惧与攻击，优于打骂。", "id": 664}, {"theme": "operations", "tag": "牵遛与训练", "species": "dog", "type": "single", "difficulty": 1, "question": "幼犬社会化的关键期约为？", "options": ["3-14周，接触人/犬/环境可降低成年恐惧与攻击", "出生后立刻", "1岁之后", "不需要"], "answer": "3-14周，接触人/犬/环境可降低成年恐惧与攻击", "explanation": "关键期内温和多样的社会化显著影响成年行为与自信心 y": 1, "question": "猫包开口应对着墙或人，避免猫直接看到陌生环境而炸毛。", "options": ["正确", "错误"], "answer": "正确", "explanation": "遮挡视线可降低猫的紧张", "id": 863, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "judge", "difficulty": 1, "question": "猫抓板能满足猫磨爪天性，保护家具。", "options": ["正确", "错误"], "answer": "正确", "explanation": "提供抓板是引导磨爪、保护家具的有效方式", "id": 864, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "judge", "difficulty": 1, "question": "猫是相对独立的动物，服务时应尊重它的节奏，不强行互动。", "options": ["正确", "错误"], "answer": "正确", "explanation": "尊重猫的独立性，强撸易应激", "id": 865, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "judge", "difficulty": 1, "question": "遛狗必须拾便，是养犬人基本责任，也是门店应倡导的。", "options": ["正确", "错误"], "answer": "正确", "explanation": "拾便维护公共卫生，体现文明养犬", "id": 866, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "客户带一只8岁的金毛来寄养，你的接待流程是？", "options": null, "answer": "1.健康初检（皮肤/精神/食欲）并拍照；2.签寄养协议；3.书面告知风险（老年宠物）；4.签确认单；5.记录饮食/用药习惯；6.留紧急联系方式和就诊医院", "explanation": "老年宠物寄养接待流程", "id": 867, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "客户第一次带宠物来店，你应该问哪些问题？", "options": null, "answer": "1.宠物名字/品种/年龄/性别/体重；2.健康状况（病史/过敏史/疫苗/驱虫）；3.行为习惯（怕生/攻击性/特殊癖好）；4.饮食习惯；5.主人需求和期望；6.紧急联系方式", "explanation": "首次接待的问题清单", "id": 868, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "寄养期间发现狗狗不吃东西、精神萎靡，你应该怎么处理？", "options": null, "answer": "1.立即检查健康状况；2.联系主人告知情况；3.必要时送医；4.记录过程；5.不能隐瞒", "explanation": "寄养异常的处理", "id": 869, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "客户问\"寄养期间你们怎么照顾我的狗\"，你怎么回答？", "options": null, "answer": "1.独立空间，不混养；2.按主人要求喂食（自带粮或我们提供）；3.每天遛2次；4.每天拍视频发给主人；5.24小时监控；6.任何异常第一时间联系", "explanation": "寄养服务的介绍", "id": 870, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "寄养老年宠物，必须做什么？", "options": ["多收费用", "书面风险告知+签确认", "拒绝服务", "要求主人在场"], "answer": "书面风险告知+签确认", "explanation": "老年宠物必须书面告知风险并签确认", "id": 871, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "客户投诉说\"你们把我的狗剪伤了\"，你应该怎么处理？", "options": null, "answer": "1.立即道歉；2.查看伤口情况；3.如果是我们的责任，承担医疗费用；4.赠送免费服务或优惠券；5.3天内二次回访确认满意度；6.内部复盘避免再发生", "explanation": "剪伤客诉的处理", "id": 872, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "客户在大众点评给了差评，说\"服务态度差\"，你应该怎么处理？", "options": null, "answer": "1.24小时内在平台回复道歉；2.私信联系客户了解具体情况；3.如果确实服务不到位，提出补偿方案；4.邀请客户再体验；5.内部培训改进", "explanation": "差评的处理", "id": 873, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "发现宠物有传染性疾病（如犬瘟/真菌），应该怎么做？", "options": ["拒绝服务建议就医", "戴手套继续", "继续服务", "只做一半"], "answer": "拒绝服务建议就医", "explanation": "传染性疾病需拒绝服务，防交叉感染", "id": 874, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "宠物店必须安装监控的区域是？", "options": ["只有收银台", "操作区+寄养区（除洗手间）", "只有门口", "不用安装"], "answer": "操作区+寄养区（除洗手间）", "explanation": "操作区和寄养区必须无死角监控，既是证据也是震慑", "id": 875, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "宠物店定价策略最合适的是？", "options": ["随意定价", "成本加成+市场对标", "越便宜越好", "越贵越好"], "answer": "成本加成+市场对标", "explanation": "成本加成30%左右，同时参考周边宠物店价格", "id": 876, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "促销活动最合适的方式是？", "options": ["全场5折", "满赠体验券/会员日折扣", "免费服务", "降价倾销"], "answer": "满赠体验券/会员日折扣", "explanation": "满赠体验券提升客单价，会员日折扣引导复购", "id": 877, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "客户问\"你们店和其他店有什么不同\"，你怎么回答？", "options": null, "answer": "1.标准化SOP（服务流程规范）；2.情绪价值（客户档案/定制礼品/节庆活动）；3.招牌狗大福（吸引女性客群）；4.社区中高端定位（专注洗护美容+寄养）", "explanation": "差异化竞争的回答", "id": 878, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "开业初期客流不足，你的推广策略是？", "options": null, "answer": "1.社区地推+社群宣传；2.大众点评/美团上线；3.开业体验套餐（低价引流）；4.账号内容密集发布（小红书/抖音）；5.首月低价引流+口碑积累", "explanation": "开业推广策略", "id": 879, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "客户问\"你们有没有会员制度\"，你怎么介绍？", "options": null, "answer": "储值会员：充500送免费洗浴1次+驱虫药1支；充2000享年度体检+专属客服。积分制：1元=1积分，可兑换美容折扣券/定制项圈。生日月积分翻倍", "explanation": "会员制度的介绍", "id": 880, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "新客户来店后，应该多久回访？", "options": ["不用回访", "3天后", "1周后", "1个月后"], "answer": "3天后", "explanation": "新客户3天后回访，询问商品使用感受和喂养建议", "id": 881, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "寄养/美容后应该多久回访？", "options": ["24小时内", "1周后", "不用回访", "3天后"], "answer": "24小时内", "explanation": "寄养/美容后24小时内回访，确认宠物状态", "id": 882, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "客户问\"你们会记录我狗狗的信息吗\"，你怎么回答？", "options": null, "answer": "会的。我们建立了客户档案，记录您狗狗的品种/年龄/健康状况/过敏史/饮食偏好/禁忌项。这样每次来都能提供更个性化的服务，也更安全", "explanation": "客户档案的介绍", "id": 883, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "宠物店最需要防范的法律风险是？", "options": ["偷税漏税", "客户带患病宠物讹诈+假装被咬伤+未签协议纠纷", "消防", "环保"], "answer": "客户带患病宠物讹诈+假装被咬伤+未签协议纠纷", "explanation": "三类索赔陷阱：患病宠物讹诈/假装被咬伤/未签寄养协议", "id": 884, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "防范职业索赔人最好的方式是？", "options": ["不开发票", "不收现金", "安装全覆盖监控+签协议", "不接待陌生客户"], "answer": "安装全覆盖监控+签协议", "explanation": "监控是最佳证据，协议是法律保障", "id": 885, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "宠物店员工最重要的素质是？", "options": ["爱心", "服务意识+专业技能", "学历", "外貌"], "answer": "服务意识+专业技能", "explanation": "爱心不能替代专业，最终买单的是宠物主人", "id": 886, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "员工在美容时态度不好，被客户投诉，你应该怎么处理？", "options": null, "answer": "1.向客户道歉并补偿；2.与员工沟通了解原因；3.如果是态度问题，进行服务礼仪培训；4.如果是技术问题，进行技术培训；5.记录事件纳入考核", "explanation": "员工投诉的处理", "id": 887, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "宠物店服务后，应该给客户什么？", "options": ["服务反馈+后续护理建议+小礼品", "推销产品", "只收钱", "什么都不给"], "answer": "服务反馈+后续护理建议+小礼品", "explanation": "反馈服务情况+建议后续护理+赠送小礼品提升好感", "id": 888, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "宠物店预约服务最好的方式是？", "options": ["只接受电话", "电话+微信+到店多渠道", "只接受到店", "只接受微信"], "answer": "电话+微信+到店多渠道", "explanation": "多渠道预约方便客户", "id": 889, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "客户问\"你们店的美容师有资质吗\"，你怎么回答？", "options": null, "answer": "我们的美容师持有宠物美容师资格证（C级及以上），熟悉不同品种的护理需求。店内还有完善的技术培训体系，每月组织技术交流", "explanation": "美容师资质的介绍", "id": 890, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "宠物店库存管理最合适的方式是？", "options": ["ABC分类法", "越多越好", "不管理", "越少越好"], "answer": "ABC分类法", "explanation": "A类（主粮）备30天，C类（玩具）备7天，滞销品每月清仓", "id": 891, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "客户问\"你们店的商品价格比网上贵，为什么\"，你怎么回答？", "options": null, "answer": "1.我们是正规渠道采购，有质检报告和检疫证明；2.提供专业的喂养建议和售后服务；3.可以现场看到实物；4.支持无理由退换；5.会员还有折扣", "explanation": "价格差异的解释", "id": 892, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "宠物店最容易被忽视的安全隐患是？", "options": ["火灾", "宠物逃跑/丢失", "水灾", "地震"], "answer": "宠物逃跑/丢失", "explanation": "宠物丢失是最常见的安全事故，必须做好门窗防护和交接确认", "id": 893, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "客户问\"你们店的卫生情况怎么样\"，你怎么回答？", "options": null, "answer": "1.工具每次使用后浸泡消毒30分钟；2.操作区每天营业结束后消毒；3.一次性用品专人专用；4.寄养区每天清洁消毒；5.欢迎您随时参观", "explanation": "卫生情况的介绍", "id": 894, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "猫进店后炸毛、哈气、躲藏，说明它处于？", "options": ["强烈应激", "饥饿", "开心", "放松"], "answer": "强烈应激", "explanation": "炸毛哈气躲藏是猫应激典型表现", "id": 895, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "judge", "difficulty": 2, "question": "猫应激可诱发应激性膀胱炎（FIC），公猫尿闭可致命。", "options": ["正确", "错误"], "answer": "正确", "explanation": "应激是下泌尿道疾病诱因，公猫尿闭紧急危险", "id": 896, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "缓解猫应激，店内最合适的环境是？", "options": ["喧闹有狗叫", "安静、暗光、使用费洛蒙", "多人围观", "强光直射"], "answer": "安静、暗光、使用费洛蒙", "explanation": "安静暗光+费洛蒙(Feliway)能显著降低猫应激", "id": 897, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "费洛蒙（如Feliway）对猫的主要作用是？", "options": ["杀菌", "模拟安抚信息素、缓解应激", "增进食欲", "驱虫"], "answer": "模拟安抚信息素、缓解应激", "explanation": "合成猫面部信息素，营造安全感", "id": 898, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "judge", "difficulty": 2, "question": "接待猫时不应强行抱猫或拖出猫包，应让其主动适应。", "options": ["正确", "错误"], "answer": "正确", "explanation": "强迫会加剧应激，应给猫自主选择权", "id": 899, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "猫外出最好使用？", "options": ["项圈牵着走", "封闭式猫包/航空箱", "直接抱", "笼子拖着"], "answer": "封闭式猫包/航空箱", "explanation": "封闭猫包安全且给猫安全感", "id": 900, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "猫寄养时，猫砂盆数量建议为？", "options": ["越多越乱", "1个管所有", "猫数+1个", "不用砂盆"], "answer": "猫数+1个", "explanation": "猫砂盆原则：N只猫配N+1个，减少争用和乱尿", "id": 901, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "judge", "difficulty": 2, "question": "猫寄养应与狗分区，且多猫家庭尽量分开避免打架。", "options": ["正确", "错误"], "answer": "正确", "explanation": "猫领域意识强，混养易应激冲突", "id": 902, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "猫寄养最该让主人自带的是？", "options": ["玩具就行", "熟悉的粮和猫砂/垫子（带气味）", "随便换粮", "不用带"], "answer": "熟悉的粮和猫砂/垫子（带气味）", "explanation": "熟悉气味和食物能大幅降低寄养应激", "id": 903, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "judge", "difficulty": 2, "question": "猫寄养期间应每日观察食欲、精神、排泄（猫砂盆）情况并记录。", "options": ["正确", "错误"], "answer": "正确", "explanation": "猫异常常先表现在食欲和排泄上", "id": 904, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "猫的核心疫苗「猫三联」预防的是？", "options": ["犬瘟/细小", "猫瘟/猫鼻支/猫杯状病毒", "狂犬", "寄生虫"], "answer": "猫瘟/猫鼻支/猫杯状病毒", "explanation": "猫三联=猫泛白细胞减少症(猫瘟)+猫鼻气管炎(鼻支)+猫杯状病毒", "id": 905, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "幼猫首次接种猫三联一般从几周龄开始？", "options": ["2周", "8周（约2月龄）", "6个月", "1岁"], "answer": "8周（约2月龄）", "explanation": "幼猫8周龄起接种，间隔3-4周一针，共2-3针", "id": 906, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "judge", "difficulty": 2, "question": "猫三联完成后仍需定期加强（每年或每三年，遵医嘱）。", "options": ["正确", "错误"], "answer": "正确", "explanation": "核心疫苗需定期加强以维持保护力", "id": 907, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "猫的狂犬疫苗通常建议在什么阶段接种？", "options": ["出生即打", "3月龄以上、猫三联后", "只打一次终身", "不用打"], "answer": "3月龄以上、猫三联后", "explanation": "狂犬一般满3月龄、在核心疫苗后接种，依法必打", "id": 908, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "客户问「我家猫不出门，还要打疫苗吗」，你怎么回答？", "options": null, "answer": "建议打。即使不出门，人可能带回病原，且狂犬是法定传染病。猫三联防猫瘟等高度传染性疾病，一旦感染死亡率高。不出门可降低频率但核心疫苗仍建议做", "explanation": "不出门是否打疫苗", "id": 909, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "母猫发情的典型表现是？", "options": ["安静嗜睡", "嚎叫（叫春）、蹭人、翘臀、食欲下降", "大量掉毛", "爱洗澡"], "answer": "嚎叫（叫春）、蹭人、翘臀、食欲下降", "explanation": "母猫发情会频繁嚎叫、摩擦、摆出接受姿势", "id": 910, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "未绝育公猫发情常见行为是？", "options": ["更乖", "乱尿喷标记、想外出、攻击性增", "爱洗澡", "不吃饭"], "answer": "乱尿喷标记、想外出、攻击性增", "explanation": "公猫发情会喷尿标记、外逃，绝育可显著改善", "id": 911, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "猫绝育（节育）的推荐时机一般是？", "options": ["发情期当场", "6月龄左右（性成熟前）", "5岁后", "刚出生"], "answer": "6月龄左右（性成熟前）", "explanation": "一般建议6月龄左右、健康时绝育", "id": 912, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "judge", "difficulty": 2, "question": "绝育能降低猫生殖系统疾病和走失/喷尿风险。", "options": ["正确", "错误"], "answer": "正确", "explanation": "绝育减少卵巢癌/睾丸癌及行为问题", "id": 913, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "客户犹豫要不要给猫绝育，你怎么科普？", "options": null, "answer": "绝育好处：①杜绝子宫蓄脓、卵巢/睾丸肿瘤；②母猫不发情嚎叫，公猫不喷尿外逃；③减少走失和意外怀孕；④更长寿健康。最佳时机约6月龄、健康状态下进行，术前需禁食", "explanation": "绝育科普话术", "id": 914, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "猫砂中，结团性好、除臭强、粉尘低且可冲厕的是哪类？", "options": ["豆腐猫砂", "水晶砂", "松木砂", "膨润土"], "answer": "豆腐猫砂", "explanation": "豆腐砂结团好、可冲厕、粉尘低，较受城市养猫欢迎", "id": 915, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "关于猫砂盆摆放，正确的是？", "options": ["放门口", "放阳台暴晒", "放食盆旁", "放安静、通风、远离食水处"], "answer": "放安静、通风、远离食水处", "explanation": "猫砂盆应安静私密、远离吃饭喝水处", "id": 916, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "猫薄荷对大多数猫的作用是？", "options": ["致命", "中毒", "引起短暂兴奋/放松（安全）", "致幻有害"], "answer": "引起短暂兴奋/放松（安全）", "explanation": "猫薄荷安全，多数猫闻后短暂兴奋放松，别过量", "id": 917, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "以下哪类商品最适合作为猫店引流连带销售？", "options": ["狗粮", "猫砂+猫抓板+化毛膏等高频刚需", "大型犬笼", "爬宠饲料"], "answer": "猫砂+猫抓板+化毛膏等高频刚需", "explanation": "猫砂/抓板/化毛膏是养猫高频消耗，适合连带", "id": 918, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "客户第一次养猫来店里买东西，你优先推荐什么？", "options": null, "answer": "围绕刚需：①合适的猫砂+猫砂盆（N+1）；②猫粮（按年龄选幼/成猫粮）；③猫包；④猫抓板；⑤化毛膏/猫草；⑥基础洗护用品。并提醒疫苗、绝育和应激管理", "explanation": "新手养猫选品", "id": 919, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "judge", "difficulty": 2, "question": "猫身体灵活、易钻缝，店内门窗必须做好防护防逃跑。", "options": ["正确", "错误"], "answer": "正确", "explanation": "猫丢失比狗更难找回，门窗防护很重要", "id": 920, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "猫丢失后，正确的处理是？", "options": ["等它自己回", "立即在周边寻找+查监控+发启事+通知主人", "换店", "不告诉主人"], "answer": "立即在周边寻找+查监控+发启事+通知主人", "explanation": "猫丢失要快找、用监控、发启事，并第一时间通知主人", "id": 921, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "猫的年龄换算，1岁猫约相当于人类几岁？", "options": ["30岁", "15岁", "5岁", "1岁"], "answer": "15岁", "explanation": "猫1岁≈人类15岁，2岁≈24岁，之后每岁+4", "id": 922, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "judge", "difficulty": 2, "question": "猫7岁以上算老年，饮食和体检需更关注肾脏。", "options": ["正确", "错误"], "answer": "正确", "explanation": "猫7岁后进入老年，肾脏和关节是重点", "id": 923, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "接待猫主人和狗主人，话术差异主要在于？", "options": ["完全一样", "只聊价格", "都不用管", "更强调应激管理、独立性和安静环境"], "answer": "更强调应激管理、独立性和安静环境", "explanation": "猫主人更关心应激、猫的独立性，话术要突出安静专业", "id": 924, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "客户说「我们家猫特别怕生，去你们店会不会应激」，你怎么回应？", "options": null, "answer": "我们会做应激管理：独立安静的猫接待区、使用费洛蒙、托底搬运不强行抱、提供隐蔽空间，流程尽量快。首次可先带猫来熟悉环境再服务，把应激降到最低", "explanation": "猫应激顾虑回应", "id": 925, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "猫到家后的如厕训练，正确做法是？", "options": ["打骂", "把猫放砂盆、用同款猫砂、正向引导", "不给砂盆", "关禁闭"], "answer": "把猫放砂盆、用同款猫砂、正向引导", "explanation": "用熟悉砂盆和猫砂引导，乱尿先排查疾病/应激", "id": 926, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "judge", "difficulty": 2, "question": "猫乱尿要先排查疾病（如膀胱炎）和应激，而非直接惩罚。", "options": ["正确", "错误"], "answer": "正确", "explanation": "乱尿常是病痛或应激信号，惩罚无效且加重应激", "id": 927, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "猫出现攻击性（哈气/挥爪）时，正确应对是？", "options": ["继续逗", "打它", "硬抱强行安抚", "退后给空间、不强迫"], "answer": "退后给空间、不强迫", "explanation": "尊重猫界限，硬来会被抓咬且加应激", "id": 928, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "猫店陈列猫用品，优先突出？", "options": ["高频刚需（猫砂/猫粮/猫包/抓板）", "异宠用品", "狗窝", "爬宠饲料"], "answer": "高频刚需（猫砂/猫粮/猫包/抓板）", "explanation": "刚需高频品做引流和连带", "id": 929, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "judge", "difficulty": 2, "question": "猫用品也有保质期，开封猫湿粮/零食需冷藏并尽快食用。", "options": ["正确", "错误"], "answer": "正确", "explanation": "湿粮零食开封易变质，需冷藏限时", "id": 930, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "客户问绝育后怎么护理，你怎么说？", "options": null, "answer": "术后：戴伊丽莎白圈防舔伤口；保持伤口干燥清洁；安静休息、限制剧烈跳动；按时换药复查；观察食欲精神，异常（红肿渗液/不吃）及时回诊。公猫恢复快，母猫伤口更大需更小心", "explanation": "绝育后护理", "id": 931, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "夏季高温，店内猫最需防范的是？", "options": ["感冒", "中暑（热射病）", "冻伤", "风湿"], "answer": "中暑（热射病）", "explanation": "猫散热差，高温密闭易中暑，需通风降温", "id": 932, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "judge", "difficulty": 2, "question": "猫客户档案应记录品种/年龄/性别/绝育/疫苗/性情/疾病史/饮食禁忌。", "options": ["正确", "错误"], "answer": "正确", "explanation": "完整档案保障服务安全与个性化", "id": 933, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "制定猫寄养协议，最该明确的是？", "options": ["只写价格", "健康告知+授权送医+免责与赔偿责任", "不签", "口头约定"], "answer": "健康告知+授权送医+免责与赔偿责任", "explanation": "协议明确健康告知与紧急送医授权，防纠纷", "id": 934, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "客户想给猫做美容，但猫极度怕水，你怎么推荐？", "options": null, "answer": "建议先做低应激基础护理（梳毛、剪指甲、洁耳洁眼），暂不做水洗。若必须清洁，可用宠物干洗泡沫局部擦拭。等猫逐步适应、用费洛蒙安抚后再评估是否洗澡", "explanation": "怕水猫的美容方案", "id": 935, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "向猫主人推销宠物保险，最合适的切入点是？", "options": ["不提", "结合绝育/疫苗/意外医疗场景自然介绍", "只卖粮", "强行推销"], "answer": "结合绝育/疫苗/意外医疗场景自然介绍", "explanation": "在医疗/意外场景顺势介绍保险更自然", "id": 936, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "狗狗寄养时，笼养空间应做到？", "options": ["不清理", "关灯不管", "能转身站立、通风干净、每日放风", "越小越好"], "answer": "能转身站立、通风干净、每日放风", "explanation": "寄养笼应保证基本活动与卫生", "id": 937, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "judge", "difficulty": 2, "question": "寄养犬只需每日观察食欲、精神、排泄，有无腹泻呕吐。", "options": ["正确", "错误"], "answer": "正确", "explanation": "异常常先体现在食欲和排泄上", "id": 938, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "牵遛服务最关键的是？", "options": ["不牵绳", "安全牵引不脱绳、清理排泄物、避让怕狗者", "越快越好", "随便跑"], "answer": "安全牵引不脱绳、清理排泄物、避让怕狗者", "explanation": "牵遛安全与文明是第一原则", "id": 939, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "胸背带（harness）相对颈圈更适合？", "options": ["所有狗都该用项圈", "小型犬、气管敏感犬、爆冲犬", "大型猛犬专属", "不用"], "answer": "小型犬、气管敏感犬、爆冲犬", "explanation": "胸背分散拉力，保护气管和颈椎", "id": 940, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "judge", "difficulty": 2, "question": "P绳（P链）需专业使用，错误使用会伤气管和颈部。", "options": ["正确", "错误"], "answer": "正确", "explanation": "P链是矫正工具，使用不当易伤犬", "id": 941, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "狗狗定点大小便训练的核心是？", "options": ["关笼", "固定地点+及时奖励+定时带出", "打骂惩罚", "不理"], "answer": "固定地点+及时奖励+定时带出", "explanation": "正向强化+规律带出是训练关键", "id": 942, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "狗狗分离焦虑的常见表现是？", "options": ["安静睡觉", "拆家/乱尿/不停吠叫/流涎", "不理人", "爱吃"], "answer": "拆家/乱尿/不停吠叫/流涎", "explanation": "分离焦虑表现为独处时的破坏和应激", "id": 943, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "judge", "difficulty": 2, "question": "狗狗过度吠叫应先排查需求（排泄/无聊/恐惧）再行为纠正，不能只打骂。", "options": ["正确", "错误"], "answer": "正确", "explanation": "吠叫是沟通，先找原因再纠正", "id": 944, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "读狗的肢体语言：尾巴高举僵硬、身体前倾通常表示？", "options": ["困了", "警觉或有攻击意图", "想玩", "放松"], "answer": "警觉或有攻击意图", "explanation": "僵直高举尾+前倾是警戒/攻击前兆", "id": 945, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "遇到陌生狗，正确做法是？", "options": ["尖叫", "抓尾巴", "让狗先闻手背、不直视不强行摸", "冲上去抱"], "answer": "让狗先闻手背、不直视不强行摸", "explanation": "尊重犬意愿、侧身伸手背让其嗅闻", "id": 946, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "judge", "difficulty": 2, "question": "店内多犬共处需监督，出现低吼/僵立要立即分开防冲突。", "options": ["正确", "错误"], "answer": "正确", "explanation": "低吼是警告信号，及时分隔避免咬伤", "id": 947, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "接待狗主人、建立信任的关键是？", "options": ["专业+耐心+把狗当客户", "只推贵的", "催单", "不理"], "answer": "专业+耐心+把狗当客户", "explanation": "专业和同理心最能赢得宠主信任", "id": 948, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "寄养协议应明确？", "options": ["健康状态/疫苗/授权送医/费用责任", "不用签", "口头说就行", "只写名字"], "answer": "健康状态/疫苗/授权送医/费用责任", "explanation": "协议明确权责，含紧急送医授权", "id": 949, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "judge", "difficulty": 2, "question": "烈性犬/大型犬到店需确认疫苗与性情，必要时要求主人陪同或婉拒。", "options": ["正确", "错误"], "answer": "正确", "explanation": "高风险犬需评估，保障人犬安全", "id": 950, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "店里有两只狗突然打架，一只耳朵出血，你怎么处理？", "options": null, "answer": "立即分隔双方、戴手套检查伤口并压迫止血，评估是否需送医；安抚主人、记录事件经过，必要时暂停服务并签知情同意。事后复盘分隔流程", "explanation": "店内犬只冲突应急", "id": 951, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "文明养犬「三要素」通常指？", "options": ["吃好睡好", "办证/疫苗/牵绳拾便", "不洗澡", "不遛狗"], "answer": "办证/疫苗/牵绳拾便", "explanation": "合法、健康、文明是养犬基础", "id": 952, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "single", "difficulty": 2, "question": "幼犬首次到店洗澡/美容，应注意？", "options": ["随便洗", "确认疫苗齐全、体弱幼犬谨慎、防应激", "不洗", "只剪指甲"], "answer": "确认疫苗齐全、体弱幼犬谨慎、防应激", "explanation": "幼犬免疫未全易感染，且易应激", "id": 953, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 2, "question": "客户说「我家狗太爆冲，遛它我拉不住」，你怎么建议？", "options": null, "answer": "建议换前扣式胸背带、练习松弛牵引（随行），从安静环境短时间开始，并用慢食玩具消耗精力；爆冲多因精力过剩，增加每日运动。也可约我们的牵遛服务", "explanation": "爆冲纠正建议", "id": 954, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "judge", "difficulty": 2, "question": "老年犬服务要更温柔、防滑、避免长时间站立和剧烈美容。", "options": ["正确", "错误"], "answer": "正确", "explanation": "老年犬关节差、耐受低，需更呵护", "id": 955, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 3, "question": "寄养的狗狗突然中暑（法斗），你应该怎么处理？", "options": null, "answer": "1.立即移到阴凉通风处；2.用湿毛巾降温（不是冰水）；3.提供饮水；4.立即送医；5.第一时间通知主人；6.记录全过程；7.不能隐瞒", "explanation": "寄养中暑的应急处理", "id": 956, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 3, "question": "客户说\"我的狗在你们店里被咬伤了，你们要赔偿\"，但监控显示没有，你应该怎么处理？", "options": null, "answer": "1.保留监控证据；2.向客户展示监控；3.如果客户坚持，建议报警处理；4.监控就是最佳证据；5.不要私下赔钱，会被职业索赔人盯上", "explanation": "职业索赔的应对", "id": 957, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 3, "question": "寄养的狗狗从你店里跑丢了，你应该怎么处理？", "options": null, "answer": "1.立即组织寻找；2.第一时间通知主人；3.查看监控确认逃跑路线；4.在周边社区发寻狗启事；5.报警备案；6.承担相应责任；7.不能隐瞒", "explanation": "宠物丢失的应急处理", "id": 958, "tag": "店铺运营(基础)", "species": "dog"}, {"theme": "operations", "type": "scenario", "difficulty": 3, "question": "寄养的猫到店后一直躲角落、不吃不喝、呼吸急促，你怎么办？", "options": null, "answer": "立即降低环境刺激：移入安静暗光单独空间，使用费洛蒙，提供隐蔽处和熟悉气味（自带毯子）。观察排尿，若公猫长时间不排尿（尿闭）立即送医。通知主人情况，不强行打扰", "explanation": "猫应激应急处理", "id": 959, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "type": "scenario", "difficulty": 3, "question": "客户说猫误食了家里杀虫剂，你如何指导？", "options": null, "answer": "立即联系宠物医院并带上包装。不要自行催吐（某些物质催吐更伤）。保持猫安静通风，记录误食时间和量，途中避免剧烈搬动，尽快送医洗胃解毒", "explanation": "猫中毒应急", "id": 960, "tag": "店铺运营(基础)", "species": "cat"}, {"theme": "operations", "tag": "美容护理(基础)", "type": "scenario", "difficulty": 2, "question": "客户说美容后狗狗皮肤发红、频繁抓挠，怀疑是你们用的洗护产品过敏，你怎么处理？", "options": null, "answer": "先安抚并记录：①停用当前产品，用清水彻底冲净残留；②轻度红痒可冷敷、涂宠物专用舒缓液，避免人用药膏；③出现皮疹扩散、肿胀或呼吸困难立即就医(可能过敏休克)；④核对是否首次使用该品牌/香精，建立客户过敏档案；⑤向客户说明处理进展并跟进，必要时免单部分费用以示负责。", "explanation": "洗护产品过敏的处置与客户沟通", "id": 961, "species": "dog"}, {"theme": "feeding", "type": "single", "difficulty": 2, "question": "容易有泪痕的狗狗，建议选择什么配方的狗粮？", "options": ["鱼肉配方", "牛肉配方", "鸭肉梨配方", "鸡肉配方"], "answer": "鸭肉梨配方", "explanation": "鸭肉梨配方清淡，有助于改善泪痕", "id": 962, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户说狗狗特别爱吃零食，不爱吃狗粮了，怎么办？", "options": null, "answer": "1.停止随意喂零食；2.定时定量喂狗粮，15分钟不吃就收走；3.零食只在训练奖励时给；4.坚持几天狗狗就会恢复正常吃粮", "explanation": "挑食的纠正方法", "id": 963, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户想给狗狗补充营养，买了一堆钙片和美毛膏，你的建议是？", "options": null, "answer": "健康狗狗不需要额外补充营养品。过量补钙会导致骨骼畸形，美毛产品效果有限。日常主食达标、饮食干净规律就是最好的营养。只有换季体弱或肠胃敏感时可少量搭配益生菌", "explanation": "营养补充的正确观念", "id": 964, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "single", "difficulty": 2, "question": "幼犬到家第一周最应该做什么？", "options": ["立即洗澡", "立即驱虫", "隔离观察+体检", "带出去社交"], "answer": "隔离观察+体检", "explanation": "幼犬到家先隔离观察，一周内完成体检，确认健康后再驱虫疫苗", "id": 965, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "single", "difficulty": 2, "question": "老年犬（7岁以上）饮食最需要注意的是？", "options": ["多补钙", "高热量", "高蛋白", "低脂肪高纤维"], "answer": "低脂肪高纤维", "explanation": "老年犬代谢慢，应选低脂肪高纤维配方，减轻肾脏和肠胃负担", "id": 966, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户刚接回家一只2月龄幼犬，问你第一周应该做什么？", "options": null, "answer": "1.隔离观察，不要急着洗澡/带出门；2.一周内完成体检；3.按时接种疫苗和驱虫；4.喂食幼犬粮，每天4-5餐少量多餐；5.保证新鲜饮水", "explanation": "幼犬到家第一周注意事项", "id": 967, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户说8岁的狗狗最近食欲下降，你应该建议什么？", "options": null, "answer": "1.先检查是否有健康问题（牙齿/肠胃/肝肾）；2.换老年犬专用粮（低脂肪高纤维）；3.少量多餐；4.适当泡软狗粮；5.定期体检", "explanation": "老年犬食欲下降的处理", "id": 968, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "single", "difficulty": 2, "question": "狗狗肥胖最容易导致什么健康问题？", "options": ["泪痕", "掉毛", "皮肤病", "关节问题+心脏负担"], "answer": "关节问题+心脏负担", "explanation": "肥胖压迫关节骨骼，增加心脏负担", "id": 969, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户说狗狗太胖了，想帮它减肥，你的建议是？", "options": null, "answer": "1.控制食量（减少10-20%）；2.选低脂配方粮；3.增加运动量；4.停喂零食或换低卡零食；5.每周称重监测", "explanation": "狗狗减肥方案", "id": 970, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户问\"狗狗一天应该吃多少\"，你怎么回答？", "options": null, "answer": "根据体重计算：每日总量(g)=体重(kg)×系数。幼犬约4%-6%，成犬约2%-3%。具体看狗粮包装建议，再根据活动量微调。摸肋骨判断胖瘦：能摸到但看不出=标准", "explanation": "喂食量计算方法", "id": 971, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户说狗狗吃完就拉，一天拉4-5次，正常吗？", "options": null, "answer": "需要了解具体情况：便便形态如何？如果是成型软便，可能是喂多了或粮不合适。如果是稀便/水便，可能是肠胃问题，建议就医。正常成犬每天1-2次大便", "explanation": "排便频率的判断", "id": 972, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户问\"狗狗可以吃水果吗\"，你怎么回答？", "options": null, "answer": "部分水果可以少量吃：苹果(去核)、蓝莓、香蕉、西瓜(去籽)。但有些水果有毒：葡萄/葡萄干、牛油果、樱桃核。给之前先查一下是否安全", "explanation": "狗狗能吃的水果", "id": 973, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户说狗狗吃饭的时候特别急，几秒就吃完了，有问题吗？", "options": null, "answer": "吃太快容易消化不良和呕吐。建议：1.用慢食碗；2.分多次喂；3.把粮撒在垫子上让狗狗找着吃；4.观察是否有呕吐或消化不良", "explanation": "进食过快的处理", "id": 974, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户问\"狗狗需要喝骨头汤补钙吗\"，你怎么回答？", "options": null, "answer": "不需要也不建议。骨头汤脂肪含量��，钙含量低，还可能有骨渣划伤肠胃。健康狗狗吃优质狗粮就能满足钙需求，不需要额外补", "explanation": "补钙的正确方式", "id": 975, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户说狗狗最近掉毛特别严重，和饮食有关系吗？", "options": null, "answer": "有关系。可能原因：1.粮太咸太油→换清淡配方；2.营养不均衡→选优质粮；3.过敏→排查食物过敏源；4.也可能是换毛季或皮肤病，需要检查", "explanation": "掉毛与饮食的关系", "id": 976, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户问\"幼犬和成犬的狗粮有什么区别\"，你怎么回答？", "options": null, "answer": "幼犬粮蛋白质≥28%、热量高、颗粒小，满足快速生长需求。成犬粮蛋白质≥26%、营养均衡。不能混吃，幼犬吃成犬粮会营养不良，成犬吃幼犬粮会肥胖", "explanation": "幼犬粮vs成犬粮", "id": 977, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户说家里有两只狗，一大一小，可以喂同一款粮吗？", "options": null, "answer": "不建议。大型犬和小型犬的营养需求不同，颗粒大小也不同。建议分开喂，各吃各的粮。如果一定要喂同一款，选全犬种通用粮", "explanation": "多狗家庭的喂养", "id": 978, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户问\"狗狗可以吃生肉吗\"，你怎么回答？", "options": null, "answer": "不建议喂生肉。生肉可能含寄生虫和细菌（沙门氏菌/大肠杆菌），有感染风险。如果要喂，选正规渠道的生骨肉配方粮，或把肉煮熟再喂", "explanation": "生肉喂养的风险", "id": 979, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户说狗狗吃了半块巧克力蛋糕，现在很兴奋，要紧吗？", "options": null, "answer": "巧克力含可可碱，对狗狗有毒。半块蛋糕的量需要看狗狗的体重。建议立即联系宠物医院，观察是否呕吐/腹泻/心跳加速/抽搐，必要时催吐", "explanation": "巧克力中毒的处理", "id": 980, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "single", "difficulty": 2, "question": "狗狗泪痕严重，饮食上应该怎么做？", "options": ["多喂零食", "多喝水", "换清淡配方粮", "多喂肉"], "answer": "换清淡配方粮", "explanation": "泪痕与饮食过油过咸有关，建议换鸭肉梨等清淡配方", "id": 981, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "single", "difficulty": 2, "question": "狗狗吃完饭后多久排便比较正常？", "options": ["4-6小时", "30分钟-2小时", "立即", "8小时以上"], "answer": "30分钟-2小时", "explanation": "饭后30分钟-2小时排便是正常的消化周期", "id": 982, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "scenario", "difficulty": 2, "question": "客户问\"狗狗需要吃益生菌吗\"，你怎么回答？", "options": null, "answer": "健康狗狗不需要长期吃益生菌。只有在换粮期、肠胃不适、换季体弱时可以少量搭配。长期吃反而可能影响肠道菌群自然平衡", "explanation": "益生菌的使用时机", "id": 983, "tag": "营养喂养(基础)", "species": "dog"}, {"theme": "feeding", "type": "single", "difficulty": 2, "question": "猫在营养学上属于哪一类动物？", "options": ["杂食偏素", "专性肉食动物", "杂食动物", "草食动物"], "answer": "专性肉食动物", "explanation": "猫是专性肉食动物，必须从肉类中获取牛磺酸等关键营养", "id": 984, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "single", "difficulty": 2, "question": "猫自身不能足量合成的、必须从食物中获取的必需氨基酸是？", "options": ["赖氨酸", "蛋氨酸", "色氨酸", "牛磺酸"], "answer": "牛磺酸", "explanation": "猫合成牛磺酸能力极弱，必须从肉类/猫粮中获取", "id": 985, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "judge", "difficulty": 2, "question": "牛磺酸对猫的心脏和视力都至关重要。", "options": ["正确", "错误"], "answer": "正确", "explanation": "牛磺酸缺乏会引发心肌病和视网膜病变，猫粮中必须强化", "id": 986, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "single", "difficulty": 2, "question": "优质成猫粮粗蛋白含量建议不低于多少？", "options": ["30%", "22%", "26%", "18%"], "answer": "30%", "explanation": "猫对蛋白需求高于狗，成猫粮粗蛋白建议≥30%（优质粮常≥35%）", "id": 987, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "single", "difficulty": 2, "question": "优质幼猫粮（生长期）粗蛋白含量建 95, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "single", "difficulty": 2, "question": "以下关于「巧克力」对猫的说法，正确的是？", "options": ["巧克力对猫有毒：可可碱中毒，神经和心脏受损", "煮熟后就安全", "晒干了就没毒", "巧克力对猫安全可少量喂"], "answer": "巧克力对猫有毒：可可碱中毒，神经和心脏受损", "explanation": "巧克力中的可可碱猫难代谢，引发中毒", "id": 996, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "single", "difficulty": 2, "question": "以下关于「木糖醇」对猫的说法，正确的是？", "options": ["木糖醇对猫安全可少量喂", "木糖醇对猫有毒：低血糖、肝损伤", "煮熟后就安全", "晒干了就没毒"], "answer": "木糖醇对猫有毒：低血糖、肝损伤", "explanation": "木糖醇导致猫胰岛素骤升，严重低血糖和肝损", "id": 997, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "single", "difficulty": 2, "question": "以下关于「酒精」对猫的说法，正确的是？", "options": ["酒精对猫安全可少量喂", "酒精对猫有毒：中枢神经系统抑制、呼吸衰竭", "煮熟后就安全", "晒干了就没毒"], "answer": "酒精对猫有毒：中枢神经系统抑制、呼吸衰竭", "explanation": "哪怕少量酒精也对猫剧毒", "id": 998, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "single", "difficulty": 2, "question": "以下关于「生鱼（尤其淡水生鱼）」对猫的说法，正确的是？", "options": ["煮熟后就安全", "晒干了就没毒", "生鱼（尤其淡水生鱼）对猫安全可少量喂", "生鱼（尤其淡水生鱼）对猫有毒：硫胺素（维生素B1）缺乏"], "answer": "生鱼（尤其淡水生鱼）对猫有毒：硫胺素（维生素B1）缺乏", "explanation": "生鱼含硫胺素酶，长期生食破坏维生素B1，致神经症状", "id": 999, "tag": "营养喂养(基础)", "species": "cat"}, {"theme": "feeding", "type": "single", "difficulty": 2, "question": "以下关于「牛奶」对猫的说法，正确的是？", "options": ["牛奶对猫安全可少量喂", "牛奶对猫有毒：多数猫乳糖不耐受，腹泻", "煮熟后就安全", "晒干了就没毒"], "answer": "牛奶对猫有毒：多数猫乳糖不耐受，腹泻", "explanation": "成年猫缺乏乳糖酶，喝牛奶易腹泻，应喂清水或宠物奶", "id": 1000, "tag": "营养喂养(基础)", "species": "cat"}];

function tagHTML(q){
