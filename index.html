function setMode(m){
  if(state.examTimer){ clearInterval(state.examTimer); state.examTimer=null; }
  state.mode=m; state.idx=0; state.sel=null; state.submitted=false;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.mode===m));
  $("#progress").style.display = (m==='practice'||m==='exam')?'block':'none';
  renderControls(); renderApp();
}

/* ---------- 沉浸式做题会话 ---------- */
function enterSession(mode){
  state.session=mode;
  document.body.classList.add('in-session');
  const sb=$("#sessionbar"); if(sb) sb.style.display='flex';
  $('#sexit').onclick=exitSession;
  updateSessionBar();
}
function exitSession(){
  state.session=null;
  document.body.classList.remove('in-session');
  const sb=$("#sessionbar"); if(sb) sb.style.display='none';
  setMode(state.mode);
}
function updateSessionBar(){
  if(!state.session) return;
  const total=state.list.length;
  const cur=Math.min(state.idx+1,total);
  $("#stitle").textContent=(state.session==='exam'?'考核':'练习')+' · 第 '+cur+' / '+total+' 题';
  if(state.session==='practice'){
    const rate=state.practiceDone? Math.round(state.practiceRight/state.practiceDone*100):null;
    $("#sright").textContent = rate==null? '' : ('已答对 '+state.practiceRight+' · 正确率 '+rate+'%');
  }
  updateProgress();
}

/* ---------- 控件 — 紧凑横排筛选栏 ---------- */
function chip(label,key,val,active){ const c=el('span','chip'+(active?' on':''),label); c.dataset.k=key; c.dataset.v=val; return c; }
function bar(label, nodes){
  const r=el('div','bar');
  if(label) r.appendChild(el('span','bar-label',label));
  const ch=el('span','chips');
  nodes.forEach(n=>ch.appendChild(n));
  r.appendChild(ch);
  return r;
}
function renderControls(){
  const c=$("#controls"); c.innerHTML="";
  if(state.mode==='learn'){
    const themeChips=[chip("全部","theme","",true)];
    Object.keys(THEME_NAME).forEach(t=>themeChips.push(chip(THEME_NAME[t],"theme",t,false)));
    c.appendChild(bar("主题", themeChips));
    c.appendChild(bar("物种", [chip("全部","species","",true), chip("🐶 狗","species","dog",false), chip("🐱 猫","species","cat",false)]));
    const s=el('input'); s.type='search'; s.placeholder='搜索题目或标签…'; s.id='search';
    s.addEventListener('input',()=>{ learnOffset=0; renderApp(); });
    const sr=el('div','bar'); sr.appendChild(s); c.appendChild(sr);
    learnOffset=0;
  } else if(state.mode==='practice'){
    // 行1：主题
    const themeChips=[chip("全部","theme","",true)];
    Object.keys(THEME_NAME).forEach(t=>themeChips.push(chip(THEME_NAME[t],"theme",t,false)));
    c.appendChild(bar("主题", themeChips));
    // 行2：物种 + 题型（并排，都是小分组）
    const row2=el('div','bar');
    row2.appendChild(el('span','bar-label','物种'));
    const sp=el('span','chips'); sp.appendChild(chip("全部","species","",true)); sp.appendChild(chip("🐶 狗","species","dog",false)); sp.appendChild(chip("🐱 猫","species","cat",false)); row2.appendChild(sp);
    row2.appendChild(el('span','bar-label','题型'));
    const tp=el('span','chips'); tp.appendChild(chip("全部","type","",true)); tp.appendChild(chip("单选","type","single",false)); tp.appendChild(chip("判断","type","judge",false)); tp.appendChild(chip("情景","type","scenario",false)); row2.appendChild(tp);
    c.appendChild(row2);
    // 行3：难度
    c.appendChild(bar("难度", [chip("全部","difficulty","",true), chip("基础","difficulty",1,false), chip("进阶","difficulty",2,false), chip("高阶","difficulty",3,false)]));
    // 行4：数量 + 按钮
    const n=el('input'); n.type='number'; n.id='pnum'; n.value='20'; n.min='1'; n.max='200';
    const b=el('button','btn','开始练习'); b.onclick=startPractice;
    c.appendChild(bar(null, [n, b]));
  } else if(state.mode==='exam'){
    const r=el('div','bar');
    r.appendChild(el('span','tip','四主题均衡抽样 · 狗6猫4 · 限时 · 合格线 80%'));
    c.appendChild(r);
    const r2=el('div','bar');
    const b=el('button','btn','开始考核（45 题）'); b.onclick=startExam;
    r2.appendChild(b);
    c.appendChild(r2);
  } else if(state.mode==='wrong'){
    const r=el('div','bar');
    const ids=Object.keys(WRONG);
    r.appendChild(el('span','tip', ids.length? `共 ${ids.length} 道错题` : '还没有错题，去练习吧！'));
    c.appendChild(r);
    if(ids.length){
      const r2=el('div','bar');
      const b1=el('button','btn','重练错题'); b1.onclick=startWrongPractice; r2.appendChild(b1);
      const b2=el('button','btn ghost','清空错题本'); b2.onclick=()=>{ if(confirm('确定清空全部错题？')){ WRONG={}; saveWrong(); renderApp(); } }; r2.appendChild(b2);
      c.appendChild(r2);
    }
  }
  c.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
    const k=ch.dataset.k, v=ch.dataset.v;
    c.querySelectorAll(`.chip[data-k="${k}"]`).forEach(x=>x.classList.remove('on'));
    ch.classList.add('on');
    if(state.mode==='learn'){ learnOffset=0; renderApp(); }
  });
}

/* ---------- 学习模式 ---------- */
let learnOffset=0, LEARN_PAGE=12;
function learnFilter(){
  const theme=$('#controls .chip[data-k="theme"].on')?.dataset.v||"";
  const species=$('#controls .chip[data-k="species"].on')?.dataset.v||"";
  const kw=($('#search')?.value||"").trim();
  return QUESTIONS.filter(q=>{
    if(theme&&q.theme!==theme)return false;
    if(species&&q.species!==species)return false;
    if(kw&&!(q.question.includes(kw)||q.tag.includes(kw)||(q.explanation||"").includes(kw)))return false;
    return true;
  });
}
function renderApp(){
  const app=$("#app"); app.innerHTML="";
  if(state.mode==='learn') return renderLearn(app);
  if(state.mode==='practice'||state.mode==='exam') return renderQuestion(app);
  if(state.mode==='wrong') return renderWrong(app);
}
function renderLearn(app){
  const items=learnFilter();
  if(!items.length){ app.appendChild(el('div','empty','没有匹配的知识卡片')); return; }
  const slice=items.slice(learnOffset, learnOffset+LEARN_PAGE);
  slice.forEach(q=>{
    const card=el('div','kcard');
    card.innerHTML=`<div class="qmeta">${tagHTML(q)}</div>
      <div class="q">${esc(q.question)}</div>
      <div class="ans">${isScenario(q)?'<b>参考要点：</b>'+esc(q.answer):'<b>答案：</b>'+esc(q.answer)}</div>
      <div class="more">${TYPE_NAME[q.type]} · 解析：${esc(q.explanation||'')}</div>`;
    app.appendChild(card);
  });
  if(learnOffset+LEARN_PAGE<items.length){
    const m=el('div','loadmore'); const b=el('button','btn ghost','加载更多 ('+Math.min(LEARN_PAGE,items.length-learnOffset-LEARN_PAGE)+')');
    b.onclick=()=>{ learnOffset+=LEARN_PAGE; renderLearn(app); }; m.appendChild(b); app.appendChild(m);
  }
}

/* ---------- 练习 / 考核 ---------- */
function filterPool(){
  const theme=$('#controls .chip[data-k="theme"].on')?.dataset.v||"";
  const species=$('#controls .chip[data-k="species"].on')?.dataset.v||"";
  const type=$('#controls .chip[data-k="type"].on')?.dataset.v||"";
  const diff=$('#controls .chip[data-k="difficulty"].on')?.dataset.v||"";
  return QUESTIONS.filter(q=>{
    if(theme&&q.theme!==theme)return false;
    if(species&&q.species!==species)return false;
    if(type&&q.type!==type)return false;
    if(diff&&String(q.difficulty)!==String(diff))return false;
    return true;
  });
}
function sample(arr,k){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a.slice(0,k); }
function startPractice(){
  const pool=filterPool();
  let k=parseInt($('#pnum').value)||20; k=Math.max(1,Math.min(200,k));
  if(pool.length<k) k=pool.length;
  state.list=sample(pool,k); state.idx=0; state.sel=null; state.submitted=false;
  state.practiceRight=0; state.practiceDone=0;
  enterSession('practice'); renderApp(); updateProgress(); updateSessionBar();
}
function startExam(){
  const N=45;
  const dogPool=QUESTIONS.filter(q=>q.species==='dog');
  const catPool=QUESTIONS.filter(q=>q.species==='cat');
  const dogN=Math.round(N*0.6), catN=N-dogN;
  const pickBalanced=(pool,count)=>{
    const byTheme={}; Object.keys(THEME_NAME).forEach(t=>byTheme[t]=pool.filter(q=>q.theme===t));
    const out=[]; let i=0;
    while(out.length<count){ const t=Object.keys(THEME_NAME)[i%4]; const arr=byTheme[t];
      if(arr.length){ out.push(arr[Math.floor(Math.random()*arr.length)]); if(out.length>=count)break; } i++;
      if(i>400)break; }
    // 去重补充
    const seen=new Set(out.map(q=>q.id));
    let guard=0;
    while(out.length<count && guard++<2000){ const q=pool[Math.floor(Math.random()*pool.length)]; if(!seen.has(q.id)){ seen.add(q.id); out.push(q); } }
    return out;
  };
  let list=pickBalanced(dogPool,dogN).concat(pickBalanced(catPool,catN));
  for(let i=list.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; }
  state.list=list; state.idx=0; state.sel=null; state.submitted=false;
  state.examUsed={};
  state.examEnd=Date.now()+45*60*1000;
  state.examTimer=setInterval(updateExamClock,1000); updateExamClock();
  renderApp(); updateProgress(); enterSession('exam'); updateSessionBar();
}
function updateExamClock(){
  const left=state.examEnd-Date.now();
  const m=Math.max(0,Math.floor(left/60000)), s=Math.max(0,Math.floor((left%60000)/1000));
  const t=$("#examClock"); if(t) t.textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;
  const sr=$("#sright"); if(sr && state.session==='exam') sr.textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;
  if(left<=0 && state.examTimer){ clearInterval(state.examTimer); state.examTimer=null; finishExam(); }
}
function updateProgress(){
  const w = state.list.length? (state.idx/state.list.length*100)+'%' : '0';
  const p=$("#progress i"); if(p) p.style.width=w;
  const sp=document.querySelector('.sessionbar .sprogress > i'); if(sp) sp.style.width=w;
}
function renderQuestion(app){
  if(!state.list.length){ app.appendChild(el('div','empty','请先在上方点击「开始'+(state.mode==='exam'?'考核':'练习')+'」')); return; }
  if(state.mode==='exam' && state.idx>=state.list.length){ return finishExam(); }
  if(state.mode==='practice' && state.idx>=state.list.length){ return finishPractice(); }
  const q=state.list[state.idx];
  const card=el('div','card');
  const meta=`<div class="qmeta">${tagHTML(q)}`+ (state.mode==='exam'?`<span class="tag" id="examClock"></span>`:'') +`</div>`;
  card.innerHTML=meta+`<div class="q"><span class="num">${state.idx+1}.</span>${esc(q.question)}</div>`;
  const opts=el('div','opts');
  const letters=['A','B','C','D','E','F'];
  if(isScenario(q)){
    const ta=el('textarea'); ta.className='opt'; ta.rows=4; ta.placeholder='写下你的处理思路…'; ta.style.resize='vertical';
    ta.style.width='100%'; ta.style.border='1.5px solid var(--line)'; ta.style.borderRadius='13px'; ta.style.padding='13px';
    ta.style.font='inherit'; ta.style.background='var(--bg)';
    opts.appendChild(ta);
  } else {
    q.options.forEach((o,i)=>{
      const odiv=el('div','opt'); odiv.dataset.v=o;
      odiv.innerHTML=`<span class="lt">${letters[i]}</span><span>${esc(o)}</span>`;
      odiv.onclick=()=>{ if(state.submitted)return; state.sel=o; opts.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); odiv.classList.add('sel'); };
      opts.appendChild(odiv);
    });
  }
  card.appendChild(opts);
  const fb=el('div','feedback'); card.appendChild(fb);
  const nav=el('div','nav');
  const left=el('span','tip',`第 ${state.idx+1} / ${state.list.length} 题`);
  const right=el('div');
  if(!state.submitted){
    const b=el('button','btn', state.mode==='exam'?'提交本题':'提交'); b.onclick=()=>submit(q,fb,opts,nav,left,right);
    right.appendChild(b);
  } else {
    const isLast = state.idx>=state.list.length-1;
    const b=el('button','btn', isLast?'查看结果':'下一题');
    b.onclick=()=>{ state.idx++; state.sel=null; state.submitted=false; renderApp(); updateProgress(); };
    right.appendChild(b);
  }
  nav.appendChild(left); nav.appendChild(right); card.appendChild(nav);
  app.appendChild(card);
  updateSessionBar();
}
function submit(q,fb,opts,nav,left,right){
  if(isScenario(q)){
    state.submitted=true;
    fb.className='feedback ok show';
    fb.innerHTML=`<div class="verdict">✅ 参考思路</div><div class="exp">${esc(q.answer)}<br><b>评分要点：</b>${esc(q.explanation||'')}</div>`;
    const isLast=state.idx>=state.list.length-1;
    right.innerHTML=''; const b=el('button','btn',isLast?'查看结果':'下一题');
    b.onclick=()=>{ state.idx++; state.submitted=false; renderApp(); updateProgress(); };
    right.appendChild(b); return;
  }
  if(state.sel==null){ alert('请先选择一个选项'); return; }
  state.submitted=true; state.examUsed[q.id]=state.sel;
  const correct = state.sel===q.answer;
  if(state.mode==='practice'){ state.practiceDone++; if(correct)state.practiceRight++; }
  if(state.mode==='exam' && !correct){ WRONG[q.id]={your:state.sel}; saveWrong(); }
  if(state.mode==='practice' && !correct){ WRONG[q.id]={your:state.sel}; saveWrong(); }
  opts.querySelectorAll('.opt').forEach(x=>{
    if(x.dataset.v===q.answer) x.classList.add('ok');
    else if(x.dataset.v===state.sel) x.classList.add('bad');
    else x.classList.add('dim');
    x.onclick=null;
  });
  fb.className='feedback show '+(correct?'ok':'bad');
  fb.innerHTML=`<div class="verdict">${correct?'✅ 回答正确':'❌ 回答错误'}</div>
    <div class="exp"><b>正确答案：</b>${esc(q.answer)}<br>${esc(q.explanation||'')}</div>`;
  const isLast=state.idx>=state.list.length-1;
  right.innerHTML=''; const b=el('button','btn',isLast?'查看结果':'下一题');
  b.onclick=()=>{ state.idx++; state.sel=null; state.submitted=false; renderApp(); updateProgress(); };
  right.appendChild(b);
}
function finishPractice(){
  const app=$("#app"); app.innerHTML="";
  const rate=state.practiceDone? Math.round(state.practiceRight/state.practiceDone*100):0;
  const r=el('div','card report');
  r.innerHTML=`<div class="ring"><h2>练习完成</h2><div class="score">${rate}%</div>
    <div class="verdict">答对 ${state.practiceRight} / ${state.practiceDone} 题</div></div>
    <div class="stat"><div class="box"><b>${state.practiceRight}</b><span>正确</span></div>
    <div class="box"><b>${state.practiceDone-state.practiceRight}</b><span>错误</span></div>
    <div class="box"><b>${rate}%</b><span>正确率</span></div></div>
    <div class="tip">错题已自动收入「错题本」</div>`;
  const b=el('button','btn','再来一组'); b.onclick=()=>startPractice(); r.appendChild(b);
  app.appendChild(r);
}
function finishExam(){
  if(state.examTimer){ clearInterval(state.examTimer); state.examTimer=null; }
  const app=$("#app"); app.innerHTML="";
  const total=state.list.length;
  let right=0; const byTheme={};
  state.list.forEach(q=>{ const u=state.examUsed[q.id]; const ok=u===q.answer;
    byTheme[q.theme]=byTheme[q.theme]||{c:0,t:0}; byTheme[q.theme].t++;
    if(ok){ right++; byTheme[q.theme].c++; } });
  const rate=total? Math.round(right/total*100):0;
  const pass=rate>=80;
  const r=el('div','card report');
  r.innerHTML=`<div class="ring"><h2>考核报告</h2><div class="score">${rate}%</div>
    <div class="verdict">${pass?'🎉 达标（≥80%）':'未达标，继续加油'}</div></div>
    <div class="stat"><div class="box"><b>${right}</b><span>答对</span></div>
    <div class="box"><b>${total-right}</b><span>答错</span></div>
    <div class="box"><b>${pass?'达标':'再战'}</b><span>结果</span></div></div>
    <div class="sectin">各主题正确率</div>`;
  Object.keys(THEME_NAME).forEach(t=>{ const b=byTheme[t]; if(!b)return;
    const p=Math.round(b.c/b.t*100);
    const bar=el('div','bar');
    bar.innerHTML=`<span class="lab">${THEME_NAME[t]}</span><span class="track"><i style="width:${p}%"></i></span><span class="v">${p}% (${b.c}/${b.t})</span>`;
    r.appendChild(bar);
  });
  const b=el('button','btn','重做考核'); b.onclick=()=>startExam(); r.appendChild(b);
  app.appendChild(r);
}

/* ---------- 错题本 ---------- */
function startWrongPractice(){
  const ids=Object.keys(WRONG);
  if(!ids.length){ alert('错题本为空'); return; }
  state.list=QUESTIONS.filter(q=>ids.includes(String(q.id)));
  state.idx=0; state.sel=null; state.submitted=false;
  renderApp(); updateProgress();
}
function renderWrong(app){
  const ids=Object.keys(WRONG);
  if(!ids.length){ app.appendChild(el('div','empty','🎉 还没有错题，去练习巩固一下吧！')); return; }
  const items=QUESTIONS.filter(q=>ids.includes(String(q.id)));
  const box=el('div','stat');
  box.innerHTML=`<div class="box"><b>${items.length}</b><span>错题总数</span></div>
    <div class="box"><b>${items.filter(q=>q.species==='dog').length}</b><span>狗</span></div>
    <div class="box"><b>${items.filter(q=>q.species==='cat').length}</b><span>猫</span></div>`;
  app.appendChild(box);
  items.forEach(q=>{
    const w=WRONG[q.id]||{};
    const card=el('div','witem');
    card.innerHTML=`<div class="qmeta">${tagHTML(q)}</div>
      <div class="q">${esc(q.question)}</div>
      <div class="det"><div>你的答案：<span class="your">${esc(w.your||'未作答')}</span></div>
      <div>正确答案：<span class="right">${esc(q.answer)}</span></div>
      <div style="margin-top:6px">${esc(q.explanation||'')}</div></div>`;
    card.querySelector('.q').onclick=()=>card.querySelector('.det').classList.toggle('show');
    const acts=el('div','acts');
    const b1=el('button','btn ghost','看解析'); b1.onclick=()=>card.querySelector('.det').classList.toggle('show'); acts.appendChild(b1);
    const b2=el('button','btn ghost','移除'); b2.onclick=()=>{ delete WRONG[q.id]; saveWrong(); renderApp(); }; acts.appendChild(b2);
    card.appendChild(acts);
    app.appendChild(card);
  });
}

renderControls(); renderApp();
</script>
